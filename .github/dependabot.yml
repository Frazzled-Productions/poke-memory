version: 2
updates:
  # A `@playwright/test` bump also needs every `mcr.microsoft.com/playwright`
  # image tag moved in the same PR; Dependabot only moves the lockfile.
  # scripts/check-playwright-version-drift.mjs lists the file:line of each, and
  # its test fails the full vitest run (the required `Test coverage report`
  # check) until they all match (#2074).
  - package-ecosystem: "npm"
    directory: "/"
    # Open PRs against the qa integration branch, not main. All PR-producing
    # paths target qa; dependency PRs ride the qa -> main promotion PR.
    target-branch: "qa"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      vitest:
        patterns: ["vitest", "@vitest/*", "@testing-library/*"]
      supabase:
        patterns: ["@supabase/*"]
      vercel:
        patterns: ["@vercel/*"]
      tooling:
        patterns: ["typescript", "@types/node"]
      # Keep this group last — its "*" pattern matches any security PR not
      # already claimed by a named group above.
      npm-security-other:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "qa"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
