version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      vitest:
        patterns: ["vitest", "@vitest/*", "@testing-library/*"]
      next-security:
        applies-to: security-updates
        patterns: ["next", "eslint-config-next"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind-security:
        applies-to: security-updates
        patterns: ["tailwindcss", "@tailwindcss/*"]
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*", "@testing-library/*"]
      npm-security-other:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
