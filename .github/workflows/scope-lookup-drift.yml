name: Scope-lookup drift check

# Detects drift between the seed (lib/pokemon/generated.json) and the committed
# server-side scope lookup table (lib/pokemon/scopeLookup.ts). scopeLookup.ts is
# auto-generated by scripts/generate-scope-lookup.mjs and consumed by the
# server-side daily-push scope filter; the generator is run manually, so without
# this check a stale lib/pokemon/generated.json update would silently serve
# out-of-date gen/types data. Mirrors migration-check.yml's drift-check pattern.
#
# The generator imports only Node built-ins (node:fs/promises, node:path,
# node:url) and reads generated.json, so there is no `npm ci` step — plain
# `node` is enough and keeps the job fast.

on:
  pull_request:
    paths:
      - "lib/pokemon/generated.json"
      - "lib/pokemon/scopeLookup.ts"
      - "scripts/generate-scope-lookup.mjs"
      - "scripts/seed-pokemon.mjs"
      - "scripts/seed-version-groups.mjs"
      - ".github/workflows/scope-lookup-drift.yml"

concurrency:
  group: scope-lookup-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Regenerate scopeLookup.ts from the seed
        run: node scripts/generate-scope-lookup.mjs
      - name: Fail if lib/pokemon/scopeLookup.ts is out of date
        run: |
          if ! git diff --exit-code lib/pokemon/scopeLookup.ts; then
            echo "::error::lib/pokemon/scopeLookup.ts is out of date with lib/pokemon/generated.json. Run 'npm run generate:scope-lookup' and commit the result."
            exit 1
          fi
