name: Pseudo-locale drift check

# Detects drift between messages/en.json and the committed pseudo-locale artefact
# messages/xx-pseudo.json. xx-pseudo.json is auto-generated by
# scripts/generate-pseudo-locale.mjs; without this check a new key in en.json
# would silently produce a stale pseudo catalogue, causing i18n-leak tests to miss
# newly-introduced untranslated strings. Mirrors the scope-lookup-drift.yml pattern.
#
# The generator imports only Node built-ins (node:fs, node:path, node:url) and
# reads messages/en.json, so there is no `npm ci` step — plain `node` suffices
# and keeps the job fast.

on:
  pull_request:
    paths:
      - "messages/en.json"
      - "messages/xx-pseudo.json"
      - "scripts/generate-pseudo-locale.mjs"
      - ".github/workflows/pseudo-locale-drift.yml"

concurrency:
  group: pseudo-locale-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Regenerate xx-pseudo.json from messages/en.json
        run: node scripts/generate-pseudo-locale.mjs
      - name: Fail if messages/xx-pseudo.json is out of date
        run: |
          if ! git diff --exit-code messages/xx-pseudo.json; then
            echo "::error::messages/xx-pseudo.json is out of date with messages/en.json. Run 'npm run generate:pseudo-locale' and commit the result."
            exit 1
          fi
