name: Auto Release

# Cuts a SemVer release when changelog fragments exist under
# changelog.d/unreleased/ — otherwise the run no-ops.
#
# Primary trigger: a merged `qa -> main` promotion PR (the qa staging-branch
# workflow, #806). The daily 09:00 UTC cron is kept as a safety net — it cuts
# any fragments a misfired promotion left unreleased. `workflow_dispatch`
# covers manual cuts.
#
# Per AGENTS.md "Versioning":
#   - kind: minor-bump fragment present  → minor bump (0.N.0 → 0.N+1.0)
#   - any other non-empty set of fragments → patch bump (0.N.M → 0.N.M+1)
#
# Each run → at most one commit, one tag, one GitHub Release. The release
# commit + tag are pushed to `main`; a `push` event does not match this
# workflow's schedule/workflow_dispatch/pull_request triggers, so the release
# commit cannot re-fire the workflow. The `[skip ci]` marker on the commit is
# belt-and-braces for the `push`-triggered workflows (`ci.yml`,
# `migration-check.yml`).
#
# On a `qa -> main` trigger, a final step resets `qa` to `main` so the next
# batch run starts from a clean integration branch. If that reset is skipped
# (a prior step failed), the daily `qa-drift-check` job detects the un-reset
# `qa` and opens a tracking issue rather than letting the drift surface as
# conflicts at the next promotion (#1664).
#
# One-time bootstrap: if no `v0.1.0` tag exists when this workflow first runs,
# the bootstrap step creates the tag at SHA cddb3a8 (the last commit whose
# CHANGELOG content matched the current `[0.1.0]` section) and a matching
# GitHub Release. Subsequent runs no-op the bootstrap.
#
# Prerequisite: the `poke-memory-bot` App must be added as a bypass actor on
# the `main-protection` ruleset (ID 16176438) so direct pushes to `main`
# succeed. If the push step fails with a protected-branch error, that is the
# fix.

on:
  # Primary: a merged `qa -> main` promotion PR. The job `if:` below filters
  # to merged PRs whose head branch is `qa`.
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    # 09:00 UTC daily — safety net. Cuts any fragments a misfired `qa -> main`
    # promotion left unreleased (no-ops if there are none).
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull_request trigger, run only for a merged `qa -> main` PR. A
    # closed-without-merge PR, or a merge from any other branch, is ignored.
    # schedule and workflow_dispatch always run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'qa')
    permissions:
      contents: write

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Always operate on `main` itself — for a pull_request trigger the
          # default ref is the merge ref, not the post-merge branch tip.
          ref: main
          fetch-depth: 0

      # Node major read from .nvmrc (single source of truth) to match
      # engines.node ("24.x") + engine-strict (#1512); without a pin the runner
      # defaults to an older major and `npm install` below fails EBADENGINE,
      # which broke the release job (#210).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Configure git identity
        run: |
          git config user.name "poke-memory-bot[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"

      - name: Backfill v0.1.0 tag + release (one-time bootstrap)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin --quiet
          if git rev-parse --verify --quiet refs/tags/v0.1.0 > /dev/null; then
            echo "v0.1.0 tag already exists — skipping bootstrap."
            exit 0
          fi
          BOOTSTRAP_SHA=cddb3a8f004a81d1fbc60f4117895770c137adea
          echo "Creating v0.1.0 tag at ${BOOTSTRAP_SHA}..."
          git tag v0.1.0 "${BOOTSTRAP_SHA}"
          git push origin v0.1.0
          node .github/scripts/extract-changelog-section.mjs 0.1.0 > "${RUNNER_TEMP}/v010-notes.md"
          if gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "v0.1.0 release already exists — skipping release create."
          else
            gh release create v0.1.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v0.1.0" \
              --notes-file "${RUNNER_TEMP}/v010-notes.md"
          fi

      - name: Cut release (assemble fragments, bump package.json)
        id: cut
        run: node .github/scripts/cut-release.mjs

      - name: Commit, tag, push
        if: steps.cut.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.cut.outputs.version }}
          BUMP_TYPE: ${{ steps.cut.outputs.bumpType }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git rm --ignore-unmatch changelog.d/unreleased/*.md
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} (${BUMP_TYPE}) [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.cut.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.cut.outputs.version }}
          BODY_FILE: ${{ steps.cut.outputs.bodyFile }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${NEW_VERSION}" \
            --notes-file "${BODY_FILE}"

      - name: Reset qa to main
        # Only after a `qa -> main` promotion merge. schedule/workflow_dispatch
        # runs leave `qa` untouched — it may hold in-progress batch work.
        # HEAD is `main` including the release commit just pushed (if any), so
        # the next batch run starts from a clean, released integration branch.
        # Requires poke-memory-bot to be a bypass actor on the `qa` ruleset.
        # `success() &&` is explicit: a custom `if:` otherwise drops the
        # implicit success check, which would reset `qa` even after a failed
        # release push. On failure the reset is skipped; the daily
        # `qa-drift-check` job below then detects the un-reset `qa` and opens a
        # tracking issue (with the `/batch-issues` pre-flight as a secondary
        # backstop), rather than the drift being discovered at the next promotion.
        if: success() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git push origin "+HEAD:refs/heads/qa"
          echo "Reset qa to main ($(git rev-parse --short HEAD))."

  backmerge-hotfix:
    name: Backmerge main into qa after hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs when a non-qa branch merges directly to main (i.e. a hotfix).
    # The `release` job handles the qa -> main direction; this job handles
    # the reverse so qa never silently falls behind main after a hotfix,
    # which previously caused the next qa -> main PR to fail the
    # "branch must be up to date" gate and block auto-merge.
    # Uses merge (not force-reset) to preserve any in-progress batch work on qa.
    # If the merge has conflicts the job fails visibly, requiring manual resolution.
    # Requires poke-memory-bot to be a bypass actor on the `qa-staging` ruleset.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'qa'
    permissions:
      contents: write

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: qa
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "poke-memory-bot[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"

      - name: Merge main into qa
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-ff origin/main -m "chore: backmerge main into qa after hotfix (#${PR_NUMBER})"
          git push origin qa
          echo "Merged main ($(git rev-parse --short origin/main)) into qa."

  qa-drift-check:
    name: Check qa has not drifted from main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Daily safety net for the "Reset qa to main" step. If that step is skipped
    # (a prior step in the release job failed), qa keeps the released commits as
    # un-reset history and the next qa -> main promotion comes up with merge
    # conflicts (#1659, #1664). This job detects the drift and opens/updates a
    # tracking issue. It does NOT auto-reset: qa may carry genuine un-promoted
    # batch work that a blind force-reset would destroy, so reconciliation stays
    # human-in-the-loop (the same channel as the /batch-issues pre-flight).
    #
    # Scoped to schedule/workflow_dispatch only: on a pull_request (qa -> main
    # merge) the release job's own reset step handles the post-merge state, and
    # running here would race it. The shared `auto-release` concurrency group also
    # queues this behind any in-flight release, so a mid-promotion false positive
    # cannot occur.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect qa drift and open/update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main qa --quiet

          MARKER="<!-- qa-drift-check -->"

          # Healthy invariant: main is an ancestor of qa (qa == main, or qa is
          # main + un-promoted batch work). Drift = main is NOT an ancestor.
          if git merge-base --is-ancestor origin/main origin/qa; then
            DRIFTED=false
          else
            DRIFTED=true
          fi

          # Marker-based dedup. The GitHub search index strips HTML comments
          # (WORKFLOW.md), so we do NOT use `--search`: that pre-filter could
          # drop the tracking issue unpredictably and, capped at a low limit,
          # hide it from the jq match entirely. Instead pull the full open-issue
          # list (capped at 100) and match the marker locally with jq, which is
          # reliable. No `2>/dev/null` either: a gh failure must surface via
          # `set -euo pipefail` rather than look like "no existing issue" and
          # open a duplicate on every run.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --json number,body --limit 100 \
            | jq -r --arg m "$MARKER" '[.[] | select(.body | contains($m))] | .[0].number // empty')

          if [ "$DRIFTED" = "false" ]; then
            echo "qa is healthy: main is an ancestor of qa."
            if [ -n "$EXISTING" ]; then
              echo "Closing stale tracking issue #$EXISTING."
              gh issue close "$EXISTING" --repo "$REPO" \
                --comment "$MARKER"$'\n'"qa is back in sync with main (main is an ancestor of qa); closing automatically."
            fi
            exit 0
          fi

          MAIN_SHA=$(git rev-parse --short origin/main)
          QA_SHA=$(git rev-parse --short origin/qa)
          # --left-right --count yields "<main-only>\t<qa-only>", so the report is
          # accurate even for a bidirectional divergence, not just the expected
          # reset-skipped (qa-only) case.
          COUNTS=$(git rev-list --left-right --count origin/main...origin/qa)
          BEHIND=$(echo "$COUNTS" | cut -f1)
          AHEAD=$(echo "$COUNTS" | cut -f2)
          echo "DRIFT: main ($MAIN_SHA) is not an ancestor of qa ($QA_SHA); qa is $AHEAD ahead of and $BEHIND behind main."

          BODY_FILE=$(mktemp)
          cat >"$BODY_FILE" <<EOF
          $MARKER
          **qa has drifted from main**

          \`main\` (\`$MAIN_SHA\`) is not an ancestor of \`qa\` (\`$QA_SHA\`); qa is $AHEAD commit(s) ahead of and $BEHIND behind main. This usually means the auto-release "Reset qa to main" step was skipped because a prior step in the release job failed, leaving qa with already-released commits as un-reset history. Left unreconciled, the next \`qa -> main\` promotion comes up with merge conflicts (#1659).

          **How to reconcile (human-in-the-loop, since this job does not auto-reset, to avoid destroying un-promoted batch work):**
          1. \`git fetch origin && git merge-base --is-ancestor origin/main origin/qa\` to confirm (a non-zero exit means drifted).
          2. If qa carries genuine un-promoted batch work: merge main into qa, \`git checkout qa && git merge --no-ff origin/main && git push origin qa\`.
          3. If qa only has already-released commits: reset qa to main, \`git push origin +origin/main:refs/heads/qa\` (needs poke-memory-bot bypass-actor credentials on the \`qa\` ruleset).

          Opened by the \`qa-drift-check\` job in \`auto-release.yml\`. It updates in place on each daily run and closes automatically once main is an ancestor of qa again.
          EOF

          if [ -n "$EXISTING" ]; then
            echo "Updating tracking issue #$EXISTING."
            gh issue edit "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
          else
            echo "Opening new tracking issue."
            gh issue create --repo "$REPO" \
              --title "qa branch has drifted from main" \
              --body-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"
