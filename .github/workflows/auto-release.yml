name: Auto Release

# Cuts a SemVer release on a daily schedule (and on manual dispatch) when
# changelog fragments exist under changelog.d/unreleased/. Otherwise the run
# no-ops. Batching releases on a cron — rather than firing on every push to
# `main` — keeps Vercel production deploys infrequent and predictable.
#
# Per AGENTS.md "Versioning":
#   - kind: minor-bump fragment present  → minor bump (0.N.0 → 0.N+1.0)
#   - any other non-empty set of fragments → patch bump (0.N.M → 0.N.M+1)
#
# Each cron tick (or manual dispatch) → at most one commit, one tag, one
# GitHub Release. The release commit carries `[skip ci]` as defence in depth
# against self-triggering loops; the schedule/workflow_dispatch trigger (not
# push) means a release commit landing on main cannot re-fire this workflow.
#
# One-time bootstrap: if no `v0.1.0` tag exists when this workflow first runs,
# the bootstrap step creates the tag at SHA cddb3a8 (the last commit whose
# CHANGELOG content matched the current `[0.1.0]` section) and a matching
# GitHub Release. Subsequent runs no-op the bootstrap.
#
# Prerequisite: the `poke-memory-bot` App must be added as a bypass actor on
# the `main-protection` ruleset (ID 16176438) so direct pushes to `main`
# succeed. If the push step fails with a protected-branch error, that is the
# fix.

on:
  schedule:
    # 09:00 UTC daily. Cuts a release containing everything merged in the
    # previous 24 hours (or no-ops if no fragments exist).
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "poke-memory-bot[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"

      - name: Backfill v0.1.0 tag + release (one-time bootstrap)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin --quiet
          if git rev-parse --verify --quiet refs/tags/v0.1.0 > /dev/null; then
            echo "v0.1.0 tag already exists — skipping bootstrap."
            exit 0
          fi
          BOOTSTRAP_SHA=cddb3a8f004a81d1fbc60f4117895770c137adea
          echo "Creating v0.1.0 tag at ${BOOTSTRAP_SHA}..."
          git tag v0.1.0 "${BOOTSTRAP_SHA}"
          git push origin v0.1.0
          node .github/scripts/extract-changelog-section.mjs 0.1.0 > "${RUNNER_TEMP}/v010-notes.md"
          if gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "v0.1.0 release already exists — skipping release create."
          else
            gh release create v0.1.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v0.1.0" \
              --notes-file "${RUNNER_TEMP}/v010-notes.md"
          fi

      - name: Cut release (assemble fragments, bump package.json)
        id: cut
        run: node .github/scripts/cut-release.mjs

      - name: Commit, tag, push
        if: steps.cut.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.cut.outputs.version }}
          BUMP_TYPE: ${{ steps.cut.outputs.bumpType }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git rm --ignore-unmatch changelog.d/unreleased/*.md
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} (${BUMP_TYPE}) [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.cut.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.cut.outputs.version }}
          BODY_FILE: ${{ steps.cut.outputs.bodyFile }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${NEW_VERSION}" \
            --notes-file "${BODY_FILE}"
