name: Issue Overlap Scan

# Manual scan over open `priority:now` and `priority:next` issues. Finds
# pairs that should be merged (duplicate intent), overlap (same feature
# area, partial intersection), or conflict (one would undo or block the
# other), and posts a comment on each issue in the pair so the maintainer
# can reconcile them.
#
# Conflict markers are load-bearing: the auto-issue `/go` workflow refuses
# to run on an issue with an unresolved `:conflict:` marker linked to
# another open issue. Merge and overlap markers are advisory.
#
# Re-runs are de-duped per (pair, kind) via a
# `<!-- overlap-scan:i+j:<kind> -->` marker on each comment.

on:
  workflow_dispatch:

concurrency:
  group: issue-overlap-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30
          prompt: |
            You are running an issue-overlap scan on this repository.

            Read AGENTS.md (loaded via CLAUDE.md) for project conventions.

            **Goal:** find pairs of currently-open issues that should be
            merged, that overlap, or that conflict, and post a comment on
            each issue in the pair so the maintainer can reconcile them.

            **Scope:** only scan issues labelled `priority:now` or
            `priority:next`. Skip everything else — `priority:later` and
            unlabelled issues are out of scope.

            **Three kinds:**

            - `merge` — same intent / duplicate. The two issues describe
              substantially the same feature; one should be closed as a
              duplicate of the other. Be conservative — only flag when
              the issues are substantively the same, not merely adjacent.
            - `overlap` — same feature area, partial intersection. Both
              can ship but require coordinated scope. This is the
              lowest-stakes kind; default to it when unsure between
              `overlap` and `merge`.
            - `conflict` — mutually exclusive. One would undo or block
              the other. The auto-issue `/go` workflow will refuse to run
              on an issue with an unresolved conflict marker, so false
              positives are expensive — only flag clear mutual exclusion.

            Workflow:

            1. Fetch candidates:
               `gh issue list --state open --label priority:now --json number,title,body,labels --limit 200`
               `gh issue list --state open --label priority:next --json number,title,body,labels --limit 200`
               Merge and de-dupe by issue number.

            2. For each candidate, fetch its existing comments
               (`gh issue view <num> --json comments`) and parse any whose
               body starts with `<!-- overlap-scan:i+j:<kind> -->`. Each
               such marker represents a (pair, kind) combination already
               linked from a prior scan — skip that exact (i, j, kind) in
               step 3. Note: the same pair may legitimately have markers
               of different kinds across runs (e.g. an `overlap` first,
               then a later `conflict` after an issue body changed); only
               skip on exact (i, j, kind) match.

            3. Analyse the candidates and identify pairs (i, j) with i < j
               that warrant a marker. For each new pair, classify into
               exactly one kind (`merge`, `overlap`, or `conflict`) per
               the definitions above, and write a one-sentence reason
               the maintainer can act on. Skip pairs whose (i, j, kind)
               is already linked.

            4. For each new finding, post a comment on BOTH issues. The
               marker MUST be the first line, MUST encode the pair as
               `i+j` with the lower number first (regardless of which
               issue you're commenting on), and MUST encode the kind.
               Use the appropriate template:

               For `merge`:

                   <!-- overlap-scan:i+j:merge -->
                   **Overlap scan**: this looks like a duplicate of #<other>.

                   <one-sentence reason>

                   _Consider closing one as a duplicate of the other._

               For `overlap`:

                   <!-- overlap-scan:i+j:overlap -->
                   **Overlap scan**: this overlaps with #<other>.

                   <one-sentence reason>

                   _Coordinate scope before implementing either._

               For `conflict`:

                   <!-- overlap-scan:i+j:conflict -->
                   **Overlap scan**: this conflicts with #<other> (BLOCKING).

                   <one-sentence reason>

                   _The auto-issue `/go` workflow will refuse to run until this is reconciled. Resolve by closing one issue, deleting this comment, or updating both issues to remove the conflict._

               Use `gh issue comment <num> --body-file <path>`.

            5. Print a summary line to stdout: how many candidates were
               considered, how many (pair, kind) combinations were already
               linked (skipped), and how many new comments were posted.
               List the new findings grouped by kind.

            If you can't fetch issues or hit a blocker, exit non-zero with
            a clear error message — don't post partial data.
