name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR by what changed, so test/e2e bodies can skip when irrelevant.
  # The `test` and `e2e` jobs themselves always run (they are required checks),
  # but their inner steps are gated on these outputs and become no-ops when the
  # changes don't warrant the work. On `push` to main, both outputs are forced
  # true so the full suite always runs as a safety net.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      e2e_relevant: ${{ steps.decide.outputs.e2e_relevant }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # `code` matches any changed file that isn't in the docs/agents/changelog
          # ignore list. dorny/paths-filter uses picomatch — a `!`-prefixed pattern
          # excludes matches from earlier positive patterns, so `**` followed by
          # exclusions yields "any file except these".
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!changelog.d/**'
              - '!docs/**'
              - '!.claude/agents/**'
              - 'changelog.d/unreleased/**'
            e2e_relevant:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - '.github/workflows/ci.yml'
      - name: Decide outputs (force true on push to main)
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "e2e_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "e2e_relevant=${{ steps.filter.outputs.e2e_relevant }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Skip notice (docs-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected — skipping typecheck/build/vitest."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.code == 'true'
        with:
          # vitest --changed needs history to diff against the base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npm run lint
        if: needs.changes.outputs.code == 'true'
      - run: npm run typecheck
        if: needs.changes.outputs.code == 'true'
      - run: npm run build
        if: needs.changes.outputs.code == 'true'
      - name: Guard against seed bundling (#1677)
        if: needs.changes.outputs.code == 'true'
        run: npm run check:bundle
      - name: Run vitest (changed only on PR, full on push)
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            npm test -- --changed "origin/${{ github.base_ref }}"
          else
            npm test
          fi
      - name: Upload .next build for e2e
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          # `public/sw/` carries the statically-built service worker
          # (scripts/build-sw.mjs, #1752). It is gitignored, so the e2e job's
          # fresh checkout does not have it; without bundling it here `npm start`
          # would 404 on /sw/sw.js and the smoke SW assertion would fail.
          path: |
            .next/
            public/sw/
          retention-days: 1
          include-hidden-files: true

  e2e-browser:
    # Playwright E2E, split by browser project (#643): `chromium` and
    # `mobile-safari` run as parallel matrix legs to cut wall-clock time. The
    # `e2e` aggregator job below collapses both legs into a single status, so
    # the required-check name in the main-protection ruleset stays `e2e`
    # regardless of how this matrix changes.
    #
    # Runs inside the official Playwright container: browsers and their system
    # deps are baked in, so there is no `playwright install --with-deps` step
    # and therefore no `apt-get` against the flaky azure.archive.ubuntu.com
    # mirror (#644). The image tag MUST track the @playwright/test version
    # resolved in package-lock.json — the image ships Node 24, matching the
    # test job.
    needs: [changes, test]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Both legs always report so a failure in one is not masked by a
      # cancelled sibling.
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
    steps:
      - name: Skip notice (no app/lib/components/public/e2e change)
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No e2e-relevant changes detected — skipping Playwright suite."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.e2e_relevant == 'true'
      - name: Cache npm
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
        if: needs.changes.outputs.e2e_relevant == 'true'
      - name: Download .next build from test job
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/download-artifact@v8
        with:
          name: next-build
          # Extract to the workspace root: the artifact preserves the structure
          # relative to the least-common-ancestor of the uploaded paths
          # (`.next/` and `public/sw/`), so this restores both at the repo root
          # rather than nesting them under a `.next/` prefix (#1752).
          path: .
      - name: Start Next.js and run Playwright
        if: needs.changes.outputs.e2e_relevant == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          npm start &
          echo $! > /tmp/next.pid
          npx wait-on http://localhost:3000 --timeout 60000
          # Invoke Playwright directly with only the matrix project. The
          # `test:e2e` npm script hardcodes the four functional projects (for
          # local macOS runs), so `npm run test:e2e -- --project=...` would be
          # additive and each matrix leg would run every project. The matrix
          # below must stay [chromium, mobile-safari]; the desktop-webkit and
          # mobile-chrome projects are for local/dispatch use only.
          npx playwright test --project=${{ matrix.project }}
      - name: Stop Next.js
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        run: |
          if [ -f /tmp/next.pid ]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright report
        if: failure() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Per-project name: two matrix legs uploading the same artifact name
          # would collide.
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          # Fail loud if the html reporter has not produced the directory, so
          # a future config drift (e.g. dropping the html reporter from
          # playwright.config.ts) cannot silently upload an empty artifact
          # and leave the maintainer without diff images. See #1127.
          if-no-files-found: error

  e2e-real-auth:
    # Real-auth E2E (#1710): exercises the username/password door against the
    # dedicated QA Supabase project on localhost (NOT the SSO-gated preview).
    # This is the durable guard for the #1709 regression (sign-in succeeded
    # server-side but the UI never reflected it).
    #
    # Builds its OWN server: NEXT_PUBLIC_* are inlined at BUILD time, and the
    # shared `next-build` artifact from the `test` job is built with guest/no-
    # Supabase env, so it cannot serve real auth. This job bakes the QA env into
    # its own build + start.
    #
    # Fork guard: the QA_* secrets are not exposed to fork PRs, so the job would
    # hard-fail. Skip on forks (the spec's beforeAll throws without the env).
    needs: [changes, test]
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    container:
      # Same pinned Playwright image as e2e-browser (browsers + Node 24 baked in).
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip notice (no e2e-relevant change)
        if: needs.changes.outputs.e2e_relevant != 'true'
        run: echo "No e2e-relevant changes detected — skipping real-auth Playwright suite."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.e2e_relevant == 'true'
      - name: Cache npm
        if: needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
        if: needs.changes.outputs.e2e_relevant == 'true'
      - name: Build with QA Supabase env baked in
        if: needs.changes.outputs.e2e_relevant == 'true'
        env:
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so the
          # QA project must be provided HERE for real auth to work at runtime.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start Next.js and run the real-auth spec
        if: needs.changes.outputs.e2e_relevant == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # The spec (Node side) reads these to drive the RLS round-trip and the
          # delete_account teardown via a fresh supabase-js client.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Unique per run+attempt so concurrent / repeated runs never collide on
          # the ephemeral username, and no QA account accretes.
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm start &
          echo $! > /tmp/next.pid
          npx wait-on http://localhost:3000 --timeout 60000
          # Dedicated auth-real project (Desktop Chrome); all functional
          # projects testIgnore this spec so it only runs here with the QA env.
          npx playwright test --project=auth-real
      - name: Stop Next.js
        if: always() && needs.changes.outputs.e2e_relevant == 'true'
        run: |
          if [ -f /tmp/next.pid ]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright report
        if: failure() && needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-auth
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  e2e:
    # Aggregator: the single required status check that gates on every
    # `e2e-browser` matrix leg AND the `e2e-real-auth` job. Keeping a stable job
    # named `e2e` means the required-check entry in the main-protection ruleset
    # never has to change when matrix legs are added, removed, or renamed.
    needs: [e2e-browser, e2e-real-auth]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify all e2e matrix legs passed
        run: |
          result="${{ needs.e2e-browser.result }}"
          echo "e2e-browser matrix result: $result"
          # A skipped matrix (docs-only change) is a pass. Anything other than
          # success or skipped — failure, cancelled — fails the gate.
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::One or more e2e matrix legs did not pass (result: $result)."
            exit 1
          fi
      - name: Verify the real-auth job passed
        run: |
          result="${{ needs.e2e-real-auth.result }}"
          echo "e2e-real-auth result: $result"
          # Skipped is a pass: docs-only change (e2e_relevant false) or a fork PR
          # (no QA secrets). Anything other than success or skipped fails the gate.
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::The e2e-real-auth job did not pass (result: $result)."
            exit 1
          fi
