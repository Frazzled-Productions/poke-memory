# Uploads each pull request's preview version (changes preview-deploy-guard, koinori #2925 F3 and F4,
# and preview-upload-trust-main, #2415).
#
# deploy.yml's `preview` job builds and bundles the PR with no environment and no secret, and uploads
# the artefact `preview-bundle`. When that Deploy run succeeds, this `workflow_run` workflow takes
# over. GitHub always runs it from the DEFAULT branch's copy of this file, on the default branch ref,
# so a pull request cannot change what runs here or reach the `Preview` environment, whose
# deployment branch rule admits only `main`.
#
# - Only for a same-repository pull request into `qa` or `main` whose Deploy run succeeded.
# - No CLOUDFLARE_PREVIEW_API_TOKEN in `Preview` (F4: a name of its own, never CLOUDFLARE_API_TOKEN,
#   so no repository or organisation secret can stand in): a notice, and the run is green.
# - Everything that runs or configures a run comes from a checkout of `main`, whatever the PR's base:
#   wrangler.jsonc (so the preview bindings are main's, never the PR's or qa's), package.json and
#   package-lock.json (trusted wrangler and Playwright), .npmrc, .nvmrc, playwright.config.ts and the auth
#   specs. `qa` takes any CI-green change, so it is not trusted here (#2415). Every wrangler call
#   names that config.
# - The artefact is untrusted bytes: symlinks and anything but plain files are refused, and nothing in
#   it is executed here. Only its Worker (uploaded as it is, `--no-bundle`) and its static assets are
#   used.
# - No D1: this workflow never migrates or seeds the preview database, so its token needs only Workers
#   permissions on poke-memory-preview (ops #612). deploy.yml's production job applies main's
#   migrations and seed to it, so every preview runs against main's schema; a PR's own migration
#   reaches it only once promoted.
# - Read-only compares of main with the PR head and with its base branch name the trusted files and
#   migrations the preview does not get yet, in a notice and the PR comment.
# - PR number, base branch and head SHA come from the event, never from the artefact.
#
# Active only once this file is on `main`: until a qa-to-main promotion carries it there, previews
# are not uploaded at all. None of these jobs is a required check, and their results show on this
# run, not on the PR (the comment links the preview).
name: Preview upload

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

concurrency:
  # One upload per PR branch at a time; a newer push replaces an older upload still running. Keyed
  # on the head repository too, so a fork's branch of the same name cannot cancel an upload.
  group: preview-upload-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  upload:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null &&
      contains(fromJSON('["qa","main"]'), github.event.workflow_run.pull_requests[0].base.ref)
    # Deployment branches: `main` only. Holds CLOUDFLARE_PREVIEW_API_TOKEN (none yet).
    environment: Preview
    # GitHub-hosted and ephemeral, never self-hosted: PR code runs on PR runners.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Check Cloudflare is set up
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLOUDFLARE_PREVIEW_API_TOKEN secret in the Preview environment, so no preview version is uploaded. CI still builds and tests the PR."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - if: steps.token.outputs.ok == 'true'
        name: Check main's wrangler.jsonc
        id: ready
        run: |
          if [ ! -f wrangler.jsonc ]; then
            echo "::notice::No wrangler.jsonc on main, so no preview version is uploaded."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_' wrangler.jsonc; then
            echo "::notice::wrangler.jsonc on main still holds placeholder ids, so no preview version is uploaded."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: preview-bundle
          path: ${{ runner.temp }}/preview-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.ready.outputs.ok == 'true'
        name: Check the bundle and put it where wrangler.jsonc expects it
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/preview-bundle"
          if [ -n "$(find "$BUNDLE" -type l -print -quit)" ]; then
            echo "::error::The preview bundle holds a symlink; refusing it."; exit 1
          fi
          if [ -n "$(find "$BUNDLE" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::The preview bundle holds something other than files and directories; refusing it."; exit 1
          fi
          test -f "$BUNDLE/worker/index.js"
          test -d "$BUNDLE/assets"
          # wrangler.jsonc serves assets from .open-next/assets.
          mkdir -p .open-next
          mv "$BUNDLE/assets" .open-next/assets

      - if: steps.ready.outputs.ok == 'true'
        name: List what the preview does not get from the PR yet
        # Read-only, with this run's own token, and nothing of the PR is checked out. Two three-dot
        # compares against main: the PR head, and the base branch (deploy.yml built the bundle from the
        # PR merged into its base, so qa changes the PR branch lacks are in it too). Together they name
        # the trusted files this preview takes from main instead, and migrations main has not applied
        # to the preview database. Each files list comes whole (up to 300) on the first page. Names are
        # kept only if made of safe characters (no `@`, `:` or `%`), so a crafted file name cannot
        # inject a workflow command, a mention or Markdown; names left out are counted. A failure only
        # warns: this is a notice, never a reason to skip the upload (continue-on-error makes sure).
        id: differs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          set -uo pipefail
          files=""
          for target in "$HEAD_SHA" "$BASE_REF"; do
            # First line: how many files GitHub listed; then the safe names, one per line.
            if ! listed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${target}?per_page=1" \
                --jq '(.files | length), (.files[]?.filename | select(test("\\A[A-Za-z0-9._/+-]+\\z")))'); then
              echo "::warning::Could not compare main with ${target}, so this run may not name every trusted file or migration that differs from main."
              continue
            fi
            total=$(printf '%s\n' "$listed" | head -n 1)
            names=$(printf '%s\n' "$listed" | tail -n +2)
            kept=$(printf '%s\n' "$names" | grep -c . || true)
            if [ "$total" -ge 300 ]; then
              echo "::warning::The compare of main with ${target} lists 300 files, GitHub's limit, so the lists below may be incomplete."
            fi
            if [ "$kept" -lt "$total" ]; then
              echo "::warning::$((total - kept)) file name(s) in the compare of main with ${target} hold unusual characters and are not listed below."
            fi
            files=$(printf '%s\n%s\n' "$files" "$names")
          done
          files=$(printf '%s\n' "$files" | grep . | sort -u || true)
          trusted=$(printf '%s\n' "$files" | grep -E '^(wrangler\.jsonc|package\.json|package-lock\.json|\.npmrc|\.nvmrc|playwright\.config\.ts|e2e/.+)$' | paste -sd ' ' - || true)
          migrations=$(printf '%s\n' "$files" | grep -E '^db/d1/migrations/.+' | paste -sd ' ' - || true)
          if [ -n "$trusted" ]; then
            echo "::notice::These trusted files differ from main, and this preview uses main's copies until they are promoted: ${trusted}"
          fi
          if [ -n "$migrations" ]; then
            echo "::notice::These migration files differ from main, and main's deploy applies only main's migrations to the preview database: ${migrations}"
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          echo "migrations=${migrations}" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true'
        name: Upload the preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --config wrangler.jsonc --env preview --preview-alias "pr-${PR_NUMBER}" --no-bundle "$RUNNER_TEMP/preview-bundle/worker/index.js" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE "https://pr-${PR_NUMBER}-[A-Za-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -n 1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true'
        name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED: ${{ steps.differs.outputs.trusted }}
          MIGRATIONS: ${{ steps.differs.outputs.migrations }}
        run: |
          set -euo pipefail
          MARKER="<!-- poke-memory-preview -->"
          if [ -n "$PREVIEW_URL" ]; then
            line="Preview version for ${SHA}: ${PREVIEW_URL}"
          else
            line="Preview version for ${SHA} uploaded; its URL was not found in the log, see this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          body="${MARKER}
          ${line}

          It runs on the separate poke-memory-preview Worker with its own seeded database (two test users, no real data unless a copy rehearsal loaded some), without the analytics beacon, push or email sends. Its bindings and config are main's, and main's deploy applies main's migrations to its database."
          if [ -n "$TRUSTED" ]; then
            body="${body}

          Trusted files that differ from main, so this preview uses main's copies until they are promoted: ${TRUSTED}"
          fi
          if [ -n "$MIGRATIONS" ]; then
            body="${body}

          This preview runs against main's database schema until these migrations reach main (unless someone applied them to the preview database by hand): ${MIGRATIONS}"
          fi
          # Find this job's own comment: posted with GITHUB_TOKEN (REST `user.login` is
          # `github-actions[bot]`, a login no human account can hold) with the marker as its whole
          # first line. A comment anyone else posts with the marker is ignored, not edited (#2124).
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -rn --arg marker "$MARKER" --arg author "github-actions[bot]" \
                '[inputs[] | select(.user.login == $author and (((.body // "") | split("\n")[0] | rtrimstr("\r")) == $marker)) | .id] | first // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

  preview-e2e:
    # Playwright auth specs against the preview version (was deploy.yml's `preview-e2e`, and before
    # that e2e.yml on a Vercel deployment_status). Not a required check, and deliberately not named
    # `e2e`: that name is ci.yml's required aggregator.
    #
    # Scope: ONLY `e2e/auth.spec.ts` runs here (#829). The full suite against a remote preview
    # chronically timed out and never completed. Guest-mode smoke is covered by the required
    # `e2e-browser` check, which runs a local build. The specs come from main, like everything else
    # in this workflow; the PR's own copy runs in ci.yml.
    name: Preview auth specs
    needs: upload
    if: needs.upload.outputs.url != ''
    runs-on: ubuntu-latest
    # Browsers and system deps are baked into the image (#644). The tag must track the
    # @playwright/test version in package-lock.json (`npm run lint:playwright-pin` checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Test-only mock-auth seam (#751). `NEXT_PUBLIC_E2E_AUTH_MOCK` is inlined at BUILD time and
      # `isMockAuthEnabled()` is false in any production build, which the preview Worker is, so
      # the signed-in specs detect the seam is not live and skip themselves; the rest of the
      # auth specs run against the preview. The env var below only documents intent on the
      # runner side and is harmless there. See WORKFLOW.md "Mock-auth seam (E2E)".
      - name: Run Playwright auth specs
        run: npx playwright test e2e/auth.spec.ts --project=chromium --project=mobile-safari
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.upload.outputs.url }}
          NEXT_PUBLIC_E2E_AUTH_MOCK: "1"

      # Upload the report only on failure: failures are the only case a maintainer needs the
      # diff for (#1127). Fail loud if the html reporter produced nothing.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
