name: Restore test

# Proof that the nightly D1 backup can be restored (OpenSpec change move-to-cloudflare,
# design D10). Manual only for now: the monthly schedule is off until the owner decides on it, because
# a run copies the full production backup (personal data) to a GitHub-hosted runner, a transfer the
# privacy notice does not disclose. Run it from the Actions tab when a restore check is wanted. POST /api/cron/backup writes every table as SQL INSERTs to the R2 bucket
# `poke-memory-backups` (EU jurisdiction) at d1/YYYY-MM-DD.sql each night at 02:00 UTC. This job:
#
#   1. downloads the newest object under d1/ (and fails if it is more than 3 days old, which means
#      the nightly backup has stopped);
#   2. applies db/d1/migrations to a fresh local D1, then executes the backup file into it;
#   3. fails if any table's row count differs from the count in the file's header.
#
# The file format (INSERTs in dependency order after a `-- rows <table>: <count>` header line per
# table, between dropping and recreating the triggers) is documented in
# scripts/cloudflare/check-restore.mjs, which does step 3.
#
# Uses the repo's CLOUDFLARE_API_TOKEN secret (it has Workers R2 Storage Write, owner yes on
# 19 November 2026) and the CLOUDFLARE_ACCOUNT_ID variable, through the Cloudflare REST API for R2
# objects. Without them the run skips with a notice and passes. The backup holds personal data and
# this repo's logs are public: it is written only to the runner's temporary folder, never uploaded as
# an artifact, and no step prints its contents (only table names and row counts are logged).
#
# Not watched by cron-health-monitor.yml while it has no schedule.

on:
  workflow_dispatch:

concurrency:
  group: restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    if: github.repository == 'Frazzled-Productions/poke-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Cloudflare access is set up
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable, so the restore test is skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the newest backup
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: poke-memory-backups
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/r2/buckets/${BUCKET}/objects"
          # Keys are d1/YYYY-MM-DD.sql, so the newest backup sorts last. The bucket is in the EU
          # jurisdiction, which the API needs as a header. Paginates with the cursor.
          keys="" cursor=""
          while :; do
            page=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "cf-r2-jurisdiction: eu" \
              --get --data-urlencode "prefix=d1/" --data-urlencode "per_page=1000" \
              ${cursor:+--data-urlencode "cursor=${cursor}"} "$api")
            keys+=$(jq -r '.result[].key' <<< "$page")$'\n'
            cursor=$(jq -r '.result_info.cursor // empty' <<< "$page")
            truncated=$(jq -r '.result_info.is_truncated // false' <<< "$page")
            [ "$truncated" = "true" ] && [ -n "$cursor" ] || break
          done
          key=$(grep -E '^d1/[0-9]{4}-[0-9]{2}-[0-9]{2}\.sql$' <<< "$keys" | sort | tail -n 1 || true)
          if [ -z "$key" ]; then
            echo "::error::No backup found under d1/ in ${BUCKET}. The nightly backup is not running."
            exit 1
          fi
          day=${key#d1/}; day=${day%.sql}
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$day" +%s) ) / 3600 ))
          echo "Newest backup: ${key} (${age_hours}h since that UTC day began)"
          if [ "$age_hours" -gt 96 ]; then
            echo "::error::The newest backup (${key}) is more than three days old. The nightly backup has stopped."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "cf-r2-jurisdiction: eu" \
            -o "$RUNNER_TEMP/backup.sql" "${api}/${key}"

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Restore into a fresh local D1
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/d1"
          # All output is dropped: this repo's Actions logs are public, and an error from a
          # failing INSERT would quote the row, which is personal data.
          if ! npx wrangler d1 execute DB --local --persist-to "$RUNNER_TEMP/d1" --yes \
            --file "$RUNNER_TEMP/backup.sql" > /dev/null 2>&1; then
            echo "::error::The backup did not load into a fresh D1 with today's migrations (output hidden because it can contain personal data). Reproduce locally: download the same object and run wrangler d1 execute DB --local --file on it."
            exit 1
          fi

      - name: Compare row counts with the backup header
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/cloudflare/check-restore.mjs "$RUNNER_TEMP/backup.sql" "$RUNNER_TEMP/d1"
