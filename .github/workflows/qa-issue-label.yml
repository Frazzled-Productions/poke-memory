name: QA Issue Label

# Keeps the issue board honest under the qa staging-branch flow (#806, #826).
#
# GitHub auto-closes a `closes #N` issue only when its PR merges into the
# default branch (`main`). Under the qa flow every implement PR merges into
# `qa` first, so those issues stay OPEN with no signal that the work is done
# and staged. This workflow bridges that gap by labelling them `status:in-qa`.
#
# Two paths, both on `pull_request: [closed]` filtered to merged PRs:
#
#   1. A PR merged into `qa` — parse its body and commit messages for
#      `closes/fixes/resolves #N` keywords and add `status:in-qa` to each
#      referenced issue. The label is created idempotently on first run.
#      Parsing lives in `.github/scripts/parse-closing-refs.sh` (tested by its
#      `.test.sh` sibling), which captures EVERY `#N` after a keyword, including
#      a single-keyword space-separated run like `closes #A #B #C`, the shape
#      that previously labelled only the first issue (#1763, gap 1).
#
#   2. The `qa -> main` promotion PR merged (base `main`, head `qa`): every
#      issue currently labelled `status:in-qa` is the qa batch being promoted,
#      so this run CLOSES each open one and strips the label. Using the label as
#      the source of truth (rather than the promotion PR's `Closes #N`) keeps a
#      hand-rolled promotion - one not built by `/batch-issues`, which may omit
#      those keywords - from leaving issues open and stale-labelled.
#
# Hotfix-to-main is deliberately NOT a third path (#1763, gap 2). A hotfix PR
# merges straight to `main` (head != `qa`, carrying the `hotfix` label per
# main-pr-source-gate.yml). Because `main` is the default branch, GitHub itself
# auto-closes any `closes #N` on that merge, so the issue does not straggle
# open. And a hotfix bypasses `qa` entirely, so `status:in-qa` (which means
# "staged on qa, awaiting promotion") would be a false statement about it.
# Labelling the hotfix path would also force relaxing the `base.ref == 'main'`
# guard below, which would let a hotfix merge fall into the promotion branch
# above and strip `status:in-qa` from the WHOLE staged batch. That is a real
# regression for a non-problem, so we leave hotfix issues to GitHub's native
# auto-close on the main merge.
#
# Out of scope: project-board column transitions. `auto-status.yml` owns the
# board; this workflow only touches the `status:in-qa` label.
#
# Fork guard: fork PRs are excluded (`head.repo.fork == false`, matching
# auto-review.yml). Fork PRs run with a read-only token and cannot edit
# issue labels; the `== false` form keeps a null fork value gated out.
#
# Idempotency: `gh label create ... || true` is a no-op once the label
# exists, and `gh issue edit --add-label` / `--remove-label` are idempotent
# by nature — re-adding a present label or removing an absent one is a
# harmless no-op, so a re-run of this workflow changes nothing.

on:
  pull_request:
    types: [closed]

concurrency:
  group: qa-issue-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    name: Label referenced issues
    # Only merged PRs into `qa` or `main`. A closed-but-unmerged PR, or a PR
    # into any other branch, is out of scope.
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.fork == false
      && (github.event.pull_request.base.ref == 'qa'
          || (github.event.pull_request.base.ref == 'main'
              && github.event.pull_request.head.ref == 'qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Checkout is needed for `.github/scripts/parse-closing-refs.sh`. Every
      # other input still comes from the event payload or the `gh` API (all
      # `gh` calls pass `--repo`).
      - name: Checkout (for the parser script)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Apply or strip status:in-qa on referenced issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # qa -> main promotion merged: close every issue this qa batch staged
          # and strip the label. The status:in-qa label is the authoritative set
          # of staged issues, so this does NOT depend on the promotion PR
          # carrying `Closes #N`. A hand-rolled promotion (one not built by the
          # /batch-issues skill) may omit those keywords, which previously left
          # the issues open and still labelled. Closing an already-closed issue
          # and removing an absent label are both no-ops, so re-runs are safe.
          if [ "$BASE_REF" = "main" ]; then
            STAGED=$(gh issue list --repo "$REPO" --label "status:in-qa" \
              --state all --json number,state \
              --jq '.[] | "\(.number) \(.state)"' || true)
            if [ -z "$STAGED" ]; then
              echo "No status:in-qa issues to reconcile."
              exit 0
            fi
            printf '%s\n' "$STAGED" | while read -r NUM STATE; do
              [ -n "$NUM" ] || continue
              if [ "$STATE" = "OPEN" ]; then
                echo "Closing #$NUM (shipped via promotion PR #$PR)"
                gh issue close "$NUM" --repo "$REPO" \
                  --comment "Shipped to production via the qa->main promotion (#$PR)." \
                  || echo "  (could not close #$NUM; continuing)"
              fi
              gh issue edit "$NUM" --repo "$REPO" \
                --remove-label "status:in-qa" \
                || echo "  (could not strip label from #$NUM; continuing)"
            done
            exit 0
          fi

          # Base is `qa` from here. Collect closing references from the PR body
          # and from every commit message in the PR, then parse them with the
          # tested script. GitHub honours `closes/fixes/resolves #N` in either
          # place; the parser mirrors that keyword set and additionally captures
          # every `#N` in a single-keyword run (`closes #A #B #C`), the gap that
          # used to label only the first issue (#1763).
          #
          # The jq expression emits one line per commit (headline + body, null
          # body coerced to ""), so commits are never cross-joined.
          COMMIT_MSGS=$(gh pr view "$PR" --repo "$REPO" \
            --json commits \
            --jq '.commits[] | .messageHeadline + " " + (.messageBody // "")' || true)

          ISSUES=$(printf '%s\n%s\n' "$PR_BODY" "$COMMIT_MSGS" \
            | bash .github/scripts/parse-closing-refs.sh || true)

          if [ -z "$ISSUES" ]; then
            echo "No closing references found on PR #$PR: nothing to do."
            exit 0
          fi

          echo "Closing references on PR #$PR: $(echo "$ISSUES" | tr '\n' ' ')"

          # Base is `qa`: the work is staged but the issue stays open. Ensure
          # the label exists, then add it to each referenced issue.
          gh label create "status:in-qa" --repo "$REPO" \
            --color "0E8A16" \
            --description "Work merged into the qa staging branch, awaiting promotion to main" \
            2>/dev/null || echo "Label status:in-qa already exists — continuing."

          for ISSUE in $ISSUES; do
            echo "Adding status:in-qa to #$ISSUE"
            gh issue edit "$ISSUE" --repo "$REPO" \
              --add-label "status:in-qa" || \
              echo "  (could not edit #$ISSUE — may not exist; skipping)"
          done
