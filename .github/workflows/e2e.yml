name: E2E

# Run Playwright smoke tests against Vercel preview deployments.
# Triggered by the deployment_status webhook that Vercel sends on every deploy.
# Non-required check — does not gate merge. Promote to required once stable.

on:
  deployment_status: {}

concurrency:
  group: e2e-${{ github.event.deployment.id }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --project=mobile-safari
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
