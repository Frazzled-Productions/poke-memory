name: E2E

# Run Playwright smoke tests against Vercel preview deployments.
# Triggered by the deployment_status webhook that Vercel sends on every deploy.
# Non-required check — does not gate merge. Promote to required once stable.

on:
  deployment_status: {}

concurrency:
  group: e2e-${{ github.event.deployment.id }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    # Browsers + system deps are baked into the image, so there is no
    # `playwright install --with-deps` step and no apt-get against the flaky
    # azure.archive.ubuntu.com mirror (#644). The tag must track the
    # @playwright/test version resolved in package-lock.json; the image ships
    # Node 24 (an upgrade from the previous Node 20 pin on this job).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --project=mobile-safari
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
