name: E2E

# Run the Playwright auth specs against Vercel preview deployments.
# Triggered by the deployment_status webhook that Vercel sends on every deploy.
# Non-required check — does not gate merge. Promote to required once stable.
#
# Scope: ONLY `e2e/auth.spec.ts` runs here (#829). The full 340-test suite
# against a slow preview chronically timed out at the 10-minute wall and never
# completed. Guest-mode smoke is already covered by the required `e2e-browser`
# check, which runs a local build. The auth specs are the unique value of the
# preview run: they exercise the build-time-inlined mock-auth seam (#751), which
# a local build cannot reproduce. Keep this run scoped to the auth specs — do
# not re-add the full suite here.

on:
  deployment_status: {}

concurrency:
  group: e2e-${{ github.event.deployment.id }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    # Browsers + system deps are baked into the image, so there is no
    # `playwright install --with-deps` step and no apt-get against the flaky
    # azure.archive.ubuntu.com mirror (#644). The tag must track the
    # @playwright/test version resolved in package-lock.json; the image ships
    # Node 24 (an upgrade from the previous Node 20 pin on this job).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    # Scoped to the auth specs only (#829), so the previous 10-minute wall is
    # comfortably oversized; 6 minutes leaves ample headroom for a slow preview
    # plus the two Playwright retries while still failing fast on a real hang.
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Test-only mock-auth seam (issue #751).
      #
      # IMPORTANT: `NEXT_PUBLIC_*` vars are inlined into the client bundle at
      # BUILD time. The seam therefore activates based on what Vercel inlined
      # when it built the *preview* deployment — not on anything this CI job
      # sets. The actual enabler is `NEXT_PUBLIC_E2E_AUTH_MOCK=1` configured in
      # the Vercel project's **Preview** environment scope (Preview only, never
      # Production). See WORKFLOW.md → "Mock-auth seam (E2E)".
      #
      # The env var below is the runner-side companion: it is harmless on the
      # Playwright process and documents intent. The signed-in specs in
      # `e2e/auth.spec.ts` detect at runtime whether the seam is live on the
      # deployment under test and skip themselves if it is not — so a preview
      # built without the Preview-scoped var simply skips the auth specs
      # rather than failing.
      #
      # Setting the flag here is safe ONLY because the job-level `if:` already
      # gates this workflow to non-Production deployments. The seam is provably
      # unreachable in production: `isMockAuthEnabled()` short-circuits on
      # `NODE_ENV === "production"` and `next.config.ts` fails the build loudly
      # if the flag is ever set in a production build.
      - name: Run Playwright auth specs
        run: npx playwright test e2e/auth.spec.ts --project=chromium --project=mobile-safari
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          NEXT_PUBLIC_E2E_AUTH_MOCK: "1"

      # Upload the report only on failure. The html reporter populates
      # `playwright-report/` on every non-cancelled run now (see
      # playwright.config.ts), so the previous `!cancelled()` gate would
      # upload a multi-MB artifact for every successful preview run. Failures
      # are the only case a maintainer needs the diff for; success uploads
      # were noise. See #1127 for the broader artifact-upload fix.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          # Fail loud if the html reporter has not produced the directory, so
          # a future config drift (e.g. dropping the html reporter from
          # playwright.config.ts) cannot silently upload an empty artifact
          # and leave the maintainer without diff images. See #1127.
          if-no-files-found: error
