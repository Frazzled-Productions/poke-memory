# Deploys the app to Cloudflare Workers with OpenNext and wrangler (OpenSpec change
# move-to-cloudflare, design D11), modelled on the company site's stage 1 workflow.
#
# - Push to `main`, or a dispatch of this workflow on `main`: test, build, apply D1 migrations to
#   the production database, deploy the Worker `poke-memory`, then apply main's migrations to the
#   preview database and load its seed (two test users), so qa.pokememory.com and every preview
#   version run against main's schema (change preview-upload-trust-main, #2415). The job runs in the
#   GitHub environment `Production`, which admits only `main` and is the only place the Cloudflare
#   token and SENTRY_AUTH_TOKEN live (deploy guard, Fraser's ruling of 19 November 2026, ops #610).
#   auto-release.yml commits the version bump and CHANGELOG.md to `main` with `[skip ci]`, which
#   suppresses the push event, so after its release it dispatches this workflow on `main`; the
#   released version (and its What's new section) is what ends up deployed. A published Release no
#   longer triggers a deploy: its ref is the tag, which the environment's branch rule refuses.
# - Pull request into `qa`, or the qa-to-main promotion PR: the `preview` job builds the PR and
#   bundles the preview Worker with NO environment and NO secret, and uploads the result as the
#   artefact `preview-bundle` (bundled Worker and static assets; kept one day). A pull
#   request can edit this file and its own wrangler.jsonc, so nothing here may hold a Cloudflare
#   token (change preview-deploy-guard, koinori #2925 F3): such a PR could otherwise bind the
#   production D1 database to its preview, and Cloudflare asks no permission on bound resources.
# - preview-upload.yml does the rest when this run succeeds: a `workflow_run` workflow, which GitHub
#   always runs from the default branch, so a PR cannot change it. It checks out `main` (wrangler.jsonc,
#   package.json and the specs come from there, never from the PR or qa), uploads the bundle to the
#   separate Worker `poke-memory-preview` aliased pr-<number>, comments the URL and runs the
#   Playwright auth specs against it. It never writes D1 (the production job above migrates and seeds
#   the preview database). Only it may use the `Preview` environment (deployment branches: `main`
#   only) and its secret CLOUDFLARE_PREVIEW_API_TOKEN. It is active only once it is on `main`.
#
# Secrets and the public repo: this is `pull_request`, never `pull_request_target`, so a fork PR
# runs without secrets (and the preview job also skips forks outright). The Cloudflare token is
# set only on the steps that call wrangler, never on `npm ci` or the Next.js build, so dependency
# install scripts and the build never see it. There is no repository-level Cloudflare token, so
# no job outside `Production` can read one. None of these jobs is a required check.
name: Deploy

on:
  push:
    branches: [main]
  # auto-release.yml dispatches this on `main` after it pushes a release commit (see above).
  workflow_dispatch:
  pull_request:
    branches: [qa, main]
    # Docs and OpenSpec files never reach the Worker, so they need no preview.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"

concurrency:
  # One group for every production deploy (push and dispatch), so two never run at once and an
  # older build cannot finish after a newer one; one group per PR for previews.
  group: ${{ github.event_name == 'pull_request' && format('deploy-{0}', github.ref) || 'deploy-production' }}
  # Never cancel a production deploy half way; a newer push to a PR replaces its preview.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  production:
    # A dispatch on any other branch is skipped here rather than refused by the environment.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Deployment branches: `main` only. Holds CLOUDFLARE_API_TOKEN and SENTRY_AUTH_TOKEN.
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Cloudflare is set up
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so nothing is deployed to Cloudflare."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f wrangler.jsonc ]; then
            echo "::notice::No wrangler.jsonc on this commit, so nothing is deployed to Cloudflare."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_' wrangler.jsonc; then
            echo "::notice::wrangler.jsonc still holds placeholder ids, so nothing is deployed to Cloudflare."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npm test
      - if: steps.ready.outputs.ok == 'true'
        name: Build the Worker
        run: npm run cf:build
        env:
          # NEXT_PUBLIC_* are inlined into the browser bundle at build time.
          NEXT_PUBLIC_DEPLOY_ENV: cloudflare-production
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Source map upload (next.config.ts withSentryConfig); skipped when the token is absent.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - if: steps.ready.outputs.ok == 'true'
        name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.ready.outputs.ok == 'true'
        name: Deploy the Worker
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The preview database follows main (change preview-upload-trust-main): pull requests never
      # write it, so the preview token can be Workers-only. After the production deploy, so a failure
      # here can never hold production back; it turns this run red with production already live.
      - if: steps.ready.outputs.ok == 'true'
        name: Apply D1 migrations (preview database)
        run: npx wrangler d1 migrations apply DB --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.ready.outputs.ok == 'true'
        name: Seed the preview database (two test users)
        env:
          # Optional. Without it the test users get a random password nobody knows.
          SEED_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
        run: node scripts/cloudflare/seed-preview.mjs --out "$RUNNER_TEMP/seed-preview.sql"
      - if: steps.ready.outputs.ok == 'true'
        name: Load the seed into the preview database
        run: npx wrangler d1 execute DB --remote --env preview --yes --file "$RUNNER_TEMP/seed-preview.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    # Fork PRs never reach preview-upload.yml (it refuses a head repository other than this one), so
    # building their bundle would be wasted work. No `environment:` and no `secrets.` in this job,
    # ever: a pull request controls this file (scripts/workflows-no-backups.test.mjs, preview guard).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Build the Worker (preview, no analytics beacon)
        run: npm run cf:build
        env:
          NEXT_PUBLIC_DEPLOY_ENV: cloudflare-preview
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Bundle the preview Worker
        # What `opennextjs-cloudflare upload` did before uploading, without a token: copy the
        # static-assets incremental cache into the assets (OpenNext 1.20's populateCache for
        # open-next.config.ts's cache), then bundle the Worker with wrangler. preview-upload.yml
        # uploads this bundle as it is (`--no-bundle`) with main's wrangler.jsonc, so the PR's
        # bindings never reach Cloudflare; its dry runs matched byte for byte (design D2). No
        # migrations: the preview database follows main (the production job applies them).
        run: |
          set -euo pipefail
          mkdir -p .open-next/assets/cdn-cgi/_next_cache
          cp -R .open-next/cache/. .open-next/assets/cdn-cgi/_next_cache/
          npx wrangler deploy --dry-run --env preview --outdir preview-bundle/worker
          rm -f preview-bundle/worker/*.map preview-bundle/worker/README.md
          mv .open-next/assets preview-bundle/assets
      - uses: actions/upload-artifact@v7
        with:
          name: preview-bundle
          path: preview-bundle/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
