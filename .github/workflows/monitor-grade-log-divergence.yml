name: Monitor grade_log divergence

# Daily check that flags users whose grade_log shows activity but whose
# card_reviews table is missing the corresponding rows or has them stuck
# in a never-updated state - the #584 sync-break signature, split into
# three independent shapes (Options A/B in #1221, Option C in #1357). See
# #607, #1047, #1221, #1357, and
# .github/scripts/check-grade-log-divergence.mjs for the full rationale.
#
# Cron-only - does NOT fire on push, so this workflow file landing in a
# PR will not trigger an alert on the PR itself. The first real run is the
# next 08:00 UTC tick after merge.

on:
  schedule:
    # 08:00 UTC daily - well before users open the app most days, so an
    # alert created here is sitting in the inbox by the start of the day.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        # The check runs three independent queries (#1221, #1357):
        #   * Option A - grade_log subject ≥2 days old with no card_reviews
        #     row at all (the #584 "row never written" shape, with an
        #     in-step grace period applied per #1221).
        #   * Option B - card_reviews row exists but `last_review IS NULL`
        #     or `reps = 0` despite ≥3 grade_log entries in the last 48h
        #     (the #584 "row stuck stale" shape).
        #   * Option C - a graduated subject (a grade_log row with
        #     learning_step IS NULL, #2096) with no
        #     card_reviews row at all, REGARDLESS of the 2-day grace
        #     (#1357). Catches fresh graduated orphans that Option A's
        #     grace window misses.
        # Every flagged subject is a real signal under any query, so
        # the default threshold is 0 - leave this blank to alert on any
        # non-zero count. The threshold is applied to each query
        # independently. Set it above 0 only to mute a temporarily
        # known-noisy run.
        description: "Override the divergence threshold (default 0)"
        required: false
        default: ""

concurrency:
  group: monitor-grade-log-divergence
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Frazzled-Productions/poke-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Ensure `monitoring` label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Self-healing label create. If the label already exists the
        # command exits non-zero; we swallow that with `|| true` so the
        # step is a true no-op on the steady-state path.
        run: |
          gh label create monitoring \
            --color D93F0B \
            --description "Automated monitoring alert" \
            || true

      - name: Run divergence check
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DIVERGENCE_THRESHOLD: ${{ github.event.inputs.threshold }}
          DIVERGENCE_BODY_PATH: /tmp/divergence-body.md
        run: |
          set -euo pipefail
          OUTPUT=$(node .github/scripts/check-grade-log-divergence.mjs)
          echo "$OUTPUT"
          if [ "$OUTPUT" = "OK" ]; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
            # Extract user_count from the JSON for the issue title.
            USER_COUNT=$(echo "$OUTPUT" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => { try { console.log(JSON.parse(s).user_count); } catch { console.log('?'); } })")
            echo "user_count=$USER_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update alert issue
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_COUNT: ${{ steps.check.outputs.user_count }}
        # `gh issue create --body-file` is the supported path. We avoid
        # `--json` here per the #537 lesson: gh's `--json` flag is for
        # output formatting and is not accepted on `issue create`.
        #
        # DEDUPE (#2003). This step used to call `gh issue create`
        # unconditionally, so a divergence that persists filed a fresh issue
        # every single day: #1999, #2000, #2001 and #2002 are one unresolved
        # single-user problem, four days running, all unactioned. Four issues
        # about one problem reads as four problems, and a signal that arrives
        # daily and identically stops being read at all.
        #
        # An open issue carrying the marker is now refreshed in place (body and
        # title) plus a short recurrence comment. A NEW issue is opened only
        # when there is no open one, so a genuinely new occurrence after a fix
        # still gets your attention.
        #
        # LOOKUP (#2010, #2081). The marker must be the WHOLE first line of the
        # body, which is where this step writes it. Two lookups are ruled out:
        #   * `gh issue list --search "$MARKER in:body"` (what #2003 shipped):
        #     GitHub's search index drops HTML comments and this marker's colon
        #     parses as a search qualifier, so it silently matches nothing and
        #     a new issue is opened every day (#1919 hit exactly this).
        #   * an unanchored `contains($marker)`: any open issue that merely
        #     QUOTES the marker (a retro, a review, this workflow's own issue
        #     threads) would be taken over and have its body overwritten, as
        #     happened to #1997 in auto-release.yml's drift check.
        # The matching lives in .github/scripts/find-marker-issue.mjs (tested by
        # scripts/find-marker-issue.test.mjs). Every lookup command is a plain
        # assignment with no `|| true` and no `2>/dev/null`, so a gh or parse
        # failure fails the step under `set -e` rather than reading as "no
        # existing issue" and opening a duplicate. Hitting the list limit fails
        # the step too: the tracking issue could be beyond it.
        #
        # The body is OVERWRITTEN on every alerting run (`gh issue edit
        # --body-file`), so human notes belong in comments. Removing the
        # `monitoring` label from the tracking issue takes it out of the lookup
        # and the next alert opens a new issue.
        #
        # No auto-close when the check goes back to OK: Option A and C only look
        # back 4 days (#1230), so a real break the user never touches again
        # "clears" by ageing out, not by being fixed. Closing stays a human call.
        run: |
          set -euo pipefail
          MARKER="<!-- monitor:grade-log-divergence -->"
          TITLE="[monitoring] grade_log divergence detected (${USER_COUNT} users)"
          LIMIT=100

          OPEN_ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label monitoring --limit "$LIMIT" \
            --json number,body,author)

          # Plain assignment so a jq failure (malformed gh output) also fails
          # the step instead of being swallowed inside the `if` test.
          OPEN_COUNT=$(jq 'length' <<<"$OPEN_ISSUES")
          if [ "$OPEN_COUNT" -ge "$LIMIT" ]; then
            echo "::error::gh issue list returned ${OPEN_COUNT} open monitoring issues (limit ${LIMIT}); the tracking issue could be beyond the limit, so the lookup cannot be trusted. Close stale monitoring issues or raise LIMIT."
            exit 1
          fi

          # Marker must be the whole first line; the oldest match wins.
          # Author filter (#2081 review): the repo is public, so anyone could open
          # an issue whose first line is exactly this marker; only issues opened by
          # this step's own token (GITHUB_TOKEN, shown by gh as app/github-actions)
          # count. Keep --author in step with GH_TOKEN if the token ever changes.
          EXISTING=$(node .github/scripts/find-marker-issue.mjs "$MARKER" --author github-actions <<<"$OPEN_ISSUES")

          { printf '%s\n\n' "$MARKER"; cat /tmp/divergence-body.md; } > /tmp/divergence-body-marked.md

          if [ -n "$EXISTING" ]; then
            echo "Divergence still present; updating open tracking issue #${EXISTING} rather than opening a duplicate."
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file /tmp/divergence-body-marked.md
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body \
              "Still diverging as of $(date -u +'%Y-%m-%d %H:%M UTC') (${USER_COUNT} user(s) affected). The report above has been refreshed; this is a recurrence on the existing issue, not a new problem."
          else
            echo "No open tracking issue carries the marker on line 1; opening a new one."
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file /tmp/divergence-body-marked.md \
              --label monitoring \
              --label "area:workflow"
          fi
