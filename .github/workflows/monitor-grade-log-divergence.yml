name: Monitor grade_log divergence

# Daily check that flags users whose grade_log shows activity but whose
# card_reviews table is missing the corresponding rows or has them stuck
# in a never-updated state — the #584 sync-break signature, split into
# three independent shapes (Options A/B in #1221, Option C in #1357). See
# #607, #1047, #1221, #1357, and
# .github/scripts/check-grade-log-divergence.mjs for the full rationale.
#
# Cron-only — does NOT fire on push, so this workflow file landing in a
# PR will not trigger an alert on the PR itself. The first real run is the
# next 08:00 UTC tick after merge.

on:
  schedule:
    # 08:00 UTC daily — well before users open the app most days, so an
    # alert created here is sitting in the inbox by the start of the day.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        # The check runs three independent queries (#1221, #1357):
        #   * Option A — grade_log subject ≥2 days old with no card_reviews
        #     row at all (the #584 "row never written" shape, with an
        #     in-step grace period applied per #1221).
        #   * Option B — card_reviews row exists but `last_review IS NULL`
        #     or `reps = 0` despite ≥3 grade_log entries in the last 48h
        #     (the #584 "row stuck stale" shape).
        #   * Option C — a graduated subject (grade_log MAX(grade) >= 4)
        #     with no card_reviews row at all, REGARDLESS of the 2-day
        #     grace (#1357). Catches fresh graduated orphans that Option
        #     A's grace window misses; intentionally noisier than A.
        # Every flagged subject is a real signal under any query, so
        # the default threshold is 0 — leave this blank to alert on any
        # non-zero count. The threshold is applied to each query
        # independently. Set it above 0 only to mute a temporarily
        # known-noisy run.
        description: "Override the divergence threshold (default 0)"
        required: false
        default: ""

concurrency:
  group: monitor-grade-log-divergence
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Frazzled-Productions/poke-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Ensure `monitoring` label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Self-healing label create. If the label already exists the
        # command exits non-zero; we swallow that with `|| true` so the
        # step is a true no-op on the steady-state path.
        run: |
          gh label create monitoring \
            --color D93F0B \
            --description "Automated monitoring alert" \
            || true

      - name: Run divergence check
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DIVERGENCE_THRESHOLD: ${{ github.event.inputs.threshold }}
          DIVERGENCE_BODY_PATH: /tmp/divergence-body.md
        run: |
          set -euo pipefail
          OUTPUT=$(node .github/scripts/check-grade-log-divergence.mjs)
          echo "$OUTPUT"
          if [ "$OUTPUT" = "OK" ]; then
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "alert=true" >> "$GITHUB_OUTPUT"
            # Extract user_count from the JSON for the issue title.
            USER_COUNT=$(echo "$OUTPUT" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => { try { console.log(JSON.parse(s).user_count); } catch { console.log('?'); } })")
            echo "user_count=$USER_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Open alert issue
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_COUNT: ${{ steps.check.outputs.user_count }}
        # `gh issue create --body-file` is the supported path. We avoid
        # `--json` here per the #537 lesson: gh's `--json` flag is for
        # output formatting and is not accepted on `issue create`.
        run: |
          gh issue create \
            --title "[monitoring] grade_log divergence detected (${USER_COUNT} users)" \
            --body-file /tmp/divergence-body.md \
            --label monitoring \
            --label "area:workflow"
