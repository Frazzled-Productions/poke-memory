name: Auto-fix CI failures

# When the CI workflow's test job fails on an auto-issue PR branch,
# fetch the failing log tail and post a `/fix` comment on the PR.
# auto-pr.yml then handles the actual fix cycle.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    name: Trigger /fix on CI failure
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'auto/issue-') &&
      !github.event.workflow_run.head_repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Find PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$REPO" --head "$REF" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR for ref $REF — nothing to fix."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Idempotency check
        id: idem
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Skip if we already posted a /fix for this exact run — matches
          # auto-review.yml's SHA-based marker pattern for exact deduplication.
          MARKER="<!-- ci-autofix:$RUN_ID -->"
          FOUND=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq --arg marker "$MARKER" '[.[] | select(.body | contains($marker))] | length')
          if [ "$FOUND" -gt 0 ]; then
            echo "ci-autofix comment for run $RUN_ID already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failing job log
        id: logs
        if: steps.pr.outputs.skip != 'true' && steps.idem.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Matches ci.yml's job key "test" (no name: override).
          # If ci.yml adds a name: field to that job, update this selector.
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "test" and .conclusion == "failure")] | .[0].id // empty')
          if [ -z "$JOB_ID" ]; then
            echo "No failed 'test' job found in run $RUN_ID — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fetching log for job $JOB_ID"
          # gh api follows the 302 redirect to the pre-signed log URL via curl -L.
          # The pre-signed URL is self-authenticating; no Authorization header needed.
          if ! gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/raw-log.txt; then
            echo "Log download failed — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s /tmp/raw-log.txt ]; then
            echo "Log download returned empty content — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strip leading ISO 8601 timestamps that Actions prepends to every log line,
          # then strip ANSI: CSI sequences (SGR, cursor-movement) and OSC sequences (hyperlinks, titles).
          sed 's/^[0-9]\{4\}-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9]*Z //' \
            /tmp/raw-log.txt \
            | sed -E 's/\x1b(\[[0-9;?]*[A-Za-z]|\][^\x07]*\x07|\][^\x1b]*\x1b\\)//g' \
            | tail -80 > /tmp/error-excerpt.txt
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post /fix comment on PR
        if: steps.pr.outputs.skip != 'true' && steps.idem.outputs.skip != 'true' && steps.logs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            printf '<!-- ci-autofix:%s -->\n' "$RUN_ID"
            printf '/fix\n\n'
            printf 'CI failed. Error excerpt:\n\n'
            printf '```\n'
            cat /tmp/error-excerpt.txt
            printf '\n```\n\n'
            printf '_Full logs: %s_\n' "$RUN_URL"
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md
