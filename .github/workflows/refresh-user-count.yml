name: Refresh user count badge

# Daily refresh of `.github/stats/users.json` for the README user-count
# Shields.io badge. See #400 and AGENTS.md "Privacy" / "Sync" sections.
#
# Uses the existing SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF secrets
# (already wired up for migration-check.yml). The bot App identity from
# auto-release.yml is reused so the commit lands on `main` despite branch
# protection.
#
# The commit stays on `main` because the README badge reads
# raw.githubusercontent.com/.../main/.github/stats/users.json. A push straight
# to `main` has no PR, so auto-release.yml's backmerge-hotfix job never sees
# it; the "Backmerge main into qa" step below merges it into `qa` straight
# away. Without that, `qa` falls behind `main` and qa-drift-check files a
# drift issue (#1989 was exactly this; #2058). The same App token is the
# bypass actor on the `qa-staging` ruleset. If the backmerge fails (a merge
# conflict, or a qa-side change it may not push: the App has no `workflows`
# permission), this run goes RED even though the stats commit already landed
# on `main`: that is deliberate, so the stranded qa is seen the same day. The
# ::error:: annotation says what to do; qa-drift-check tracks it from the next
# morning.
#
# The commit message carries the GitHub-native skip marker so this run
# does not retrigger any push-triggered workflow (CI, auto-release,
# migration-check). The marker is platform-level - once present in a
# commit message, GitHub does not dispatch any push or pull_request
# workflows for that commit, so no per-workflow guard is required here.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Deliberately NOT in the `auto-release` concurrency group (#2058 review). A
# GitHub concurrency group holds one running and at most ONE pending run, and
# a newer pending run cancels the older one even with cancel-in-progress
# false, so sharing the group could silently drop a queued release. The two
# only race if a manual dispatch overlaps (the crons are 06:17 and 09:00 UTC),
# and the race is self-healing rather than impossible: whichever push to
# `main` loses fails non-fast-forward and goes red with nothing rewritten, the
# qa backmerge re-fetches and retries when qa moves under it, and if a
# promotion's "Reset qa to main" force-push erases a concurrent stats
# backmerge, the daily qa-drift-check reports qa behind main the next morning.
concurrency:
  group: refresh-user-count
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Frazzled-Productions/poke-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Full history so the backmerge below can find the main/qa merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Refresh user count JSON
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/refresh-user-count.mjs

      - name: Commit and push if changed
        id: push
        run: |
          set -euo pipefail
          if git diff --quiet .github/stats/users.json; then
            echo "No change - skipping commit."
            exit 0
          fi
          git config user.name "poke-memory-bot[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"
          git add .github/stats/users.json
          git commit -m "chore(stats): refresh user count [skip ci]"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Every push to main must be followed by a backmerge into qa (#2058).
      # Shared with auto-release.yml's release and backmerge-hotfix jobs.
      - name: Backmerge main into qa
        if: steps.push.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          bash .github/scripts/backmerge-main-into-qa.sh \
            "chore: backmerge main into qa after user-count refresh"
