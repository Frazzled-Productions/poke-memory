name: Auto Issue Worker

# Stage 1 (plan): when an issue is labeled `auto`, the planner sub-agent
# drafts a plan and posts it as a comment.
# Stage 2 (implement): when a maintainer replies `/go` on that issue,
# the orchestrator runs the AGENTS.md playbook and opens a PR. The
# auto-review.yml workflow then fires on PR open, runs code-reviewer, and
# posts the `<!-- auto-review:1 -->` comment. The maintainer reads the
# review and comments `/fix` on the PR to trigger fix cycles (handled by
# auto-pr.yml).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Don't let two runs on the same issue race each other.
concurrency:
  group: auto-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'auto' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Post initial status comment
        id: status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ID=$(gh api -X POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body=$'<!-- auto-status -->\n## Working on this\n\n_(Starting up — task list will appear here as planning progresses.)_' \
            --jq '.id')
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          AUTO_STATUS_COMMENT_ID: ${{ steps.status.outputs.comment_id }}
          AUTO_STATUS_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 40
          show_full_output: true
          # Allow the bot to trigger this job: /split creates sub-issues
          # under the bot identity and labels them `auto`, which is
          # supposed to cascade into a plan run on each child.
          allowed_bots: poke-memory-bot
          prompt: |
            You are the orchestrator for issue #${{ github.event.issue.number }}.

            Read AGENTS.md (loaded via CLAUDE.md) for the playbook and conventions.

            **Plan only — do not modify any files, do not branch, do not implement.**

            **Live status reporting:** The runtime maintains a live status
            comment on the issue that mirrors your TodoWrite list — a hook
            fires on every TodoWrite call and PATCHes the comment with the
            rendered checklist. Use TodoWrite as your visible progress board:
            keep a granular task list, update statuses
            (pending / in_progress / completed) as you go, and the issue
            timeline tracks along automatically. Do NOT post or PATCH the
            status comment yourself — the hook owns it. Optional: wrap each
            phase in `::group::Phase: <name>` / `::endgroup::` on stdout for
            collapsible Actions-log sections. If you hit a blocker, post a
            separate comment explaining what's blocked and stop.

            Steps:
            1. Load the issue:
               `gh issue view ${{ github.event.issue.number }} --json title,body,labels`
            2. Invoke the `planner` sub-agent (Agent tool, subagent_type "planner")
               with the issue title and body. The planner tags each open question
               as one of: `[EXPERT-RESEARCH]`, `[USER-DECISION + RESEARCH]`, or
               `[USER-DECISION]`. Handle each tag as follows:

               - `[EXPERT-RESEARCH]`: dispatch the named specialist immediately
                 (`next16-expert`, `pokeapi-expert`, or `srs-expert`). Fold the
                 answer into the plan as a resolved decision. Do NOT surface the
                 question to the maintainer — they should see the decided
                 direction with a one-line rationale, not the question.
                 Exception: if the specialist's answer is itself conditional on
                 a maintainer preference (e.g. "depends on whether you value
                 X over Y"), re-tag the item as `[USER-DECISION]` and surface
                 the specialist's framing alongside the options — do not
                 manufacture a confident decision out of a hedged answer.
               - `[USER-DECISION + RESEARCH]`: dispatch `researcher` to produce
                 a project-specific options brief (current ecosystem state,
                 comparative tradeoffs against this codebase's constraints, a
                 recommendation). Present the brief inline in the plan with a
                 clear decision frame for the maintainer.
               - `[USER-DECISION]`: present the question as-is.

               Run dispatches in parallel where the questions are independent.
               The plan you post MUST NOT contain any unanswered
               `[EXPERT-RESEARCH]` items, and every `[USER-DECISION + RESEARCH]`
               item MUST include the researcher's brief inline. Before posting,
               re-scan the draft for any remaining `[EXPERT-RESEARCH]` tags;
               if one is found, the corresponding specialist call was missed
               or failed silently — dispatch it and incorporate the answer
               before posting.
            3. Assess the plan's scope before posting. Count the following:
               - **Files**: distinct files the plan explicitly modifies or creates
               - **Surfaces**: count of categories touched (workflow files / lib/ /
                 components/ / docs + db + API routes — each category = 1 surface)
               - **Infra + logic**: does the plan introduce both new infrastructure
                 (new workflow job, GitHub secret, npm dependency) AND new application
                 logic (new lib function, React component, DB schema change)?
               - **Acceptance criteria**: total numbered acceptance criteria

               Fire a scope warning when ANY of these thresholds is crossed.
               Use judgment — a trivially small plan that happens to reference 4
               files should not trigger it; the thresholds are signals, not rules.
               a. ≥ 4 distinct files in the plan
               b. ≥ 3 distinct surfaces
               c. Plan introduces both new infrastructure AND new logic, with ≥ 3 files
               d. ≥ 6 acceptance criteria

               **Coupling check.** If a scope warning fires, before proposing a
               split sketch the boundary you would draw between children and
               check whether they would share surface area. Splitting only
               helps if children can be implemented and reviewed independently.
               Treat children as coupled if any of:
               - Two or more would define or modify a symbol of the same name
                 (function, type, component), whether the symbol exists today
                 or is being introduced fresh — even at different paths
               - Two or more would read or write the same `localStorage` key,
                 database table, or other persistence target
               - Two or more would touch the same leaf module directory (e.g.
                 both in `lib/streak/`)
               - Two or more would edit the same file

               If coupling is found, do NOT offer `/split`. The warning still
               fires (the work is still big) but the recommendation is to
               proceed as a single issue — coupled children produce PRs that
               don't compose at merge time. Use ending A2 in step 4. **When
               you cannot confidently rule out coupling, default to A2** —
               the cost of a missed split (one large PR) is much smaller
               than the cost of a wrongly-offered split (two PRs that don't
               compose).

            4. Write the plan body to `/tmp/plan-body.md` with a hidden
               marker as the very first line, then post it:
               ```
               printf '<!-- auto-plan -->\n' > /tmp/plan-body.md
               cat <<'PLAN' >> /tmp/plan-body.md
               <plan content here>
               PLAN
               gh issue comment ${{ github.event.issue.number }} --body-file /tmp/plan-body.md
               ```
               The marker is required — the post-step uses it to detect
               whether the plan landed and salvages `/tmp/plan-body.md` to
               the issue if the run halts before this step runs.

               The comment body must end in one of three ways:

               **A1) If the scope warning fires AND the proposed children are
               cleanly independent (no coupling per step 3), append this block
               as the final content** — its own `/go` invitation replaces the
               standard closing lines:

               ---
               **⚠ Scope warning.** This plan touches N file(s) across M surface(s) [brief reason].
               I estimate this may exceed a single auto-issue budget.

               **Suggested split:**
               1. <sub-issue A title>
                  <one-line rationale>
               2. <sub-issue B title>
                  <one-line rationale>

               Each title goes on its own numbered line as plain text — no markdown
               formatting, no separator characters, no rationale on the same line.
               The rationale belongs on the indented line directly below.

               Reply `/split` to file these as sub-issues of this issue. Reply `/go` to proceed with the full scope.
               ---

               **A2) If the scope warning fires BUT the proposed children would
               be coupled (per step 3), append this block as the final content**
               — splitting is not offered:

               ---
               **⚠ Scope warning.** This plan touches N file(s) across M surface(s) [brief reason].
               I considered splitting but the parts share <name the coupling — e.g. a `computeStreak` function and the `poke-memory:streak:v1` storage key>, so independent PRs would not compose at merge time.

               Reply `/go` to proceed with the full scope. If you see a different breakdown that avoids the shared surface, post it as a comment and I'll plan against it.
               ---

               **B) If no scope warning fires, end with these two lines on their own:**
               "Reply with `/go` to proceed."
               "To change scope, post a comment describing the changes (or include them in your `/go` comment) — the implement stage treats follow-up comments as authoritative over this plan."

               Pick exactly one ending — never multiple, never none.

      - name: Salvage plan and finalise status
        # If the orchestrator step times out, runs out of turns, or errors
        # right at the gh-comment call, the drafted plan is stranded on the
        # runner and the live status comment is left mid-flight. This step
        # detects whether the plan landed (via the `<!-- auto-plan -->`
        # marker), salvages `/tmp/plan-body.md` if it didn't, and appends a
        # "Run finished" section to the status comment so the maintainer
        # always sees a real outcome instead of a hung in_progress checkbox.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS_ID: ${{ steps.status.outputs.comment_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_FILE: /tmp/plan-body.md
        run: |
          set -uo pipefail

          # Did the orchestrator already post the plan in THIS run? A prior
          # planner run may have left an `<!-- auto-plan -->` comment, so we
          # restrict the count to comments newer than the status comment
          # (which is created at the start of every run). Comment IDs are
          # monotonically increasing on GitHub.
          PLAN_POSTED=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq --argjson statusId "${STATUS_ID:-0}" \
              '[.[] | select(.id > $statusId) | select(.body | startswith("<!-- auto-plan -->"))] | length')

          SALVAGED=false
          if [ "${PLAN_POSTED:-0}" = "0" ] && [ -s "$PLAN_FILE" ]; then
            # Ensure the marker is present so a follow-up run doesn't
            # double-salvage the same body.
            if ! head -n 1 "$PLAN_FILE" | grep -q '^<!-- auto-plan -->$'; then
              { printf '<!-- auto-plan -->\n'; cat "$PLAN_FILE"; } > /tmp/plan-body-marked.md
              PLAN_FILE=/tmp/plan-body-marked.md
            fi
            if gh issue comment "$ISSUE" --repo "$REPO" --body-file "$PLAN_FILE"; then
              SALVAGED=true
              PLAN_POSTED=1
            else
              echo "::warning::Salvage post of /tmp/plan-body.md failed"
            fi
          fi

          # Update the live status comment with a Run finished section.
          if [ -z "${STATUS_ID:-}" ]; then
            echo "No status comment id captured — nothing to finalise."
            exit 0
          fi

          CURRENT_BODY=$(gh api "repos/$REPO/issues/comments/$STATUS_ID" --jq '.body' 2>/dev/null || echo "")
          if [ -z "$CURRENT_BODY" ]; then
            echo "Status comment $STATUS_ID not readable — skipping finalise."
            exit 0
          fi

          {
            printf '%s\n\n---\n\n## Run finished\n\n' "$CURRENT_BODY"
            if [ "$SALVAGED" = true ]; then
              printf 'Plan run halted before posting, but the draft was salvaged from `/tmp/plan-body.md` and posted above. See [run logs](%s) for what halted the run.\n' "$RUN_URL"
              printf '\nReply `/go` to proceed with the salvaged plan.\n'
            elif [ "${PLAN_POSTED:-0}" != "0" ]; then
              printf 'Done — plan posted. Reply `/go` to proceed.\n'
            else
              printf '**Run halted** — no plan was posted and no draft was found on the runner. See [run logs](%s).\n' "$RUN_URL"
              printf '\n### How to recover\n\nRemove and re-add the `auto` label to re-trigger the planner.\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -F body=@/tmp/status-body.md

      - name: Surface tool denials
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -u
          if [ ! -f "$LOG" ]; then exit 0; fi

          DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
          if [ "$DENIAL_COUNT" = "0" ] || [ -z "$DENIAL_COUNT" ]; then
            echo "No tool denials."
            exit 0
          fi

          DENIAL_DETAILS=$(jq -r '
            def text_of:
              if type == "string" then .
              elif type == "array" then map(.text // "" | tostring) | join(" ")
              else tostring end;
            select(.type == "user")
            | .message.content[]?
            | select(.type == "tool_result")
            | select((.is_error // false) == true)
            | (.content | text_of) as $c
            | select($c | test("permission|denied|not allowed"; "i"))
            | $c | gsub("\\s+"; " ") | .[0:240]
          ' "$LOG" 2>/dev/null | sort -u | head -20 || true)

          {
            printf '<!-- auto-denials -->\n'
            printf '## %s tool denial(s) during the plan run\n\n' "$DENIAL_COUNT"
            printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted. See [run logs](%s).\n' "$RUN_URL"
            if [ -n "$DENIAL_DETAILS" ]; then
              printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
            fi
          } > /tmp/denials.md

          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/denials.md

      - name: Move issue to Planned
        # Run even if the orchestrator step failed — the salvage step above
        # may still have posted the plan from `/tmp/plan-body.md`. Gate on
        # whether an `<!-- auto-plan -->` comment was posted in THIS run
        # (id > STATUS_ID) so we don't promote on the strength of a prior
        # run's plan when the current run never produced one.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_TOKEN: ${{ steps.org-app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS_ID: ${{ steps.status.outputs.comment_id }}
        run: |
          set -uo pipefail
          PLAN_POSTED=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq --argjson statusId "${STATUS_ID:-0}" \
              '[.[] | select(.id > $statusId) | select(.body | startswith("<!-- auto-plan -->"))] | length')
          if [ "${PLAN_POSTED:-0}" = "0" ]; then
            echo "No plan posted in this run — leaving project status unchanged."
            exit 0
          fi
          GH_TOKEN="$ORG_TOKEN" \
          GH_TOKEN_REPO="$GH_TOKEN" \
            .github/scripts/set-project-status.sh "$ISSUE" "Planned"

  implement:
    name: Implement
    if: |
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'auto') &&
      contains(github.event.comment.body, '/go') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Conflict gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKERS=$(gh issue view "$ISSUE" --repo "$REPO" --json comments \
            --jq '.comments[].body' \
            | grep -oE '<!-- overlap-scan:[0-9]+[+][0-9]+:conflict -->' \
            | sort -u || true)

          if [ -z "$MARKERS" ]; then
            echo "No conflict markers — proceeding."
            exit 0
          fi

          BLOCKERS=()
          while IFS= read -r marker; do
            pair=$(echo "$marker" \
              | sed -E 's@<!-- overlap-scan:([0-9]+)[+]([0-9]+):conflict -->@\1 \2@')
            i=$(echo "$pair" | awk '{print $1}')
            j=$(echo "$pair" | awk '{print $2}')
            if [ "$i" = "$ISSUE" ]; then other="$j"; else other="$i"; fi
            state=$(gh issue view "$other" --repo "$REPO" --json state --jq '.state')
            if [ "$state" = "OPEN" ]; then
              BLOCKERS+=("#$other")
            fi
          done <<< "$MARKERS"

          if [ ${#BLOCKERS[@]} -eq 0 ]; then
            echo "All conflicting issues are closed — proceeding."
            exit 0
          fi

          LIST="${BLOCKERS[*]}"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Cannot proceed with \`/go\`: this issue has an unresolved conflict with open issue(s) ${LIST}. Reconcile (close the other issue, delete the relevant overlap-scan comment on this issue, or update both issues to remove the conflict) and re-comment \`/go\`."
          echo "::error::Blocked by open conflict(s): ${LIST}"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+${APP_SLUG}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record starting SHA
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move issue to In Progress
        env:
          GH_TOKEN: ${{ steps.org-app-token.outputs.token }}
          GH_TOKEN_REPO: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/set-project-status.sh "${{ github.event.issue.number }}" "In Progress"

      - name: Post initial status comment
        id: status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ID=$(gh api -X POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body=$'<!-- auto-status -->\n## Working on this\n\n_(Starting up — task list will appear here as work progresses.)_' \
            --jq '.id')
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          AUTO_STATUS_COMMENT_ID: ${{ steps.status.outputs.comment_id }}
          AUTO_STATUS_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80
          show_full_output: true
          prompt: |
            You are the orchestrator for issue #${{ github.event.issue.number }}.
            The maintainer approved the plan with `/go`. Implement and open a PR.

            Read AGENTS.md (loaded via CLAUDE.md) for the playbook and conventions.
            Follow it strictly.

            **Live status reporting:** The runtime maintains a live status
            comment on the issue that mirrors your TodoWrite list — a hook
            fires on every TodoWrite call and PATCHes the comment with the
            rendered checklist. Use TodoWrite as your visible progress board:
            keep a granular task list, update statuses
            (pending / in_progress / completed) as you go, and the issue
            timeline tracks along automatically. Do NOT post or PATCH the
            status comment yourself — the hook owns it. Optional: wrap each
            phase in `::group::Phase: <name>` / `::endgroup::` on stdout for
            collapsible Actions-log sections. If you hit a blocker, post a
            separate comment explaining what's blocked, then stop — don't
            push half-done work. The post-step takes over the status comment
            at the end of the run with a verified outcome summary.

            Workflow:
            1. Load the issue and existing comments:
               `gh issue view ${{ github.event.issue.number }} --json title,body,comments`
               The plan is the most recent substantive bot comment. If the user
               edited / followed up with scope changes in their `/go` comment or
               nearby comments, treat those as authoritative over the original plan.
               Comments whose body starts with `<!-- overlap-scan:` are
               informational links from the overlap-scan workflow — ignore them
               for scope decisions; they are not maintainer instructions.
            2. Create a feature branch named `auto/issue-${{ github.event.issue.number }}-<short-kebab-slug>`.
            3. Run the orchestration playbook from AGENTS.md (excluding
               code-reviewer at this stage — it runs after PR creation):
               - Specialists in parallel where their questions are independent.
               - ui-coder and/or data-coder for implementation, in parallel when
                 their work is independent.
               - Update README.md and CHANGELOG.md inline if user-facing behavior
                 changed (per AGENTS.md "Documentation" section).
            4. Commit. **Do NOT add a Co-Authored-By trailer.** No Claude
               attribution in commit messages.
            5. Push the branch.
            6. **Build gate.** Run
               `(npm run typecheck && npm run build && npm test) 2>&1 | tee /tmp/build-output.txt`.
               If exit code is non-zero, read the output, apply a targeted fix,
               commit, push, and re-run. Allow up to two fix attempts. If the
               gate still fails after the second fix attempt, post a comment
               on the issue with the last 80 lines of `/tmp/build-output.txt`
               and stop — do NOT open a PR. The branch stays pushed for
               manual inspection. (`npm ci` has already run as a workflow
               step, so dependencies are in place.)
            7. Open the PR:
               `gh pr create --title "<title>" --body "<body>" --base main`
               The body MUST contain `closes #${{ github.event.issue.number }}`
               so the issue auto-closes on merge. Summarise what changed.
               Capture the new PR number for the next step.
            8. Post a brief comment on the issue linking the PR. The
               `auto-review.yml` workflow will fire on PR open and post the
               `<!-- auto-review:1 -->` comment asynchronously — do not run
               code-reviewer here.

            If you hit a blocker you can't resolve, post a comment on the issue
            explaining what's blocked and stop — don't push half-done work.

      - name: Verify outcome and surface tool denials
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          START_SHA: ${{ steps.start.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_APP_ID: ${{ vars.BOT_APP_ID }}
        run: |
          set -euo pipefail

          STATUS_ID=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .id // empty')

          if [ -z "$STATUS_ID" ]; then
            echo "No live status comment found — orchestrator never posted one. Nothing to update."
            exit 0
          fi
          echo "Live status comment ID: $STATUS_ID"

          # Preserve the existing TodoWrite-driven body so the task list survives
          # into the final outcome comment. We APPEND a "Run finished" section
          # rather than overwriting the body.
          CURRENT_BODY=$(gh api "repos/$REPO/issues/comments/$STATUS_ID" --jq '.body')

          # Find the PR opened from this issue's auto branch. Match on branch
          # name (the orchestrator creates `auto/issue-N-<slug>`) — robust
          # against body-content variations like `Closes`/`fixes`/`resolves`.
          PR_NUMBER=$(gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,headRefName,createdAt \
            | jq -r --arg prefix "auto/issue-$ISSUE-" '
                [.[] | select(.headRefName | startswith($prefix))]
                | sort_by(.createdAt) | last | .number // empty
              ')

          git fetch origin --quiet 2>/dev/null || true
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          else
            COMMITS=0
          fi

          # Branch name (only shown if it matches the auto/issue-N-* pattern)
          # and last-commit subject for the recovery footer.
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          case "$BRANCH" in
            "auto/issue-${ISSUE}-"*) ;;
            *) BRANCH="" ;;
          esac

          DENIAL_COUNT=0
          DENIAL_DETAILS=""
          if [ -f "$LOG" ]; then
            DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
            DENIAL_DETAILS=$(jq -r '
              def text_of:
                if type == "string" then .
                elif type == "array" then map(.text // "" | tostring) | join(" ")
                else tostring end;
              select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
              | select((.is_error // false) == true)
              | (.content | text_of) as $c
              | select($c | test("permission|denied|not allowed"; "i"))
              | $c | gsub("\\s+"; " ") | .[0:240]
            ' "$LOG" 2>/dev/null | sort -u | head -20 || true)
          fi

          # Halt cases: any time we end without an open PR (whether or not
          # commits were pushed). On halt we surface branch + last commit + how
          # to recover, so the maintainer can pick up the work without spelunking
          # the run logs.
          HALTED=false
          if [ -z "$PR_NUMBER" ]; then
            HALTED=true
          fi

          # Salvage push: if we halted with uncommitted edits in the working
          # tree, commit them as WIP and push the branch to origin so /continue
          # has something to resume from. Without this, a halt mid-implementation
          # loses all in-progress work and the recovery footer points at a
          # branch that never made it to origin. Inline -c flags so the commit
          # works even if the earlier `Configure git identity` step was skipped.
          if [ "$HALTED" = true ] && [ -n "$BRANCH" ]; then
            if ! git diff --quiet HEAD 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git add -A
              if ! git -c user.name="${APP_SLUG}[bot]" \
                       -c user.email="${BOT_APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com" \
                       commit -m "WIP: halted run on #$ISSUE"; then
                echo "::warning::WIP salvage commit failed — staged changes will not be pushed to origin"
              fi
            fi
            git push origin "HEAD:refs/heads/$BRANCH" || \
              echo "::warning::Salvage push to origin failed — /continue will fall back to /go"
          fi

          # Re-count commits and capture the last commit AFTER the salvage push
          # so the recovery footer references the WIP commit (the most useful
          # pointer for the maintainer) when one was created. Without this the
          # footer would point at the pre-WIP commit and the salvage commit
          # would be invisible.
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          fi
          LAST_COMMIT=""
          if [ "$COMMITS" -gt 0 ]; then
            LAST_COMMIT=$(git log --format='%h %s' -n 1 2>/dev/null || echo "")
          fi

          # Verify the branch is genuinely on origin before advertising
          # /continue. Stays truthful even if the salvage push above failed
          # (network, permissions, etc.). Uses ls-remote so we read origin
          # directly rather than trusting the local refs.
          BRANCH_ON_ORIGIN=false
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            BRANCH_ON_ORIGIN=true
          fi

          {
            # Preserve existing task list / placeholder body verbatim
            printf '%s\n\n---\n\n## Run finished\n\n' "$CURRENT_BODY"
            if [ -n "$PR_NUMBER" ]; then
              printf 'Done — opened PR #%s. Auto-review will follow on PR open.\n' "$PR_NUMBER"
            elif [ "$COMMITS" -gt 0 ]; then
              printf '**Run halted** — pushed %s commit(s) but no PR was opened. See [run logs](%s).\n' "$COMMITS" "$RUN_URL"
            else
              printf '**Run halted** — no PR opened, no commits pushed. See [run logs](%s).\n' "$RUN_URL"
            fi
            if [ "$HALTED" = true ]; then
              printf '\n### How to recover\n\n'
              if [ "$BRANCH_ON_ORIGIN" = true ]; then
                printf 'Branch: `%s`\n' "$BRANCH"
              fi
              if [ -n "$LAST_COMMIT" ]; then
                printf 'Last commit: `%s`\n' "$LAST_COMMIT"
              fi
              if [ "$BRANCH_ON_ORIGIN" = true ] || [ -n "$LAST_COMMIT" ]; then
                printf '\n'
              fi
              if [ "$BRANCH_ON_ORIGIN" = true ]; then
                printf 'Comment `/continue` to resume from the branch above. Comment `/go` to start over with a fresh branch.\n'
              else
                printf 'Comment `/go` to start over with a fresh branch.\n'
              fi
            fi
            if [ "$DENIAL_COUNT" != "0" ]; then
              printf '\n<details><summary>%s tool denial(s) during this run</summary>\n\n' "$DENIAL_COUNT"
              printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted.\n'
              if [ -n "$DENIAL_DETAILS" ]; then
                printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
              else
                printf '\n_(unable to extract per-call detail; see [run logs](%s))_\n' "$RUN_URL"
              fi
              printf '\n</details>\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -F body=@/tmp/status-body.md

      - name: Move issue to PR
        # Auto-review.yml owns the verdict-based "Ready to merge" upgrade —
        # this step just records that a PR is open. Both workflows write the
        # same status field; concurrent writes are idempotent.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          # If the issue closed mid-run (e.g. PR auto-merged), the auto-status
          # workflow owns the Done transition — don't fight it.
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR=$(gh pr list --state open --limit 200 --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"auto/issue-${ISSUE}-\"))][0].number")
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No open PR found for issue #$ISSUE — leaving status at In Progress."
            exit 0
          fi
          GH_TOKEN="${{ steps.org-app-token.outputs.token }}" \
          GH_TOKEN_REPO="${{ steps.app-token.outputs.token }}" \
            .github/scripts/set-project-status.sh "$ISSUE" "PR"

  continue:
    name: Continue
    if: |
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'auto') &&
      contains(github.event.comment.body, '/continue') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Pre-flight checks
        id: preflight
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # If an open PR already exists, /fix on the PR is the right path
          OPEN_PR=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName \
            | jq -r --arg prefix "auto/issue-$ISSUE-" \
                '[.[] | select(.headRefName | startswith($prefix))][0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "This issue already has an open PR (#${OPEN_PR}). Use \`/fix\` on the PR instead of \`/continue\` on the issue."
            echo "::error::Open PR #$OPEN_PR already exists for issue #$ISSUE"
            exit 1
          fi

          # Parse branch from the most recent <!-- auto-status --> comment.
          # Use awk so a no-match doesn't kill the pipeline under set -euo pipefail.
          LAST_STATUS=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .body // ""')
          BRANCH=$(printf '%s' "$LAST_STATUS" \
            | awk -F'`' '/Branch:/ { b = $2 } END { if (b) print b }')

          if [ -z "$BRANCH" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "No prior-run branch found in the status comment. Comment \`/go\` to start fresh."
            echo "::error::No branch found in status comment for issue #$ISSUE"
            exit 1
          fi

          # Verify branch still exists on origin
          REMOTE_REF=$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "refs/heads/$BRANCH" 2>/dev/null || true)
          if [ -z "$REMOTE_REF" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "Branch \`${BRANCH}\` no longer exists on origin. Comment \`/go\` to start over."
            echo "::error::Branch $BRANCH not found on origin"
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.preflight.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+${APP_SLUG}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record starting SHA
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move issue to In Progress
        env:
          GH_TOKEN: ${{ steps.org-app-token.outputs.token }}
          GH_TOKEN_REPO: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/set-project-status.sh "${{ github.event.issue.number }}" "In Progress"

      - name: Post initial status comment
        id: status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ID=$(gh api -X POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body=$'<!-- auto-status -->\n## Working on this\n\n_(Resuming — task list will appear here as work progresses.)_' \
            --jq '.id')
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          AUTO_STATUS_COMMENT_ID: ${{ steps.status.outputs.comment_id }}
          AUTO_STATUS_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80
          show_full_output: true
          prompt: |
            You are resuming issue #${{ github.event.issue.number }} from a prior run.

            Read AGENTS.md (loaded via CLAUDE.md) for the playbook and conventions.
            Follow it strictly.

            **Live status reporting:** The runtime maintains a live status
            comment on the issue that mirrors your TodoWrite list — a hook
            fires on every TodoWrite call and PATCHes the comment with the
            rendered checklist. Use TodoWrite as your visible progress board:
            keep a granular task list, update statuses
            (pending / in_progress / completed) as you go, and the issue
            timeline tracks along automatically. Do NOT post or PATCH the
            status comment yourself — the hook owns it. Optional: wrap each
            phase in `::group::Phase: <name>` / `::endgroup::` on stdout for
            collapsible Actions-log sections. If you hit a blocker, post a
            separate comment explaining what's blocked, then stop — don't
            push half-done work. The post-step takes over the status comment
            at the end of the run with a verified outcome summary.

            Workflow:
            1. Load the issue and existing comments:
               `gh issue view ${{ github.event.issue.number }} --json title,body,comments`
               Find the most recent `<!-- auto-status -->` comment — its completed/
               remaining task list shows what the prior run accomplished and what
               is still left. The plan is the most recent substantive bot plan
               comment (usually the one that ends with "Reply with `/go` to proceed").
            2. You are already checked out on branch
               `${{ steps.preflight.outputs.branch }}`.
               Do NOT create a new branch. Commit and push to this branch as you
               complete work.
               Before continuing, run `git log -1 --format=%s` — if the subject
               starts with `WIP:`, the last commit is an auto-salvage of
               uncommitted edits from the prior halted run; inspect
               `git diff HEAD~1` and amend or revert as needed before
               proceeding.
            3. Complete the remaining tasks from the prior run, following the
               implement playbook from AGENTS.md (excluding code-reviewer —
               it runs after PR creation).
               - Update README.md and CHANGELOG.md inline if user-facing behavior
                 changed (per AGENTS.md "Documentation" section).
            4. Commit. **Do NOT add a Co-Authored-By trailer.** No Claude
               attribution in commit messages.
            5. Push the branch.
            6. **Build gate.** Run
               `(npm run typecheck && npm run build && npm test) 2>&1 | tee /tmp/build-output.txt`.
               If exit code is non-zero, read the output, apply a targeted fix,
               commit, push, and re-run. Allow up to two fix attempts. If the
               gate still fails after the second fix attempt, post a comment
               on the issue with the last 80 lines of `/tmp/build-output.txt`
               and stop — do NOT open a PR. The branch stays pushed for
               manual inspection.
            7. Open the PR:
               `gh pr create --title "<title>" --body "<body>" --base main`
               The body MUST contain `closes #${{ github.event.issue.number }}`
               so the issue auto-closes on merge. Summarise what changed.
               Capture the new PR number for the next step.
            8. Post a brief comment on the issue linking the PR. The
               `auto-review.yml` workflow will fire on PR open and post the
               `<!-- auto-review:1 -->` comment asynchronously — do not run
               code-reviewer here.

            If you hit a blocker you can't resolve, post a comment on the issue
            explaining what's blocked and stop — don't push half-done work.

      - name: Verify outcome and surface tool denials
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          START_SHA: ${{ steps.start.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -euo pipefail

          STATUS_ID=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .id // empty')

          if [ -z "$STATUS_ID" ]; then
            echo "No live status comment found — orchestrator never posted one. Nothing to update."
            exit 0
          fi
          echo "Live status comment ID: $STATUS_ID"

          CURRENT_BODY=$(gh api "repos/$REPO/issues/comments/$STATUS_ID" --jq '.body')

          PR_NUMBER=$(gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,headRefName,createdAt \
            | jq -r --arg prefix "auto/issue-$ISSUE-" '
                [.[] | select(.headRefName | startswith($prefix))]
                | sort_by(.createdAt) | last | .number // empty
              ')

          git fetch origin --quiet 2>/dev/null || true
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          else
            COMMITS=0
          fi

          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          case "$BRANCH" in
            "auto/issue-${ISSUE}-"*) ;;
            *) BRANCH="" ;;
          esac
          LAST_COMMIT=""
          if [ "$COMMITS" -gt 0 ]; then
            LAST_COMMIT=$(git log --format='%h %s' -n 1 2>/dev/null || echo "")
          fi

          DENIAL_COUNT=0
          DENIAL_DETAILS=""
          if [ -f "$LOG" ]; then
            DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
            DENIAL_DETAILS=$(jq -r '
              def text_of:
                if type == "string" then .
                elif type == "array" then map(.text // "" | tostring) | join(" ")
                else tostring end;
              select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
              | select((.is_error // false) == true)
              | (.content | text_of) as $c
              | select($c | test("permission|denied|not allowed"; "i"))
              | $c | gsub("\\s+"; " ") | .[0:240]
            ' "$LOG" 2>/dev/null | sort -u | head -20 || true)
          fi

          HALTED=false
          if [ -z "$PR_NUMBER" ]; then
            HALTED=true
          fi

          {
            printf '%s\n\n---\n\n## Run finished\n\n' "$CURRENT_BODY"
            if [ -n "$PR_NUMBER" ]; then
              printf 'Done — opened PR #%s. Auto-review will follow on PR open.\n' "$PR_NUMBER"
            elif [ "$COMMITS" -gt 0 ]; then
              printf '**Run halted** — pushed %s commit(s) but no PR was opened. See [run logs](%s).\n' "$COMMITS" "$RUN_URL"
            else
              printf '**Run halted** — no PR opened, no commits pushed. See [run logs](%s).\n' "$RUN_URL"
            fi
            if [ "$HALTED" = true ]; then
              printf '\n### How to recover\n\n'
              if [ -n "$BRANCH" ]; then
                printf 'Branch: `%s`\n' "$BRANCH"
              fi
              if [ -n "$LAST_COMMIT" ]; then
                printf 'Last commit: `%s`\n' "$LAST_COMMIT"
              fi
              if [ -n "$BRANCH" ] || [ -n "$LAST_COMMIT" ]; then
                printf '\n'
              fi
              if [ -n "$BRANCH" ]; then
                printf 'Comment `/continue` to resume from the branch above. Comment `/go` to start over with a fresh branch.\n'
              else
                printf 'Comment `/go` to start over with a fresh branch.\n'
              fi
            fi
            if [ "$DENIAL_COUNT" != "0" ]; then
              printf '\n<details><summary>%s tool denial(s) during this run</summary>\n\n' "$DENIAL_COUNT"
              printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted.\n'
              if [ -n "$DENIAL_DETAILS" ]; then
                printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
              else
                printf '\n_(unable to extract per-call detail; see [run logs](%s))_\n' "$RUN_URL"
              fi
              printf '\n</details>\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -F body=@/tmp/status-body.md

      - name: Move issue to PR
        # Auto-review.yml owns the verdict-based "Ready to merge" upgrade —
        # this step just records that a PR is open. Skip when pre-flight
        # aborted before checkout — the script lives in the repo working
        # tree and `gh` calls infer the repo from git context, both of which
        # fail with "fatal: not a git repository".
        if: always() && steps.preflight.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR=$(gh pr list --state open --limit 200 --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"auto/issue-${ISSUE}-\"))][0].number")
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No open PR found for issue #$ISSUE — leaving status at In Progress."
            exit 0
          fi
          GH_TOKEN="${{ steps.org-app-token.outputs.token }}" \
          GH_TOKEN_REPO="${{ steps.app-token.outputs.token }}" \
            .github/scripts/set-project-status.sh "$ISSUE" "PR"

  split:
    name: Split
    if: |
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'auto') &&
      contains(github.event.comment.body, '/split') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: File sub-issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find last plan comment containing a Suggested split block
          PLAN_BODY=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | test("Suggested split:"))] | last | .body // ""')

          if [ -z "$PLAN_BODY" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "No scope warning with a **Suggested split:** block found on this issue. Nothing to split. Comment \`/go\` to proceed with the full scope instead."
            exit 0
          fi

          # Idempotency: bail if sub-issues were already filed
          SPLIT_COUNT=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"<!-- auto-split:$ISSUE -->\"))] | length")
          if [ "$SPLIT_COUNT" -gt 0 ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "Sub-issues were already filed — see the earlier \`<!-- auto-split:$ISSUE -->\` comment for the list. No action taken."
            exit 0
          fi

          # Parse numbered title lines from the Suggested split block.
          # Format: each title is its own numbered line as plain text;
          # the rationale lives on the indented continuation line below
          # and is ignored here.
          TITLES=$(printf '%s' "$PLAN_BODY" \
            | awk '
                /\*\*Suggested split:\*\*/ { found=1; next }
                found && /^Reply.*\/split/ { exit }
                found && /^---/ { exit }
                found && /^[[:space:]]*[0-9]+\./ {
                  sub(/^[[:space:]]*[0-9]+\.[[:space:]]*/, "")
                  print
                }')

          if [ -z "$TITLES" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "Could not parse proposed split titles from the scope warning. Expected numbered lines like \`1. Title\` (rationale on the indented line below) under \`**Suggested split:**\`."
            exit 0
          fi

          # Inherit the parent's priority label (default priority:now). A grep
          # no-match would exit 1 under pipefail, so route through awk instead.
          PRIORITY_LABEL=$(gh issue view "$ISSUE" --repo "$REPO" --json labels \
            --jq '.labels[].name' \
            | awk '/^priority:/ { print; exit }')
          PRIORITY_LABEL="${PRIORITY_LABEL:-priority:now}"

          # Post the idempotency-anchor marker BEFORE any sub-issue creation so a
          # partial failure mid-loop still leaves a marker that the
          # already-filed check (above) will catch on a re-run. We PATCH this
          # comment with the final outcome at the end of the loop.
          MARKER_ID=$(gh api -X POST "/repos/$REPO/issues/$ISSUE/comments" \
            -f body="$(printf '<!-- auto-split:%s -->\n## Sub-issues filing in progress\n\nProcessing split request — this comment will update with the result.' "$ISSUE")" \
            --jq '.id')

          # Each iteration must NOT exit on a sub-step failure — a strand of
          # successful creations followed by one failure must still PATCH the
          # marker so re-runs see the partial state and don't duplicate. Every
          # gh call below is guarded; failures fall into FAILED with detail.
          CREATED=""
          FAILED=""
          while IFS= read -r title; do
            [ -z "$title" ] && continue

            # Capture both fields: .number for human-readable refs (#41),
            # .id for the sub_issues API (which expects the database id,
            # not the issue number — passing .number gives a 404).
            if ! CREATE_OUT=$(gh api -X POST "repos/$REPO/issues" \
                -f title="$title" \
                -f body="Sub-issue of #${ISSUE}." \
                --jq '"\(.number) \(.id)"' 2>/tmp/split-err.txt); then
              ERR=$(head -3 /tmp/split-err.txt 2>/dev/null || echo "unknown error")
              FAILED="${FAILED}"$'\n'"- (create failed) ${title} — \`${ERR}\`"
              continue
            fi
            NEW_NUMBER="${CREATE_OUT% *}"
            NEW_DB_ID="${CREATE_OUT##* }"

            LABEL_NOTE=""
            if ! gh issue edit "$NEW_NUMBER" --repo "$REPO" \
                --add-label "${PRIORITY_LABEL},auto" 2>/tmp/split-err.txt; then
              LABEL_NOTE=" (label apply failed)"
            fi

            # Link as native GitHub sub-issue.
            if gh api -X POST "repos/$REPO/issues/$ISSUE/sub_issues" \
                -F sub_issue_id="$NEW_DB_ID" 2>/tmp/split-err.txt; then
              CREATED="${CREATED}"$'\n'"- #${NEW_NUMBER}${LABEL_NOTE}: ${title}"
            else
              ERR=$(head -3 /tmp/split-err.txt 2>/dev/null || echo "unknown error")
              FAILED="${FAILED}"$'\n'"- #${NEW_NUMBER} (created, link failed)${LABEL_NOTE}: ${title} — \`${ERR}\`"
            fi
          done <<< "$TITLES"

          # PATCH the marker with the final outcome.
          {
            printf '<!-- auto-split:%s -->\n## Sub-issues filed\n\n' "$ISSUE"
            if [ -n "$CREATED" ]; then
              printf 'Linked as sub-issues of #%s:%s\n' "$ISSUE" "$CREATED"
            fi
            if [ -n "$FAILED" ]; then
              printf '\n**Some sub-issues could not be linked.** They were created but the `sub_issues` API call failed — see the error per row below. Link them manually if needed:%s\n' "$FAILED"
            fi
            printf '\nThis issue stays open as a tracker — close it manually once all sub-issues are done.\n'
          } > /tmp/auto-split-final.md
          gh api -X PATCH "/repos/$REPO/issues/comments/$MARKER_ID" \
            -F body=@/tmp/auto-split-final.md

          # Surface a non-zero exit so the workflow shows red when any link failed.
          if [ -n "$FAILED" ]; then exit 1; fi
