name: Auto Issue Worker

# Stage 1 (plan): when an issue is labeled `auto`, the planner sub-agent
# drafts a plan and posts it as a comment.
# Stage 2 (implement): when a maintainer replies `/go` on that issue,
# the orchestrator runs the AGENTS.md playbook, opens a PR, runs the
# code-reviewer against the diff, and posts the findings as a PR comment.
# The maintainer reads the review and comments `/fix` on the PR to trigger
# fix cycles (handled by auto-pr.yml).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Don't let two runs on the same issue race each other.
concurrency:
  group: auto-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'auto' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 20
          prompt: |
            You are the orchestrator for issue #${{ github.event.issue.number }}.

            Read AGENTS.md (loaded via CLAUDE.md) for the playbook and conventions.

            **Plan only — do not modify any files, do not branch, do not implement.**

            Steps:
            1. Load the issue:
               `gh issue view ${{ github.event.issue.number }} --json title,body,labels`
            2. Invoke the `planner` sub-agent (Agent tool, subagent_type "planner")
               with the issue title and body. The planner tags each open question
               as one of: `[EXPERT-RESEARCH]`, `[USER-DECISION + RESEARCH]`, or
               `[USER-DECISION]`. Handle each tag as follows:

               - `[EXPERT-RESEARCH]`: dispatch the named specialist immediately
                 (`next16-expert`, `pokeapi-expert`, or `srs-expert`). Fold the
                 answer into the plan as a resolved decision. Do NOT surface the
                 question to the maintainer — they should see the decided
                 direction with a one-line rationale, not the question.
                 Exception: if the specialist's answer is itself conditional on
                 a maintainer preference (e.g. "depends on whether you value
                 X over Y"), re-tag the item as `[USER-DECISION]` and surface
                 the specialist's framing alongside the options — do not
                 manufacture a confident decision out of a hedged answer.
               - `[USER-DECISION + RESEARCH]`: dispatch `researcher` to produce
                 a project-specific options brief (current ecosystem state,
                 comparative tradeoffs against this codebase's constraints, a
                 recommendation). Present the brief inline in the plan with a
                 clear decision frame for the maintainer.
               - `[USER-DECISION]`: present the question as-is.

               Run dispatches in parallel where the questions are independent.
               The plan you post MUST NOT contain any unanswered
               `[EXPERT-RESEARCH]` items, and every `[USER-DECISION + RESEARCH]`
               item MUST include the researcher's brief inline. Before posting,
               re-scan the draft for any remaining `[EXPERT-RESEARCH]` tags;
               if one is found, the corresponding specialist call was missed
               or failed silently — dispatch it and incorporate the answer
               before posting.
            3. Post the plan as a comment on the issue:
               `gh issue comment ${{ github.event.issue.number }} --body-file <path>`
            4. The comment must end with these two lines, on their own:
               "Reply with `/go` to proceed."
               "To change scope, post a comment describing the changes (or include them in your `/go` comment) — the implement stage treats follow-up comments as authoritative over this plan."

      - name: Surface tool denials
        if: always()
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -u
          if [ ! -f "$LOG" ]; then exit 0; fi

          DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
          if [ "$DENIAL_COUNT" = "0" ] || [ -z "$DENIAL_COUNT" ]; then
            echo "No tool denials."
            exit 0
          fi

          DENIAL_DETAILS=$(jq -r '
            def text_of:
              if type == "string" then .
              elif type == "array" then map(.text // "" | tostring) | join(" ")
              else tostring end;
            select(.type == "user")
            | .message.content[]?
            | select(.type == "tool_result")
            | select((.is_error // false) == true)
            | (.content | text_of) as $c
            | select($c | test("permission|denied|not allowed"; "i"))
            | $c | gsub("\\s+"; " ") | .[0:240]
          ' "$LOG" 2>/dev/null | sort -u | head -20 || true)

          {
            printf '<!-- auto-denials -->\n'
            printf '## %s tool denial(s) during the plan run\n\n' "$DENIAL_COUNT"
            printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted. See [run logs](%s).\n' "$RUN_URL"
            if [ -n "$DENIAL_DETAILS" ]; then
              printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
            fi
          } > /tmp/denials.md

          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/denials.md

      - name: Move issue to Planned
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: .github/scripts/set-project-status.sh ${{ github.event.issue.number }} "Planned"

  implement:
    name: Implement
    if: |
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'auto') &&
      contains(github.event.comment.body, '/go') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Conflict gate
        env:
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKERS=$(gh issue view "$ISSUE" --repo "$REPO" --json comments \
            --jq '.comments[].body' \
            | grep -oE '<!-- overlap-scan:[0-9]+[+][0-9]+:conflict -->' \
            | sort -u || true)

          if [ -z "$MARKERS" ]; then
            echo "No conflict markers — proceeding."
            exit 0
          fi

          BLOCKERS=()
          while IFS= read -r marker; do
            pair=$(echo "$marker" \
              | sed -E 's@<!-- overlap-scan:([0-9]+)[+]([0-9]+):conflict -->@\1 \2@')
            i=$(echo "$pair" | awk '{print $1}')
            j=$(echo "$pair" | awk '{print $2}')
            if [ "$i" = "$ISSUE" ]; then other="$j"; else other="$i"; fi
            state=$(gh issue view "$other" --repo "$REPO" --json state --jq '.state')
            if [ "$state" = "OPEN" ]; then
              BLOCKERS+=("#$other")
            fi
          done <<< "$MARKERS"

          if [ ${#BLOCKERS[@]} -eq 0 ]; then
            echo "All conflicting issues are closed — proceeding."
            exit 0
          fi

          LIST="${BLOCKERS[*]}"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Cannot proceed with \`/go\`: this issue has an unresolved conflict with open issue(s) ${LIST}. Reconcile (close the other issue, delete the relevant overlap-scan comment on this issue, or update both issues to remove the conflict) and re-comment \`/go\`."
          echo "::error::Blocked by open conflict(s): ${LIST}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record starting SHA
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move issue to In Progress
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: .github/scripts/set-project-status.sh ${{ github.event.issue.number }} "In Progress"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80
          prompt: |
            You are the orchestrator for issue #${{ github.event.issue.number }}.
            The maintainer approved the plan with `/go`. Implement and open a PR.

            Read AGENTS.md (loaded via CLAUDE.md) for the playbook and conventions.
            Follow it strictly.

            **Live status reporting (do this throughout):**

            Maintain a single live status comment on the issue so the maintainer
            can follow progress without tailing the Actions log. As your first
            action after loading the issue, post a comment with a hidden marker
            and capture its ID:

                ID=$(gh api -X POST \
                  /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
                  -f body=$'<!-- auto-status -->\n## Working on this\n\n- [ ] Research\n- [ ] Implement\n- [ ] Push branch\n- [ ] Open PR\n- [ ] Code review' \
                  --jq '.id')

            At each phase transition, PATCH the comment with the new state
            (tick the boxes, optionally add a one-line note about what you're
            doing). Endpoint: `gh api -X PATCH /repos/${{ github.repository }}/issues/comments/$ID -f body='...'`.

            Also wrap each phase in `::group::Phase: <name>` / `::endgroup::`
            on stdout so the Actions log gets collapsible sections.

            **Do not write the final "Done" status yourself.** A post-step runs
            after this action finishes and verifies the actual outcome (was a
            PR opened? was auto-review #1 posted? what tools got denied?), then
            overwrites the status comment with the verified result. Just leave
            the status in whatever in-progress state you reached.

            If you hit a blocker, edit the status comment so its **second line**
            (the line after the `<!-- auto-status -->` marker) starts with
            `Blocked: <reason>`. The post-step preserves any body whose second
            line starts with `Blocked:` and only appends a tool-denial summary.

            Workflow:
            1. Load the issue and existing comments:
               `gh issue view ${{ github.event.issue.number }} --json title,body,comments`
               The plan is the most recent substantive bot comment. If the user
               edited / followed up with scope changes in their `/go` comment or
               nearby comments, treat those as authoritative over the original plan.
               Comments whose body starts with `<!-- overlap-scan:` are
               informational links from the overlap-scan workflow — ignore them
               for scope decisions; they are not maintainer instructions.
            2. Create a feature branch named `auto/issue-${{ github.event.issue.number }}-<short-kebab-slug>`.
            3. Run the orchestration playbook from AGENTS.md (excluding
               code-reviewer at this stage — it runs after PR creation):
               - Specialists in parallel where their questions are independent.
               - ui-coder and/or data-coder for implementation, in parallel when
                 their work is independent.
               - Update README.md and CHANGELOG.md inline if user-facing behavior
                 changed (per AGENTS.md "Documentation" section).
            4. Commit. **Do NOT add a Co-Authored-By trailer.** No Claude
               attribution in commit messages.
            5. Push the branch.
            6. Open the PR:
               `gh pr create --title "<title>" --body "<body>" --base main`
               The body MUST contain `closes #${{ github.event.issue.number }}`
               so the issue auto-closes on merge. Summarise what changed.
               Capture the new PR number for the next step.
            7. Run the `code-reviewer` sub-agent (Agent tool, subagent_type
               "code-reviewer") against the diff
               (`git diff origin/main...HEAD`). Then post its findings on the PR
               via `gh pr comment <pr-number> --body-file <path>`, formatted
               exactly like this (no other content before the marker):

                   <!-- auto-review:1 -->
                   ## Auto-review #1

                   <bulleted punch list of findings, or "No significant issues.">

                   Verdict: Looks good to me

                   _Reply with `/fix` to have these findings addressed._

               The first line MUST be the HTML marker `<!-- auto-review:1 -->`
               exactly. A verdict line starting with `Verdict: ` MUST be
               present, followed by either `Looks good to me` (no significant
               issues) or `Needs fixes` (one or more issues that should be
               addressed). Use those whole-word phrases verbatim — no acronyms.
               When (and only when) the verdict is `Needs fixes`, append the
               italicised footer line shown above so the maintainer knows how
               to trigger a fix run. Omit the footer when the verdict is
               `Looks good to me`.
            8. Post a brief comment on the issue linking the PR.

            If you hit a blocker you can't resolve, post a comment on the issue
            explaining what's blocked and stop — don't push half-done work.

      - name: Verify outcome and surface tool denials
        if: always()
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          START_SHA: ${{ steps.start.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -euo pipefail

          STATUS_ID=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .id // empty')

          if [ -z "$STATUS_ID" ]; then
            echo "No live status comment found — orchestrator never posted one. Nothing to update."
            exit 0
          fi
          echo "Live status comment ID: $STATUS_ID"

          EXISTING_BODY=$(gh api "repos/$REPO/issues/comments/$STATUS_ID" --jq '.body')
          SECOND_LINE=$(printf '%s\n' "$EXISTING_BODY" | sed -n '2p')
          if printf '%s' "$SECOND_LINE" | grep -q '^Blocked:'; then
            ORCH_BLOCKED=1
          else
            ORCH_BLOCKED=0
          fi

          # Find the PR opened from this issue's auto branch. Match on branch
          # name (the orchestrator creates `auto/issue-N-<slug>`) — robust
          # against body-content variations like `Closes`/`fixes`/`resolves`.
          PR_NUMBER=$(gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,headRefName,createdAt \
            | jq -r --arg prefix "auto/issue-$ISSUE-" '
                [.[] | select(.headRefName | startswith($prefix))]
                | sort_by(.createdAt) | last | .number // empty
              ')

          if [ -n "$PR_NUMBER" ]; then
            REVIEW_FOUND=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '[.[] | select(.body | startswith("<!-- auto-review:1 -->"))] | length')
          else
            REVIEW_FOUND=0
          fi

          git fetch origin --quiet 2>/dev/null || true
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          else
            COMMITS=0
          fi

          DENIAL_COUNT=0
          DENIAL_DETAILS=""
          if [ -f "$LOG" ]; then
            DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
            DENIAL_DETAILS=$(jq -r '
              def text_of:
                if type == "string" then .
                elif type == "array" then map(.text // "" | tostring) | join(" ")
                else tostring end;
              select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
              | select((.is_error // false) == true)
              | (.content | text_of) as $c
              | select($c | test("permission|denied|not allowed"; "i"))
              | $c | gsub("\\s+"; " ") | .[0:240]
            ' "$LOG" 2>/dev/null | sort -u | head -20 || true)
          fi

          {
            printf '<!-- auto-status -->\n'
            if [ "$ORCH_BLOCKED" = "1" ]; then
              printf '%s' "$EXISTING_BODY" | tail -n +2
            elif [ -n "$PR_NUMBER" ] && [ "$REVIEW_FOUND" -gt 0 ]; then
              printf 'Done — opened PR #%s, posted auto-review #1.\n' "$PR_NUMBER"
            elif [ -n "$PR_NUMBER" ]; then
              printf '**Outcome unclear** — opened PR #%s but auto-review #1 was not posted. See [run logs](%s).\n' "$PR_NUMBER" "$RUN_URL"
            elif [ "$COMMITS" -gt 0 ]; then
              printf '**Outcome unclear** — pushed %s commit(s) but no PR was opened. See [run logs](%s).\n' "$COMMITS" "$RUN_URL"
            else
              printf 'No PR opened. See [run logs](%s).\n' "$RUN_URL"
            fi
            if [ "$DENIAL_COUNT" != "0" ]; then
              printf '\n<details><summary>%s tool denial(s) during this run</summary>\n\n' "$DENIAL_COUNT"
              printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted.\n'
              if [ -n "$DENIAL_DETAILS" ]; then
                printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
              else
                printf '\n_(unable to extract per-call detail; see [run logs](%s))_\n' "$RUN_URL"
              fi
              printf '\n</details>\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -f body=@/tmp/status-body.md

      - name: Move issue to PR / Ready to merge based on review verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          # If the issue closed mid-run (e.g. PR auto-merged), the auto-status
          # workflow owns the Done transition — don't fight it.
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR=$(gh pr list --state open --limit 200 --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"auto/issue-${ISSUE}-\"))][0].number")
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No open PR found for issue #$ISSUE — leaving status at In Progress."
            exit 0
          fi
          VERDICT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))]
                  | sort_by(.created_at) | last | .body // ""' \
            | grep -E '^Verdict:' | head -1 || true)
          if [[ "$VERDICT" == *"Looks good to me"* ]]; then
            STATUS="Ready to merge"
          else
            STATUS="PR"
          fi
          .github/scripts/set-project-status.sh "$ISSUE" "$STATUS"
