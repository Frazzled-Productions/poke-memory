name: Migration check

# D1 migration checks (OpenSpec change move-to-cloudflare, design D11). Replaces the Supabase
# parity check (#1806): there is no second database to drift from any more, because deploy.yml
# applies db/d1/migrations itself (`wrangler d1 migrations apply`) before every production deploy
# and every preview upload.
#
#   1. Every migration applies cleanly, in order, to a fresh local D1 (`--local`, Miniflare's
#      SQLite; no Cloudflare account or secret).
#   2. Append-only: a migration file that already exists on the PR's base branch may not be
#      edited, renamed or deleted. wrangler records applied migrations by file name, so an edit
#      to an applied file never reaches a database that has it; the fix goes in a new file.
#
# Needs no secrets, so it runs on fork and Dependabot PRs too. Not a required check.

on:
  pull_request:
    paths:
      - "db/d1/migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/migration-check.yml"

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The append-only check diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Migrations are append-only
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # --no-renames reports a rename as a delete plus an add, so it is caught as a delete.
          changed=$(git diff --no-renames --name-only --diff-filter=DM "origin/${BASE_REF}...HEAD" -- db/d1/migrations/)
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              echo "::error file=${file}::${file} already exists on ${BASE_REF} and must not be edited or removed. Put the change in a new migration file."
            done <<< "$changed"
            exit 1
          fi
          echo "No existing migration was edited or removed."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci

      - name: Apply every migration to a fresh local D1
        run: npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/d1"
