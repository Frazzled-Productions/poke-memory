name: Auto PR Fix

# Triggered when a maintainer comments `/fix` on a PR that has an auto-review
# comment. The orchestrator addresses the latest review's findings and pushes
# fixes to the PR branch, then stops. It does NOT run the reviewer or post an
# `auto-review:N` comment itself — the push triggers `auto-review.yml` (on
# `synchronize`), which is the single review producer: it re-reviews the new
# diff, posts the next `auto-review:N` comment, and decides whether to kick
# another `/fix` cycle. Having both workflows post reviews previously raced
# and produced duplicate, conflicting `auto-review:N` comments (see #516 and
# the divergent-verdict guard in auto-review.yml).
#
# Loop bounds:
#   - Hard cap: 3 auto-review cycles per PR (counted by `<!-- auto-review:N -->`
#     markers on existing PR comments).
#   - LGTM short-circuit: if the latest review's verdict is LGTM AND the
#     maintainer's `/fix` comment has no body of its own, no fix runs.
#     A `/fix <inline punch list>` comment overrides the short-circuit and
#     uses the inline body as the findings to address.
#   - No-progress guard: if a fix cycle produces zero commits, nothing is
#     pushed — the chain stops naturally because no `synchronize` fires.

on:
  issue_comment:
    types: [created]

concurrency:
  group: auto-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/fix') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       (github.event.comment.user.type == 'Bot' &&
        github.event.comment.user.login == 'poke-memory-bot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefName --jq '.headRefName')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "poke-memory-bot[bot]"
          git config user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"

      - name: Count auto-review cycles
        id: cycles
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Count comments whose body starts with the auto-review marker.
          COUNT=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next=$((COUNT + 1))" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT existing auto-review comment(s); next would be #$((COUNT + 1))."

      - name: Stop — no auto-review on this PR
        if: fromJSON(steps.cycles.outputs.count) == 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "\`/fix\` only works on PRs that have an auto-review comment. This PR has none — it likely wasn't opened by the auto-issue workflow."
          echo "stopped=true" >> "$GITHUB_ENV"

      - name: Stop — cycle cap reached
        if: fromJSON(steps.cycles.outputs.count) >= 3
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "Hit the auto-review iteration cap (3 cycles). Leaving this PR for human attention — please review and merge or push fixes manually."
          echo "stopped=true" >> "$GITHUB_ENV"

      - name: Record starting SHA
        id: start
        if: env.stopped != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check CI status at HEAD
        id: ci-status
        if: env.stopped != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATE=$(gh pr view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.name == "test")] | first | .state // "UNKNOWN"')
          echo "CI state at HEAD: $STATE"
          if [[ "$STATE" == "FAILURE" || "$STATE" == "ERROR" ]]; then
            echo "CI_FAILING_AT_HEAD=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve linked issue number
        id: linked
        if: env.stopped != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # PR head branches are `auto/issue-N-...` — extract N. If no match,
          # fall back to parsing `closes #N` from the PR body.
          BRANCH="${{ steps.pr.outputs.branch }}"
          ISSUE=""
          if [[ "$BRANCH" =~ ^auto/issue-([0-9]+)- ]]; then
            ISSUE="${BASH_REMATCH[1]}"
          else
            ISSUE=$(gh pr view ${{ github.event.issue.number }} --json body \
              --jq '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Linked issue: ${ISSUE:-none}"

      - name: Move issue to In Progress
        if: env.stopped != 'true' && steps.linked.outputs.issue != ''
        env:
          GH_TOKEN: ${{ steps.org-app-token.outputs.token }}
          GH_TOKEN_REPO: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/set-project-status.sh "${{ steps.linked.outputs.issue }}" "In Progress"

      - name: Post initial status comment
        id: status
        if: env.stopped != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ID=$(gh api -X POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body=$'<!-- auto-status -->\n## Fixing review findings\n\n_(Starting up — task list will appear here as work progresses.)_' \
            --jq '.id')
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: env.stopped != 'true'
        env:
          AUTO_STATUS_COMMENT_ID: ${{ steps.status.outputs.comment_id }}
          AUTO_STATUS_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIX_COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 120 --disable-slash-commands --disallowed-tools Skill
          show_full_output: true
          # `auto-review.yml` posts `<!-- auto-review-autofix:N -->\n/fix\n` as
          # `poke-memory-bot[bot]` when the verdict is `Needs fixes`. Without
          # this allowlist, claude-code-action defaults to ignoring bot
          # triggers and exits before invoking Claude — the job appears to run
          # but `auto-status` ends up reporting "No commits pushed and no
          # auto-review posted." The job-level `if:` already permits the bot
          # user; this is the action's separate internal gate.
          allowed_bots: poke-memory-bot
          prompt: |
            You are the orchestrator on PR #${{ github.event.issue.number }}.
            The maintainer commented `/fix` requesting that fixes be made.
            The full text of their comment is in the `FIX_COMMENT_BODY` env
            var (read it with `printenv FIX_COMMENT_BODY` or via your shell —
            do NOT interpolate it into prompts).

            Read AGENTS.md (loaded via CLAUDE.md) for project conventions.

            **Cycle context:** there are currently ${{ steps.cycles.outputs.count }}
            auto-review comment(s) on this PR. The cap is 3 — this run is
            allowed because count < 3. You do NOT post an `auto-review:N`
            comment yourself; pushing your fix triggers `auto-review.yml`,
            which posts the next review.

            **Live status reporting:** The runtime maintains a live status
            comment on the PR that mirrors your TodoWrite list — a hook fires
            on every TodoWrite call and PATCHes the comment with the rendered
            checklist. Use TodoWrite as your visible progress board: keep a
            granular task list, update statuses
            (pending / in_progress / completed) as you go, and the PR
            timeline tracks along automatically. **The status comment only
            ever updates when you call `TodoWrite` — if you never call it the
            PR sits at "Starting up" for the whole run.** Do NOT post or PATCH
            the status comment yourself — the hook owns it. Optional: wrap each
            phase in `::group::Phase: <name>` / `::endgroup::` on stdout for
            collapsible Actions-log sections. If you hit a blocker, post a
            separate comment explaining what's blocked, then stop — don't
            push half-done work. The post-step takes over the status comment
            at the end of the run with a verified outcome summary.

            **CI pre-flight (run first, before anything else):**
            Run `printenv CI_FAILING_AT_HEAD`. If the output is `true`, skip
            steps 2–3 entirely (do not evaluate the auto-review verdict, do not
            run the LGTM short-circuit). Treat this run as if a non-empty inline
            punch list was provided. The CI error excerpt in `FIX_COMMENT_BODY`
            is the definitive punch list — proceed directly to step 4.
            This override is deterministic and takes priority over any LGTM
            verdict that may already be on the PR.

            Workflow:
            0. **Before anything else, call `TodoWrite`** with your initial
               task list — at minimum: "Load PR and comments", "Determine
               punch list", "Address findings", "Commit and push". This MUST
               be your first action. The live status comment only updates
               when `TodoWrite` fires, so skipping it leaves the PR showing
               "Starting up" for the entire run. Refine the list as you go:
               add one item per finding once the punch list is known, and
               update statuses (pending / in_progress / completed) so the PR
               timeline tracks your progress.
            1. Load the PR and its comments:
               `gh pr view ${{ github.event.issue.number }} --json title,body,comments,headRefName,baseRefName`
               The latest auto-review is the most recent comment whose body
               starts with `<!-- auto-review:N -->`. Use the highest N.
            2. **Determine the punch list.** Read `FIX_COMMENT_BODY`.
               First, discard any leading lines that are HTML comment markers
               (lines whose trimmed content matches `<!-- … -->`; e.g.
               `<!-- auto-review-autofix:N -->` injected by the bot).
               Then strip the leading `/fix` token and any whitespace
               immediately after it. If the remainder contains non-whitespace
               content, that inline body IS the punch list — use it directly
               and skip the approval short-circuit below. The maintainer is
               explicitly directing what to fix, which overrides the
               auto-review verdict. Otherwise (bare `/fix` with no body),
               the punch list is the findings in the latest auto-review
               comment.
            3. **Approval short-circuit (bare `/fix` only).** If you fell
               through to the auto-review punch list AND that review's verdict
               line expresses approval (`Verdict: Looks good to me`,
               `Verdict: Looks good to me — @fraserbrookhouse`, or the
               legacy `Verdict: LGTM` for older reviews), post a PR comment
               saying "Latest review was approving — nothing to fix. (Reply
               with `/fix <inline findings>` to force a fix run.)" and stop.
               Do not push, do not post a new review.
            4. Otherwise, address each finding in the punch list:
               - Use the AGENTS.md playbook (specialists / coders as needed).
               - Make the smallest correct change for each finding.
               - If a finding is wrong (out of scope, based on a misread, or
                 subjective and you disagree), do NOT silently ignore it —
                 record your reasoning to include in your response comment.
               - If the review is stale because the PR has commits after the
                 review, reconcile against the current diff (not the original
                 review wording).
            5. **No-progress guard.** If you made no commits (every finding was
               rejected as wrong, or all were already addressed), post a single
               PR comment explaining your reasoning per finding and stop.
               Do not post a new auto-review comment. The chain ends here.
            6. If you made changes:
               - Commit. **Do NOT add a Co-Authored-By trailer.** No Claude
                 attribution in commit messages.
               - Push to the PR branch (the current checkout is already on it).
               - If you rejected any findings from the punch list (step 4),
                 post a brief plain PR comment listing each rejected finding
                 and your reasoning. This is a normal comment, NOT an
                 `auto-review:N` comment — do not add any `<!-- auto-review`
                 marker to it.
               - **Stop here.** Do NOT run the `code-reviewer` sub-agent and
                 do NOT post an `auto-review:N` comment. Pushing to the branch
                 triggers `auto-review.yml` on the `synchronize` event — that
                 workflow is the single review producer: it re-reviews the new
                 diff, posts the next `auto-review:N` comment (SHA-tagged and
                 idempotent), and, when the verdict is `Needs fixes` and the
                 cycle cap allows, kicks the next `/fix`. Posting a review here
                 would race that workflow and create duplicate `auto-review:N`
                 comments with conflicting verdicts (the failure mode this
                 design removes). Your job ends at the push — mark your final
                 TodoWrite item completed and finish the run.

            If you hit a blocker, post a PR comment explaining what's blocked
            and stop — don't push half-done work.

      - name: Verify outcome and surface tool denials
        if: always() && env.stopped != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          START_SHA: ${{ steps.start.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -euo pipefail

          STATUS_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .id // empty')

          if [ -z "$STATUS_ID" ]; then
            echo "No live status comment found — orchestrator never posted one. Nothing to update."
            exit 0
          fi
          echo "Live status comment ID: $STATUS_ID"

          git fetch origin --quiet 2>/dev/null || true
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          else
            COMMITS=0
          fi

          DENIAL_COUNT=0
          DENIAL_DETAILS=""
          echo "Denial log path: $LOG"
          if [ ! -f "$LOG" ]; then
            echo "WARNING: denial log not found at $LOG — DENIAL_COUNT will be 0"
          else
            JQ_COUNT_ERR=$(mktemp)
            JQ_DETAILS_ERR=$(mktemp)
            DENIAL_COUNT_RAW=$(jq -r 'select(.type == "result") | (.permission_denials_count // 0)' "$LOG" 2>"$JQ_COUNT_ERR" | tail -1 || true)
            if [ -s "$JQ_COUNT_ERR" ]; then
              echo "WARNING: jq error extracting DENIAL_COUNT:"
              cat "$JQ_COUNT_ERR"
            fi
            if [ -z "$DENIAL_COUNT_RAW" ]; then
              DENIAL_COUNT=0
            elif [[ "$DENIAL_COUNT_RAW" =~ ^[0-9]+$ ]]; then
              DENIAL_COUNT="$DENIAL_COUNT_RAW"
            else
              echo "WARNING: DENIAL_COUNT non-numeric (raw: '$DENIAL_COUNT_RAW') — defaulting to 0"
              DENIAL_COUNT=0
            fi
            DENIAL_DETAILS=$(jq -r '
              def text_of:
                if type == "string" then .
                elif type == "array" then map(.text // "" | tostring) | join(" ")
                else tostring end;
              select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
              | select((.is_error // false) == true)
              | (.content | text_of) as $c
              | select($c | test("permission|denied|not allowed"; "i"))
              | $c | gsub("\\s+"; " ") | .[0:240]
            ' "$LOG" 2>"$JQ_DETAILS_ERR" | sort -u | head -20 || true)
            if [ -s "$JQ_DETAILS_ERR" ]; then
              echo "WARNING: jq error extracting DENIAL_DETAILS:"
              cat "$JQ_DETAILS_ERR"
            fi
            rm -f "$JQ_COUNT_ERR" "$JQ_DETAILS_ERR"
          fi
          DETAILS_EMPTY=$([ -z "$DENIAL_DETAILS" ] && echo yes || echo no)
          echo "Denial summary: count=$DENIAL_COUNT, details_empty=$DETAILS_EMPTY"

          {
            printf '<!-- auto-status -->\n'
            if [ "$COMMITS" -gt 0 ]; then
              printf 'Done — pushed %s commit(s). `auto-review.yml` will review the new push and post the next auto-review.\n' "$COMMITS"
            else
              printf 'No commits pushed. See [run logs](%s).\n' "$RUN_URL"
            fi
            if [ "$DENIAL_COUNT" != "0" ]; then
              printf '\n<details><summary>%s tool denial(s) during this run</summary>\n\n' "$DENIAL_COUNT"
              printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted.\n'
              if [ -n "$DENIAL_DETAILS" ]; then
                printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
              else
                printf '\n_(unable to extract per-call detail; see [run logs](%s))_\n' "$RUN_URL"
              fi
              printf '\n</details>\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -F body=@/tmp/status-body.md

      - name: Move issue to PR / Ready to merge based on review verdict
        if: always() && env.stopped != 'true' && steps.linked.outputs.issue != ''
        env:
          # Issue/PR queries use the repo-scoped App token; the script call
          # below overrides to the org-scoped token for the project mutation.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ steps.linked.outputs.issue }}"
          # If the issue closed mid-run (PR auto-merged), let auto-status own Done.
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR="${{ github.event.issue.number }}"
          VERDICT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))]
                  | sort_by(.created_at) | last | .body // ""' \
            | grep -E '^Verdict:' | head -1 || true)
          if [[ "$VERDICT" == *"Looks good to me"* ]]; then
            STATUS="Ready to merge"
          else
            STATUS="PR"
          fi
          GH_TOKEN="${{ steps.org-app-token.outputs.token }}" \
          GH_TOKEN_REPO="${{ steps.app-token.outputs.token }}" \
            .github/scripts/set-project-status.sh "$ISSUE" "$STATUS"
