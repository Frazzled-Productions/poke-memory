name: Auto PR Fix

# Triggered when a maintainer comments `/fix` on a PR that has an auto-review
# comment. The orchestrator addresses the latest review's findings, pushes
# fixes to the PR branch, then re-runs the reviewer and posts a new review
# comment so the maintainer can decide whether to `/fix` again or merge.
#
# Loop bounds:
#   - Hard cap: 3 auto-review cycles per PR (counted by `<!-- auto-review:N -->`
#     markers on existing PR comments).
#   - LGTM short-circuit: if the latest review's verdict is LGTM, no fix runs.
#   - No-progress guard: if a fix cycle produces zero commits, no new review
#     is posted — the chain stops naturally.

on:
  issue_comment:
    types: [created]

concurrency:
  group: auto-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/fix') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve PR head branch
        id: pr
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefName --jq '.headRefName')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Count auto-review cycles
        id: cycles
        run: |
          # Count comments whose body starts with the auto-review marker.
          COUNT=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next=$((COUNT + 1))" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT existing auto-review comment(s); next would be #$((COUNT + 1))."

      - name: Stop — no auto-review on this PR
        if: fromJSON(steps.cycles.outputs.count) == 0
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "\`/fix\` only works on PRs that have an auto-review comment. This PR has none — it likely wasn't opened by the auto-issue workflow."
          echo "stopped=true" >> "$GITHUB_ENV"

      - name: Stop — cycle cap reached
        if: fromJSON(steps.cycles.outputs.count) >= 3
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "Hit the auto-review iteration cap (3 cycles). Leaving this PR for human attention — please review and merge or push fixes manually."
          echo "stopped=true" >> "$GITHUB_ENV"

      - name: Record starting SHA
        id: start
        if: env.stopped != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve linked issue number
        id: linked
        if: env.stopped != 'true'
        run: |
          # PR head branches are `auto/issue-N-...` — extract N. If no match,
          # fall back to parsing `closes #N` from the PR body.
          BRANCH="${{ steps.pr.outputs.branch }}"
          ISSUE=""
          if [[ "$BRANCH" =~ ^auto/issue-([0-9]+)- ]]; then
            ISSUE="${BASH_REMATCH[1]}"
          else
            ISSUE=$(gh pr view ${{ github.event.issue.number }} --json body \
              --jq '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Linked issue: ${ISSUE:-none}"

      - name: Move issue to In Progress
        if: env.stopped != 'true' && steps.linked.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: .github/scripts/set-project-status.sh "${{ steps.linked.outputs.issue }}" "In Progress"

      - uses: anthropics/claude-code-action@v1
        if: env.stopped != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80
          prompt: |
            You are the orchestrator on PR #${{ github.event.issue.number }}.
            The maintainer commented `/fix` requesting that the latest auto-review
            findings be addressed.

            Read AGENTS.md (loaded via CLAUDE.md) for project conventions.

            **Cycle context:** there are currently ${{ steps.cycles.outputs.count }}
            auto-review comment(s) on this PR. The new review you'll post after
            fixing is review #${{ steps.cycles.outputs.next }}. The cap is 3 —
            this is allowed because count < 3.

            **Live status reporting (do this throughout):**

            Maintain a single live status comment on the PR so the maintainer
            can follow progress without tailing the Actions log. As your first
            action after loading the PR, post a comment with a hidden marker
            and capture its ID:

                ID=$(gh api -X POST \
                  /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
                  -f body=$'<!-- auto-status -->\n## Fixing review findings\n\n- [ ] Address findings\n- [ ] Push\n- [ ] Re-review' \
                  --jq '.id')

            At each phase transition, PATCH the comment with the new state:
            `gh api -X PATCH /repos/${{ github.repository }}/issues/comments/$ID -f body='...'`.

            Also wrap each phase in `::group::Phase: <name>` / `::endgroup::`
            on stdout so the Actions log gets collapsible sections.

            **Do not write the final "Done" status yourself.** A post-step runs
            after this action finishes and verifies the actual outcome (was the
            auto-review actually posted? how many commits got pushed? what
            tools got denied?), then overwrites the status comment with the
            verified result. Just leave the status in whatever in-progress
            state you reached.

            If you hit a blocker, edit the status comment so its **second line**
            (the line after the `<!-- auto-status -->` marker) starts with
            `Blocked: <reason>`. The post-step preserves any body whose second
            line starts with `Blocked:` and only appends a tool-denial summary.

            Workflow:
            1. Load the PR and its comments:
               `gh pr view ${{ github.event.issue.number }} --json title,body,comments,headRefName,baseRefName`
               The latest auto-review is the most recent comment whose body
               starts with `<!-- auto-review:N -->`. Use the highest N.
            2. **Approval short-circuit.** If that review's verdict line
               expresses approval (`Verdict: Looks good to me`, or the legacy
               `Verdict: LGTM` for older reviews), post a PR comment saying
               "Latest review was approving — nothing to fix" and stop.
               Do not push, do not post a new review.
            3. Otherwise, address each finding in the punch list:
               - Use the AGENTS.md playbook (specialists / coders as needed).
               - Make the smallest correct change for each finding.
               - If a finding is wrong (out of scope, based on a misread, or
                 subjective and you disagree), do NOT silently ignore it —
                 record your reasoning to include in your response comment.
               - If the review is stale because the PR has commits after the
                 review, reconcile against the current diff (not the original
                 review wording).
            4. **No-progress guard.** If you made no commits (every finding was
               rejected as wrong, or all were already addressed), post a single
               PR comment explaining your reasoning per finding and stop.
               Do not post a new auto-review comment. The chain ends here.
            5. If you made changes:
               - Commit. **Do NOT add a Co-Authored-By trailer.** No Claude
                 attribution in commit messages.
               - Push to the PR branch (the current checkout is already on it).
               - Run the `code-reviewer` sub-agent (Agent tool, subagent_type
                 "code-reviewer") against the new diff
                 (`git diff origin/${{ github.event.repository.default_branch }}...HEAD`).
               - Post a new PR comment via
                 `gh pr comment ${{ github.event.issue.number }} --body-file <path>`
                 formatted exactly like this (no content before the marker):

                     <!-- auto-review:${{ steps.cycles.outputs.next }} -->
                     ## Auto-review #${{ steps.cycles.outputs.next }}

                     <bulleted punch list, or "No significant issues.">

                     Verdict: Looks good to me

                     _Reply with `/fix` to have these findings addressed._

                 The first line MUST be the marker exactly as shown. A verdict
                 line starting with `Verdict: ` MUST be present, with either
                 `Looks good to me` or `Needs fixes`. Use those whole-word
                 phrases verbatim — no acronyms. When (and only when) the
                 verdict is `Needs fixes`, append the italicised footer line
                 shown above so the maintainer knows how to trigger a fix
                 run. Omit the footer when the verdict is `Looks good to me`.

            If you hit a blocker, post a PR comment explaining what's blocked
            and stop — don't push half-done work.

      - name: Verify outcome and surface tool denials
        if: always() && env.stopped != 'true'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          NEXT: ${{ steps.cycles.outputs.next }}
          START_SHA: ${{ steps.start.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -u

          STATUS_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-status -->"))] | last | .id // empty')

          if [ -z "$STATUS_ID" ]; then
            echo "No live status comment found — orchestrator never posted one. Nothing to update."
            exit 0
          fi
          echo "Live status comment ID: $STATUS_ID"

          EXISTING_BODY=$(gh api "repos/$REPO/issues/comments/$STATUS_ID" --jq '.body')
          SECOND_LINE=$(printf '%s\n' "$EXISTING_BODY" | sed -n '2p')
          if printf '%s' "$SECOND_LINE" | grep -q '^Blocked:'; then
            ORCH_BLOCKED=1
          else
            ORCH_BLOCKED=0
          fi

          REVIEW_FOUND=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq --arg n "$NEXT" '[.[] | select(.body | startswith("<!-- auto-review:" + $n + " -->"))] | length')

          git fetch origin --quiet 2>/dev/null || true
          if [ -n "$START_SHA" ] && git rev-parse "$START_SHA" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "$START_SHA..HEAD" 2>/dev/null || echo 0)
          else
            COMMITS=0
          fi

          DENIAL_COUNT=0
          DENIAL_DETAILS=""
          if [ -f "$LOG" ]; then
            DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
            DENIAL_DETAILS=$(jq -r '
              def text_of:
                if type == "string" then .
                elif type == "array" then map(.text // "" | tostring) | join(" ")
                else tostring end;
              select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
              | select((.is_error // false) == true)
              | (.content | text_of) as $c
              | select($c | test("permission|denied|not allowed"; "i"))
              | $c | gsub("\\s+"; " ") | .[0:240]
            ' "$LOG" 2>/dev/null | sort -u | head -20 || true)
          fi

          {
            printf '<!-- auto-status -->\n'
            if [ "$ORCH_BLOCKED" = "1" ]; then
              printf '%s' "$EXISTING_BODY" | tail -n +2
            elif [ "$REVIEW_FOUND" -gt 0 ]; then
              printf 'Done — pushed %s commit(s), posted auto-review #%s.\n' "$COMMITS" "$NEXT"
            elif [ "$COMMITS" -gt 0 ]; then
              printf '**Outcome unclear** — pushed %s commit(s), but auto-review #%s was not posted on this PR. See [run logs](%s).\n' "$COMMITS" "$NEXT" "$RUN_URL"
            else
              printf 'No commits pushed and no auto-review posted. See [run logs](%s).\n' "$RUN_URL"
            fi
            if [ "$DENIAL_COUNT" != "0" ]; then
              printf '\n<details><summary>%s tool denial(s) during this run</summary>\n\n' "$DENIAL_COUNT"
              printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted.\n'
              if [ -n "$DENIAL_DETAILS" ]; then
                printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
              else
                printf '\n_(unable to extract per-call detail; see [run logs](%s))_\n' "$RUN_URL"
              fi
              printf '\n</details>\n'
            fi
          } > /tmp/status-body.md

          gh api -X PATCH "repos/$REPO/issues/comments/$STATUS_ID" -f body=@/tmp/status-body.md

      - name: Move issue to PR / Ready to merge based on review verdict
        if: always() && env.stopped != 'true' && steps.linked.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ steps.linked.outputs.issue }}"
          # If the issue closed mid-run (PR auto-merged), let auto-status own Done.
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR="${{ github.event.issue.number }}"
          VERDICT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))]
                  | sort_by(.created_at) | last | .body // ""' \
            | grep -E '^Verdict:' | head -1 || true)
          if [[ "$VERDICT" == *"Looks good to me"* ]]; then
            STATUS="Ready to merge"
          else
            STATUS="PR"
          fi
          .github/scripts/set-project-status.sh "$ISSUE" "$STATUS"
