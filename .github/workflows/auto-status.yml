name: Auto Status

# Sets the project Status to Done when an issue closes (whether merged via
# `closes #N` on a PR, manually closed, or closed as not-planned). The other
# transitions (Planned, In Progress, PR, Ready to merge) are driven from
# auto-issue.yml and auto-pr.yml at the matching workflow phases.

on:
  issues:
    types: [closed]

concurrency:
  group: auto-status-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  done:
    name: Mark Done
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Mint repo-scoped App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token
        id: org-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Move issue to Done
        env:
          GH_TOKEN: ${{ steps.org-app-token.outputs.token }}
          GH_TOKEN_REPO: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/set-project-status.sh ${{ github.event.issue.number }} "Done"
