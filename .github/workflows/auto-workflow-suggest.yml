name: Auto Workflow Suggest

# Weekly cron that scans process-signal channels from the last 30 days and
# creates a single digest issue per ISO week with ≤5 curated improvement
# proposals targeting workflow files, agent definitions, and process docs.
#
# Signals consumed (pre-gathered into /tmp/signals/ by a shell step, #1917):
#   - Retro comments (last 30d) on closed issues
#   - auto-review comments + PR review bodies on merged PRs (last 30d)
#   - WIP-salvage commits (last 30d)
#   - Agent invocation patterns in merged PR descriptions (last 30d)
#
# Idempotency: skips silently when a digest issue for the current ISO week
# already exists (open or closed), or when nothing crosses the relevance
# threshold. A manual workflow_dispatch run bypasses the duplicate-issue
# check and always runs; only the scheduled cron is guarded against duplicates.
# Re-running manually in a week that already has a digest may therefore
# create a second digest issue — that is intended.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-workflow-suggest
  cancel-in-progress: false

jobs:
  suggest:
    name: Weekly Workflow Digest
    runs-on: ubuntu-latest
    # 30: the pre-gather step (#1917) does the 30-day signal fetch in shell,
    # so the agent phase is bounded (~10-15 turns); the W28 agent-side gather
    # ran ~17 min, the pre-gathered shape should be well under 10.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Compute ISO week key
        id: week
        run: echo "key=$(date -u +"%G-W%V")" >> "$GITHUB_OUTPUT"

      - name: Idempotency check — skip if digest already exists this week
        id: idempotency
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEEK_KEY: ${{ steps.week.outputs.key }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run (workflow_dispatch) — bypassing idempotency check."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE="Weekly workflow review — ${WEEK_KEY}"
          COUNT=$(gh issue list \
            --search "\"${TITLE}\" in:title" \
            --state all \
            --limit 5 \
            --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "Digest issue for ${WEEK_KEY} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure area:workflow label exists
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          EXISTS=$(gh label list --json name --jq '[.[].name] | index("area:workflow") != null')
          if [ "$EXISTS" = "false" ]; then
            gh label create "area:workflow" --color "0075ca" --description "Workflow and automation improvements"
            echo "Created area:workflow label."
          else
            echo "area:workflow label already exists."
          fi

      # Pre-gather the 30-day process signals deterministically in shell so the
      # agent reads prepared files instead of paginating the API turn-by-turn.
      # The agent-side gather was unbounded: up to 50 `gh issue view` + 30
      # `gh pr view` calls, so the turn count depended on repo activity and on
      # whether the model happened to batch its loops (W28 ran in 25 turns, W29
      # died at the 60-turn cap, #1917). Fetch count here is bounded: one
      # paginated comments feed, one PR list, at most 100 review fetches, one
      # commits feed, well inside the App token's rate budget.
      - name: Pre-gather process signals
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/signals
          SINCE=$(date -u -d "30 days ago" +"%Y-%m-%dT%H:%M:%SZ")

          # Single paginated feed of all issue/PR comments updated in the
          # window (NDJSON: one compact JSON object per line). Both retro
          # comments and auto-review comments are issue comments, so one
          # feed serves signals 1 and 2.
          gh api "repos/${REPO}/issues/comments?since=${SINCE}&per_page=100" --paginate \
            --jq '.[] | {body: .body, html_url: .html_url, issue_url: .issue_url}' \
            > /tmp/signals/comments.ndjson

          # Signal 1: retro comments (marker: <!-- auto-retro -->). Null-guard
          # .body: startswith on a null (deleted/ghost comment) exits jq with
          # status 5 and, under set -e, aborts the whole pre-gather.
          jq -r 'select((.body // "") | startswith("<!-- auto-retro -->"))
            | "### " + .html_url + "\n\n" + .body + "\n"' \
            /tmp/signals/comments.ndjson > /tmp/signals/retro-comments.md

          # Signal 2a: PRs merged in the window, with bodies (also feeds
          # signal 4). The old `--search "head:auto/"` shape returned 30
          # ancient best-match PRs (the pipeline no longer uses auto/*
          # branches) and never filtered on the window, so the review-comment
          # and agent-pattern signals were being read off stale data;
          # window-filter server-side and keep headRefName so auto/* PRs are
          # still distinguishable.
          SINCE_DAY=$(date -u -d "30 days ago" +"%Y-%m-%d")
          gh pr list --state merged --limit 100 \
            --search "merged:>=${SINCE_DAY} sort:updated-desc" \
            --json number,title,headRefName,mergedAt,url,body \
            --jq 'map(.body = ((.body // "")[0:4000]))' \
            > /tmp/signals/merged-prs.json
          if [ "$(jq length /tmp/signals/merged-prs.json)" -eq 100 ]; then
            echo "WARNING: PR list capped at 100 - the window may contain more merged PRs than were gathered."
          fi

          # Signal 2b: structured auto-review comments posted in the window.
          # Not filtered to a PR-number set: the reviewer comments on whichever
          # head branch the pipeline used, and the window is the real scope.
          jq -r 'select((.body // "") | startswith("<!-- auto-review"))
            | "### " + .html_url + "\n\n" + .body + "\n"' \
            /tmp/signals/comments.ndjson > /tmp/signals/auto-review-comments.md

          # Signal 2c: formal PR review bodies on the window's merged PRs
          # (bounded loop, at most 100 calls).
          : > /tmp/signals/pr-reviews.md
          while read -r N; do
            gh api "repos/${REPO}/pulls/${N}/reviews" \
              --jq '.[] | select((.body // "") != "")
                | "### Review (" + .state + ") - " + .html_url + "\n\n" + .body + "\n"' \
              >> /tmp/signals/pr-reviews.md || echo "(reviews fetch failed for PR #${N} - skipped)" >> /tmp/signals/pr-reviews.md
          done < <(jq -r '.[].number' /tmp/signals/merged-prs.json)

          # Signal 3: WIP-salvage commits in the window.
          gh api "repos/${REPO}/commits?since=${SINCE}&per_page=100" --paginate \
            --jq '.[] | select((.commit.message // "") | startswith("WIP:"))
              | .sha[0:7] + " " + ((.commit.message // "") | split("\n")[0]) + " " + .html_url' \
            > /tmp/signals/wip-commits.txt

          rm -f /tmp/signals/comments.ndjson

          # Context guard: cap each text file at 150 KB so a noisy month
          # cannot blow the agent's context window either. merged-prs.json is
          # exempt (byte-truncation would corrupt the JSON); its bodies are
          # already capped at 4000 chars each above. nullglob so a future
          # missing file cannot leave a literal glob for wc -c to crash on.
          shopt -s nullglob
          for f in /tmp/signals/*.md /tmp/signals/*.txt; do
            if [ "$(wc -c < "$f")" -gt 150000 ]; then
              head -c 150000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              printf '\n\n[TRUNCATED at 150 KB]\n' >> "$f"
            fi
          done
          shopt -u nullglob

          echo "Gathered signal files:"
          wc -c /tmp/signals/*

      # Pinned to an immutable release SHA, not the floating `@v1` tag.
      # The scheduled 2026-06-01 run failed inside the action with the
      # same internal "directory mismatch for ... tsconfig.json" build
      # bug + turn-cap exit that broke auto-review (#1566); the prior
      # 2026-05-25 run on the older pinned-via-floating build succeeded
      # (#1547). v1.0.133 (2026-05-23) predates the regression.
      - uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        if: steps.idempotency.outputs.skip != 'true'
        id: claude
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEEK_KEY: ${{ steps.week.outputs.key }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 30 (was 60, #1795): the 60-turn budget still overflowed once repo
          # activity grew (#1917, W29 hit error_max_turns at 61 turns), because
          # the agent was doing the per-issue/per-PR gather itself. The
          # pre-gather step now does all API fetching deterministically, so the
          # agent only reads 4 signal groups across 5 prepared files,
          # synthesises, and files one issue
          # (~10-15 turns). Do NOT raise this again; if it overflows, the
          # pre-gather step is failing to keep the agent phase bounded and that
          # is the thing to fix.
          claude_args: --max-turns 30 --disable-slash-commands --disallowed-tools Skill
          prompt: |
            You are generating a weekly workflow improvement digest for this repository.

            Today is $(date -u +"%Y-%m-%d"). The current ISO week is **${{ steps.week.outputs.key }}**.

            ## Your task

            1. Gather process signals from the last 30 days (see below).
            2. Synthesise ≤5 curated improvement proposals targeting only:
               - `.github/workflows/**`
               - `.claude/agents/**`
               - `WORKFLOW.md`
               - `AGENTS.md`
            3. If nothing crosses a relevance threshold (e.g. no recurring
               friction, no failed build patterns, no WIP salvages), skip
               silently — do NOT create a digest issue.
            4. If you have ≥1 item worth raising, create exactly one digest
               issue for this week (title: `Weekly workflow review — ${{ steps.week.outputs.key }}`).

            ## Signals (pre-gathered)

            All signals have already been fetched into `/tmp/signals/` by a
            previous workflow step. Do NOT re-fetch them from the GitHub API;
            just read these files:

            ### 1. Retro comments (last 30 days)
            `/tmp/signals/retro-comments.md`: every `<!-- auto-retro -->`
            comment posted in the window, each headed by its GitHub URL.
            Summarise the lessons in aggregate; do NOT quote verbatim. An
            empty file means no retros this window.

            ### 2. Review feedback on merged PRs (last 30 days)
            `/tmp/signals/auto-review-comments.md`: the structured
            `<!-- auto-review:N -->` comments posted in the window, each headed
            by its GitHub URL. `/tmp/signals/pr-reviews.md`: formal PR review
            bodies on the window's merged PRs. Summarise findings; do not
            quote verbatim.

            ### 3. WIP-salvage commits (last 30 days)
            `/tmp/signals/wip-commits.txt`: one line per `WIP:` commit
            (short SHA, first message line, commit URL). Note how many WIP
            salvages occurred and what they were on. An empty file means none.

            ### 4. Agent invocation patterns in merged PR descriptions
            `/tmp/signals/merged-prs.json`: the PRs merged in the window, with
            `number`, `title`, `headRefName`, `mergedAt`, `url`, and `body`
            (capped at 4000 chars). Extract from each PR body: mentions of `subagent_type:`,
            agent names from the roster (planner, next16-expert,
            pokeapi-expert, etc.), and any notes about agent overhead or
            skipped agents. Look for patterns (agents frequently skipped,
            agents that ran but added no value, etc.).

            ## Synthesis rules

            - Propose only changes to the four target areas listed above.
            - Maximum 5 items. Choose the highest-signal ones.
            - Each item MUST include:
              - A one-line proposal (imperative: "Add X", "Remove Y", "Rename Z")
              - Evidence: 1–3 links to the retro comments, PR review comments,
                or commit SHAs that support the proposal (use GitHub URLs)
              - Recommended priority: `priority:now`, `priority:next`, or
                `priority:later` (use the repo label vocabulary)
            - If a proposal is about an agent definition change, name the
              specific agent file in `.claude/agents/`.
            - Do NOT auto-file individual sub-issues. Each proposal carries a
              checkbox (`- [ ] File this as an issue <!-- proposal:N -->`); when
              the maintainer ticks a checkbox, `auto-digest-fanout.yml` files
              the child issue automatically. The digest itself is still for
              human triage — just write the checkboxes, do not call `gh issue
              create` per proposal.
            - Do NOT recommend code changes to the app itself — only process
              and workflow improvements.

            ## No-op rule

            If after gathering all signals you have nothing worth proposing
            (no recurring friction, no build failures, no WIP salvages, no
            patterns of agent overhead), write a short note to stdout explaining
            what you found and exit cleanly — **do not create a digest issue**.
            A quiet week is fine; a noisy backlog is not.

            ## Issue creation

            If you have ≥1 item, write the digest body to `/tmp/digest-body.md`
            in this format:

            ```markdown
            <!-- auto-workflow-suggest -->
            ## Weekly workflow review — WEEK_KEY

            Signals scanned: retro comments, review feedback on merged PRs,
            WIP-salvage commits, agent invocation patterns — last 30 days.

            ---

            ### 1. <one-line proposal>

            **Evidence:** <link(s)>
            **Priority:** `priority:next`

            - [ ] File this as an issue <!-- proposal:1 -->

            ---

            ### 2. ...
            ```

            The checkbox line is load-bearing: `auto-digest-fanout.yml` watches
            for `- [x] ... <!-- proposal:N -->` and files the matching proposal
            as a child issue with the extracted priority label and `area:workflow`.
            The `<!-- proposal:N -->` marker MUST match the heading number `N`,
            and every proposal heading must have exactly one corresponding
            checkbox line beneath it.

            Then create the issue:
            ```
            gh issue create \
              --title "Weekly workflow review — ${{ steps.week.outputs.key }}" \
              --body-file /tmp/digest-body.md \
              --label "area:workflow"
            ```

            Store the issue number in `/tmp/digest-issue-number.txt` (just the
            number, no other text):
            ```
            gh issue list \
              --search "\"Weekly workflow review — ${{ steps.week.outputs.key }}\" in:title" \
              --state open --limit 1 --json number --jq '.[0].number' \
              > /tmp/digest-issue-number.txt
            ```

      - name: Surface tool denials
        if: always() && steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -u
          if [ ! -f "$LOG" ]; then exit 0; fi

          DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
          if [ "$DENIAL_COUNT" = "0" ] || [ -z "$DENIAL_COUNT" ]; then
            echo "No tool denials."
            exit 0
          fi

          # Try to get the digest issue number if one was created
          ISSUE_NUM=""
          if [ -f "/tmp/digest-issue-number.txt" ]; then
            ISSUE_NUM=$(cat /tmp/digest-issue-number.txt | tr -d '[:space:]')
          fi

          DENIAL_DETAILS=$(jq -r '
            def text_of:
              if type == "string" then .
              elif type == "array" then map(.text // "" | tostring) | join(" ")
              else tostring end;
            select(.type == "user")
            | .message.content[]?
            | select(.type == "tool_result")
            | select((.is_error // false) == true)
            | (.content | text_of) as $c
            | select($c | test("permission|denied|not allowed"; "i"))
            | $c | gsub("\\s+"; " ") | .[0:240]
          ' "$LOG" 2>/dev/null | sort -u | head -20 || true)

          {
            printf '<!-- auto-denials:workflow-suggest -->\n'
            printf '## %s tool denial(s) during weekly workflow digest run\n\n' "$DENIAL_COUNT"
            printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted. See [run logs](%s).\n' "$RUN_URL"
            if [ -n "$DENIAL_DETAILS" ]; then
              printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
            fi
          } > /tmp/denials.md

          # Post on the digest issue if one was created; otherwise post on the repo
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file /tmp/denials.md
          else
            echo "No digest issue to comment on — denial details logged to stdout only."
            cat /tmp/denials.md
          fi
