name: Auto App Suggest

# Weekly cron that surfaces user-facing feature ideas for this repository.
# Grounds the suggestions in open enhancement issues, thin app surfaces,
# README vs. codebase gaps, recent CHANGELOG themes, and the latest
# workflow-suggest digest.
#
# Synthesis constraints:
#   - ≤5 proposals per digest; quiet weeks skip silently
#   - Every proposal must describe a behaviour change a user would notice
#   - FORBIDDEN: refactors, test additions, dead-code removal, dependency
#     bumps, accessibility gaps, CI/workflow changes
#
# Idempotency: skips silently when a digest issue for the current ISO week
# already exists (open or closed), or when nothing crosses the bar.

on:
  schedule:
    - cron: '0 9 * * 4'   # Thursday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-app-suggest
  cancel-in-progress: false

jobs:
  suggest:
    name: Weekly Feature Ideas Digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Compute ISO week key
        id: week
        run: echo "key=$(date -u +"%G-W%V")" >> "$GITHUB_OUTPUT"

      - name: Compute today date
        id: date
        run: echo "date=$(date -u +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"

      - name: Idempotency check — skip if digest already exists this week
        id: idempotency
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEEK_KEY: ${{ steps.week.outputs.key }}
        run: |
          set -euo pipefail
          TITLE="Weekly feature ideas — ${WEEK_KEY}"
          COUNT=$(gh issue list \
            --search "\"${TITLE}\" in:title" \
            --state all \
            --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "Digest issue for ${WEEK_KEY} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure area:app label exists
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          EXISTS=$(gh label list --json name --jq '[.[].name] | index("area:app") != null')
          if [ "$EXISTS" = "false" ]; then
            gh label create "area:app" --color "e4e669" --description "App codebase improvements"
            echo "Created area:app label."
          else
            echo "area:app label already exists."
          fi

      - name: Ensure enhancement label exists
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          EXISTS=$(gh label list --json name --jq '[.[].name] | index("enhancement") != null')
          if [ "$EXISTS" = "false" ]; then
            gh label create "enhancement" --color "a2eeef" --description "New feature or request"
            echo "Created enhancement label."
          else
            echo "enhancement label already exists."
          fi

      - name: Ensure priority:later label exists
        if: steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          EXISTS=$(gh label list --json name --jq '[.[].name] | index("priority:later") != null')
          if [ "$EXISTS" = "false" ]; then
            gh label create "priority:later" --color "e4e4e4" --description "Nice to have, no urgent timeline"
            echo "Created priority:later label."
          else
            echo "priority:later label already exists."
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.idempotency.outputs.skip != 'true'
        id: claude
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEEK_KEY: ${{ steps.week.outputs.key }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30
          prompt: |
            You are generating a weekly feature ideas digest for this repository.

            Today is ${{ steps.date.outputs.date }}. The current ISO week is **${{ steps.week.outputs.key }}**.

            ## Your task

            1. Gather the signals below.
            2. Synthesise ≤5 user-facing feature proposals.
               If nothing crosses the bar, skip silently — do NOT create a digest issue.
               Write a short stdout note explaining why and exit.
            3. If you have ≥1 item, create exactly one digest issue.

            ## Signals to gather

            ### Signal 1 — Open enhancement issues
            ```bash
            gh issue list --label "enhancement" --state open --limit 50 \
              --json number,title,body,labels
            ```
            Identify clusters (3+ issues touching the same surface) and uncovered gaps.

            ### Signal 2 — User-facing pages and components
            List page files:
            ```bash
            find app -name 'page.tsx' | sort
            ```
            List component files:
            ```bash
            ls components/
            ```
            Read pages that look thin (few interactions, no secondary state). Identify
            surfaces where a small addition would meaningfully improve the user experience.

            ### Signal 3 — README "Features" section vs. codebase
            ```bash
            cat README.md
            ```
            Cross-reference documented features against what pages and components actually
            exist. Note features mentioned in README that lack implementation, or
            implemented capabilities not yet surfaced in the README.

            ### Signal 4 — Recent CHANGELOG entries
            ```bash
            cat CHANGELOG.md
            ```
            Read `[Unreleased]` and the last 3 released sections. What feature themes
            are emerging? What complementary features would naturally follow?

            ### Signal 5 — Latest auto-workflow-suggest digest
            ```bash
            gh issue list --search "Weekly workflow review" \
              --state all --limit 1 --json number,title,body --jq '.[0]'
            ```
            Scan for any user-experience themes that the retro aggregation flagged.
            If no workflow digest exists yet, skip this signal silently.

            ## Synthesis rules

            - Maximum 5 items. Choose the highest-signal ones.
            - **EXPLICITLY FORBIDDEN** — silently drop any item that:
              - Contains the words "refactor", "test", "extract helper", "dead code",
                "dependency", or "accessibility"
              - Proposes a code-quality improvement rather than a user behaviour change
              - Touches only CI, workflow, or agent files
            - **REQUIRED** — every item must describe a behaviour change a user would notice.
            - Each item must include:
              - A one-line proposal written as an imperative (e.g. "Add a streak counter
                to the practice complete screen")
              - **Surface**: the page(s) or component(s) affected
              - **Why it matters**: 1–2 sentences on the user benefit
              - **Priority:** `priority:now`, `priority:next`, or `priority:later`

            ## No-op rule

            If no items meet the requirements after scanning all signals, write a short
            note to stdout (signals scanned, why nothing crossed the bar) and exit —
            **do not create a digest issue**. A quiet week is fine.

            ## Issue creation

            If you have ≥1 item, write the digest body to `/tmp/digest-body.md`
            in this exact format:

            ```markdown
            <!-- auto-app-suggest -->
            ## Weekly feature ideas — WEEK_KEY

            Signals scanned: open enhancement issues, user-facing pages/components,
            README vs. codebase gap, last 3 CHANGELOG releases, latest workflow digest.

            ---

            ### 1. <one-line proposal>

            **Surface:** `app/path/page.tsx`
            **Why it matters:** <1–2 sentences>
            **Priority:** `priority:next`

            - [ ] File this as an issue <!-- proposal:1 -->

            ---

            ### 2. ...
            ```

            Then create the issue:
            ```bash
            gh issue create \
              --title "Weekly feature ideas — ${{ steps.week.outputs.key }}" \
              --body-file /tmp/digest-body.md \
              --label "area:app" --label "enhancement" --label "priority:later"
            ```

            Store the issue number in `/tmp/digest-issue-number.txt` (just the
            number, no other text):
            ```bash
            gh issue list \
              --search "\"Weekly feature ideas — ${{ steps.week.outputs.key }}\" in:title" \
              --state all --limit 1 --json number --jq '.[0].number' \
              > /tmp/digest-issue-number.txt
            ```

      - name: Surface tool denials
        if: always() && steps.idempotency.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG: /home/runner/work/_temp/claude-execution-output.json
        run: |
          set -u
          if [ ! -f "$LOG" ]; then exit 0; fi

          DENIAL_COUNT=$(jq -rs 'map(select(.type == "result")) | last | (.permission_denials_count // 0) | tostring' "$LOG" 2>/dev/null || echo 0)
          if [ "$DENIAL_COUNT" = "0" ] || [ -z "$DENIAL_COUNT" ]; then
            echo "No tool denials."
            exit 0
          fi

          # Try to get the digest issue number if one was created
          ISSUE_NUM=""
          if [ -f "/tmp/digest-issue-number.txt" ]; then
            ISSUE_NUM=$(cat /tmp/digest-issue-number.txt | tr -d '[:space:]')
          fi

          DENIAL_DETAILS=$(jq -r '
            def text_of:
              if type == "string" then .
              elif type == "array" then map(.text // "" | tostring) | join(" ")
              else tostring end;
            select(.type == "user")
            | .message.content[]?
            | select(.type == "tool_result")
            | select((.is_error // false) == true)
            | (.content | text_of) as $c
            | select($c | test("permission|denied|not allowed"; "i"))
            | $c | gsub("\\s+"; " ") | .[0:240]
          ' "$LOG" 2>/dev/null | sort -u | head -20 || true)

          {
            printf '<!-- auto-denials:app-suggest -->\n'
            printf '## %s tool denial(s) during weekly feature ideas digest run\n\n' "$DENIAL_COUNT"
            printf 'Claude was blocked from running these tools. Add the missing patterns to `.claude/settings.json` if any of them should be permitted. See [run logs](%s).\n' "$RUN_URL"
            if [ -n "$DENIAL_DETAILS" ]; then
              printf '\n```\n%s\n```\n' "$DENIAL_DETAILS"
            fi
          } > /tmp/denials.md

          # Post on the digest issue if one was created; otherwise log to stdout
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file /tmp/denials.md
          else
            echo "No digest issue to comment on — denial details logged to stdout only."
            cat /tmp/denials.md
          fi
