name: Auto Label

# Classify newly-opened issues and apply any missing labels for the three
# dimensions tracked in this repo: priority (priority:now / priority:next /
# priority:later), type (bug / enhancement), and area (area:workflow /
# area:app). Never removes or overwrites existing labels — purely additive.

on:
  issues:
    types: [opened]

concurrency:
  group: auto-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      id-token: write
      contents: read

    steps:
      - name: Check which dimensions are already covered
        id: check
        env:
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          set -euo pipefail

          HAS_PRIORITY=$(echo "$LABELS" | jq -r '[.[].name | select(startswith("priority:"))] | length > 0')
          HAS_TYPE=$(echo "$LABELS" | jq -r '[.[].name | select(. == "bug" or . == "enhancement")] | length > 0')
          HAS_AREA=$(echo "$LABELS" | jq -r '[.[].name | select(startswith("area:"))] | length > 0')

          echo "has_priority=$HAS_PRIORITY" >> "$GITHUB_OUTPUT"
          echo "has_type=$HAS_TYPE"         >> "$GITHUB_OUTPUT"
          echo "has_area=$HAS_AREA"         >> "$GITHUB_OUTPUT"

          # Early exit if all three are already covered
          if [ "$HAS_PRIORITY" = "true" ] && [ "$HAS_TYPE" = "true" ] && [ "$HAS_AREA" = "true" ]; then
            echo "all_covered=true" >> "$GITHUB_OUTPUT"
            echo "All three label dimensions already set — no-op."
          else
            echo "all_covered=false" >> "$GITHUB_OUTPUT"
            echo "Missing dimensions: priority=$HAS_PRIORITY type=$HAS_TYPE area=$HAS_AREA"
          fi

      - name: Mint App installation token
        id: app-token
        if: steps.check.outputs.all_covered != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        if: steps.check.outputs.all_covered != 'true'

      - name: Classify missing labels with Claude
        if: steps.check.outputs.all_covered != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 5
          prompt: |
            Classify a GitHub issue and write a JSON label assignment to /tmp/labels.json.

            ## Issue

            Fetch the issue data by running this command and reading its output:
            gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json title,body

            Use the `title` and `body` fields from the JSON output to understand what the issue is about.

            ## Already-set dimensions

            - priority already set: ${{ steps.check.outputs.has_priority }}
            - type already set: ${{ steps.check.outputs.has_type }}
            - area already set: ${{ steps.check.outputs.has_area }}

            ## Task

            For each dimension that is NOT already set (value is "false" above),
            pick the best label from the taxonomy below. For dimensions that ARE
            already set (value is "true"), output null.

            ### Label taxonomy

            **priority** (pick one, or null if already set):
            - `priority:now` — top priority; work on it immediately
            - `priority:next` — queued second in line; pick up after current work
            - `priority:later` — parking lot; revisit when relevant (DEFAULT when uncertain)

            **type** (pick one, or null if already set):
            - `bug` — something previously working is now broken
            - `enhancement` — new feature or improvement

            **area** (pick one, or null if already set):
            - `area:workflow` — GitHub Actions, CI, repo automation, devops pipeline
            - `area:app` — user-facing Pokémon SRS app, Pokédex browser, PWA

            ## Rules

            - Default priority to `priority:later` when uncertain — only pick
              `priority:now` or `priority:next` if the issue clearly demands it.
            - Output ONLY valid JSON — no explanation, no markdown fences.
            - Use null for any dimension that is already set.
            - Use null if you cannot determine the value with reasonable confidence.

            ## Output

            Write exactly this JSON to /tmp/labels.json:
            {"priority": "<label or null>", "type": "<label or null>", "area": "<label or null>"}

            Example (all three missing, priority uncertain):
            {"priority": "priority:later", "type": "enhancement", "area": "area:workflow"}

            Example (priority already set):
            {"priority": null, "type": "bug", "area": "area:app"}

      - name: Apply labels
        if: steps.check.outputs.all_covered != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HAS_PRIORITY: ${{ steps.check.outputs.has_priority }}
          HAS_TYPE: ${{ steps.check.outputs.has_type }}
          HAS_AREA: ${{ steps.check.outputs.has_area }}
        run: |
          set -euo pipefail

          LABELS_FILE=/tmp/labels.json

          if [ ! -f "$LABELS_FILE" ]; then
            echo "::warning::/tmp/labels.json not found — Claude did not produce output. Applying priority:later fallback if priority is missing."
            if [ "$HAS_PRIORITY" = "false" ]; then
              gh issue edit "$ISSUE" --repo "$REPO" --add-label "priority:later"
            fi
            exit 0
          fi

          # Validate JSON parseable
          if ! jq empty "$LABELS_FILE" 2>/dev/null; then
            echo "::warning::/tmp/labels.json is not valid JSON. Applying priority:later fallback if priority is missing."
            cat "$LABELS_FILE" || true
            if [ "$HAS_PRIORITY" = "false" ]; then
              gh issue edit "$ISSUE" --repo "$REPO" --add-label "priority:later"
            fi
            exit 0
          fi

          ALLOWED="priority:now priority:next priority:later bug enhancement area:workflow area:app"

          TO_ADD=""
          PRIORITY_ADDED=false
          for field in priority type area; do
            # Use head -1 to guard against multi-line jq output on malformed JSON values
            value=$(jq -r ".$field // empty" "$LABELS_FILE" | head -1)
            [ -z "$value" ] && continue
            [ "$value" = "null" ] && continue
            # Validate against allowlist to prevent 422 from typos
            if echo "$ALLOWED" | tr ' ' '\n' | grep -qx "$value"; then
              TO_ADD="${TO_ADD:+$TO_ADD,}$value"
              [ "$field" = "priority" ] && PRIORITY_ADDED=true
            else
              echo "::warning::Unrecognised label value '$value' for field '$field' — skipping."
            fi
          done

          # If priority was missing and no valid priority was added (including rejected unrecognised
          # values), default to priority:later rather than leaving the issue unlabelled.
          if [ "$HAS_PRIORITY" = "false" ] && [ "$PRIORITY_ADDED" = "false" ]; then
            echo "Claude did not assign a valid priority — defaulting to priority:later"
            TO_ADD="${TO_ADD:+$TO_ADD,}priority:later"
          fi

          if [ -z "$TO_ADD" ]; then
            echo "No labels to add after filtering."
            exit 0
          fi

          echo "Adding labels: $TO_ADD"
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "$TO_ADD"
