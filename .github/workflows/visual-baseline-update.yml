name: Visual Baseline Update

# Regenerates the Playwright visual baselines committed under
# e2e/__screenshots__/ for a dispatching feature branch. Use this when a PR
# legitimately changes Stats or Journey rendering and the comparison job in
# `visual-regression.yml` is failing because the committed baselines are now
# stale.
#
# Why a dedicated workflow rather than a local `--update-snapshots` run:
# baselines are platform-sensitive. macOS Core Text and Linux font
# anti-aliasing differ visibly, so baselines must be generated inside the
# pinned `mcr.microsoft.com/playwright:v1.60.0-noble` image — the same image
# `visual-regression.yml` uses for comparison. The maintainer would otherwise
# have to run that Docker image locally on a Linux host or extract actuals
# from a failed CI run; this workflow folds that into a one-click dispatch.
#
# Safety posture (these guards stack):
#   1. `workflow_dispatch` only — no PR/push trigger can fire this.
#   2. Maintainer-gated — only an approved maintainer can dispatch.
#      Implemented in the `gate` job as a check against an explicit
#      maintainer allowlist (`MAINTAINERS`), with an org-membership API
#      probe (`gh api /orgs/<org>/members/<actor>`) as a secondary signal.
#      An actor-vs-`github.repository_owner` check is NOT usable here: after
#      the move to the `Frazzled-Productions` org, `repository_owner` is the
#      org login, which no human actor can ever equal (#1558). The allowlist
#      is the load-bearing gate; the org-membership probe is best-effort and
#      depends on the token's `read:org` visibility.
#   3. Refuses to push if the input branch is `main` or `qa`. The regenerated
#      baselines must land on a feature branch only; never on a long-lived
#      branch directly. See AGENTS.md → "Branching model".
#
# The push uses a `poke-memory-bot` App installation token (the same pattern
# `auto-release.yml` uses). `GITHUB_TOKEN` cannot bypass branch protection,
# so the App token is also what gives us a sensible escape hatch if the
# dispatcher ever targets a protected feature-flow branch in future.
#
# The regenerated push uses a plain commit message (no `[skip ci]` marker).
# Earlier iterations of this workflow added `[skip ci]` to suppress
# downstream workflows from re-firing on the regen push, but that marker
# also propagates to the resulting PR — opening a PR whose HEAD commit
# subject contains `[skip ci]` causes GitHub to skip every workflow on the
# PR itself, including the required `test` / `e2e` / `Test coverage report`
# checks. See #1145 for the reproduction. The regen PR is exactly where we
# want full CI to run, so the suppression lives on the workflow side now:
# `visual-regression.yml` uses `paths-ignore: ['e2e/__screenshots__/**']`
# on its `pull_request` trigger to avoid re-firing on baseline-only diffs.
# `ci.yml` is intentionally NOT path-ignored — we want it to confirm that
# nothing else regressed on the regen PR.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to regenerate baselines on (must not be `main` or `qa`)."
        required: true
        type: string

concurrency:
  group: visual-baseline-update-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # Cheap gate: validates the dispatcher and the branch input BEFORE spinning
  # up the Playwright Docker container in the regenerate job. Failing fast
  # here keeps the audit trail tidy and avoids burning container minutes on
  # an obviously-invalid dispatch.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify dispatcher is an approved maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          # Explicit maintainer allowlist. After the personal -> org move
          # (#1558) `github.repository_owner` is the org login
          # (`Frazzled-Productions`), so an `actor == owner` check can never
          # pass for a human. Gate on this allowlist instead. Add a username
          # here to grant dispatch rights.
          MAINTAINERS: "fraserbrookhouse"
        run: |
          set -euo pipefail

          # 1. Allowlist (authoritative, token-scope-independent).
          for m in $MAINTAINERS; do
            if [ "$ACTOR" = "$m" ]; then
              echo "Dispatcher '$ACTOR' is on the maintainer allowlist. OK."
              exit 0
            fi
          done

          # 2. Org-membership probe (best-effort secondary signal). A 204/200
          # means the actor is a member of the org that now owns this repo.
          # This only succeeds when the token carries `read:org` visibility,
          # so it can short-circuit to a pass but never to the hard failure
          # below — a non-member or scope-limited token falls through to the
          # allowlist verdict already computed above.
          STATUS=$(gh api "/orgs/${OWNER}/members/${ACTOR}" \
            --silent -i 2>/dev/null | head -n1 | grep -oE '[0-9]{3}' | head -n1 || true)
          if [ "$STATUS" = "204" ] || [ "$STATUS" = "200" ]; then
            echo "Dispatcher '$ACTOR' is a member of org '$OWNER' (HTTP $STATUS). OK."
            exit 0
          fi

          echo "Refusing to run: actor '$ACTOR' is neither on the maintainer allowlist nor a verifiable member of org '$OWNER'."
          echo "Add '$ACTOR' to MAINTAINERS in this workflow if they should be able to dispatch baseline regeneration."
          exit 1

      - name: Refuse to target a long-lived branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$BRANCH" ]; then
            echo "Refusing to run: 'branch' input was empty."
            exit 1
          fi
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "qa" ]; then
            echo "Refusing to run: regenerated baselines must not land on '$BRANCH' directly."
            echo "Dispatch this workflow against a feature branch instead."
            exit 1
          fi
          echo "Target branch '$BRANCH' is acceptable. OK."

  regenerate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Playwright container image (`mcr.microsoft.com/playwright:v1.60.0-noble`)
    # ships dash as /bin/sh, which GitHub Actions picks as the default `run:`
    # shell when a step has no explicit `shell:`. Dash rejects `set -o pipefail`
    # and other bashisms used by the steps below, so pin bash for the whole job.
    # bash is present in the image at /usr/bin/bash. The `gate` job runs on the
    # bare `ubuntu-latest` runner where bash is already the default, so it does
    # not need this override.
    defaults:
      run:
        shell: bash
    permissions:
      # The regenerate job pushes regenerated baselines via the poke-memory-bot
      # App token. Declare contents: write to match the actual capability for
      # audit clarity, even though the token's scope is independent of this block.
      contents: write
    # Browsers + system deps are baked into the image. The tag MUST track the
    # `@playwright/test` version resolved in `package-lock.json` (currently
    # 1.60.0) — the same pin `visual-regression.yml` uses. Baselines
    # generated here are byte-comparable against that compare job's renders.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check out the dispatching branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configure git identity
        # `--global` is required because this job runs inside the
        # `mcr.microsoft.com/playwright:v1.60.0-noble` container, where the
        # default working directory is not `$GITHUB_WORKSPACE`. A bare
        # `git config` (which defaults to `--local`) fails with
        # `fatal: not in a git directory` because there is no `.git` in cwd.
        # `safe.directory` is also needed: the container runs as root by
        # default and `actions/checkout` chowns the workspace to the `runner`
        # user, so git's dubious-ownership check would otherwise reject the
        # later `git add` / `commit` / `push` steps.
        run: |
          git config --global user.name "poke-memory-bot[bot]"
          git config --global user.email "${{ vars.BOT_APP_ID }}+poke-memory-bot[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Next.js and regenerate visual snapshots
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm start &
          echo $! > /tmp/next.pid
          npx wait-on http://localhost:3000 --timeout 60000
          # `npm run test:visual` runs the visual-chromium and visual-webkit
          # projects against e2e/visual.spec.ts. `--update-snapshots` rewrites
          # the PNGs under e2e/__screenshots__/{visual-chromium,visual-webkit}.
          npm run test:visual -- --update-snapshots

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi

      - name: Commit and push regenerated baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # Defence in depth: re-check the branch guard here, in the same job
          # that actually pushes. The `gate` job already enforces this, but a
          # second check next to the push means a future refactor that drops
          # the gate job cannot silently start writing to a protected branch.
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "qa" ]; then
            echo "Refusing to push: regenerated baselines must not land on '$BRANCH' directly."
            exit 1
          fi
          git add e2e/__screenshots__/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit — the regenerated PNGs are identical to the committed ones."
            exit 0
          fi
          git commit -m "chore(visual): regenerate baselines"
          git push origin "HEAD:${BRANCH}"
          echo "Pushed regenerated baselines to '${BRANCH}'."

      # If the snapshot run itself failed (rather than the comparison being
      # different), the report carries the failing-test detail.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-update-report
          path: playwright-report/
          retention-days: 14
