name: Integration Tests

# Runs DB-backed integration tests (migration apply, RLS isolation, regression
# trigger) against a local Postgres service container.  No Supabase API calls,
# no branch quota, $0 cost.  See lib/sync/integration/ for the test suite.
#
# Trigger (#611): the suite runs automatically on PRs that touch the
# cloud-write surface — lib/sync/**, app/api/sync/**, db/migrations/**,
# lib/gradelog/**, or this workflow file itself.  Path filtering keeps spend
# bounded: only relevant PRs trigger a run.
#
# The `integration-tests` PR label remains an explicit opt-in escape hatch for
# changes that fall outside the path filter but still need DB-level
# verification.  Manual runs use the workflow_dispatch trigger below.
#
# `paths-ignore` on the `pull_request` trigger short-circuits the workflow
# entirely on PRs whose diff is confined to sprite assets under
# `public/sprites/**` (e.g. quality-regen batches). Those files cannot match
# the `cloud_write` filter, so the outer fence is safe to widen; it also
# prevents dorny/paths-filter from paging the GitHub Compare API over a
# ~10,000-file diff and hitting the auth edge case (#1212).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'public/sprites/**'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate job: decides whether the integration suite should run.  Runs on every
  # PR (cheap), so the decision can combine "paths OR label" — a bare
  # `on.pull_request.paths:` filter cannot, because it would also filter out
  # `labeled` events on PRs that don't touch the paths, breaking the escape
  # hatch.
  decide:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v6

      - name: Check changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud_write:
              - 'lib/sync/**'
              - 'app/api/sync/**'
              - 'db/migrations/**'
              - 'lib/gradelog/**'
              - '.github/workflows/integration-tests.yml'

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_MATCH: ${{ steps.filter.outputs.cloud_write }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'integration-tests') }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$PATHS_MATCH" = "true" ] || [ "$HAS_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: decide
    if: needs.decide.outputs.run == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: poke_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/poke_memory_test
        run: npm run test:integration
