name: Integration Tests

# Runs the D1 database suite in full: the schema and trigger tests, the scope
# helper and cross-user tests, the data gateway contract tests and the sync
# parity tests, all against node:sqlite with db/d1/migrations applied through
# the D1 test shim (lib/db/testing/sqliteD1.ts), plus the grade_log divergence
# monitor's SQL. No database service, no Cloudflare account, $0 cost. Until the
# move to Cloudflare (move-to-cloudflare, design D11) this ran the Postgres
# suite in lib/sync/integration/ against a postgres:15 service container.
#
# Why it is separate from ci.yml's `test` job, which runs the same vitest
# `node` project: on a PR `test` runs only `--changed` tests, picked by the
# import graph. A migration is SQL read from disk, not imported, so a change to
# db/d1/migrations/** would select none of the tests that apply it. This
# workflow runs the whole suite whenever the cloud-write surface changes.
#
# Trigger (#611): the suite runs automatically on PRs that touch the
# cloud-write surface (see the `cloud_write` filter below) or this workflow
# file itself. Path filtering keeps spend bounded: only relevant PRs trigger a
# run.
#
# The `integration-tests` PR label remains an explicit opt-in escape hatch for
# changes that fall outside the path filter but still need DB-level
# verification.  Manual runs use the workflow_dispatch trigger below.
# Note: `paths-ignore` is evaluated uniformly for all `types:`, including
# `labeled`.  Adding the label to a sprite-only PR will not trigger this
# workflow - use workflow_dispatch for that case instead.
#
# `paths-ignore` on the `pull_request` trigger short-circuits the workflow
# entirely on PRs whose diff is confined to sprite assets under
# `public/sprites/**` (e.g. quality-regen batches). Those files cannot match
# the `cloud_write` filter, so the outer fence is safe to widen; it also
# prevents dorny/paths-filter from paging the GitHub Compare API over a
# ~10,000-file diff and hitting the auth edge case (#1212).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'public/sprites/**'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate job: decides whether the integration suite should run.  Runs on every
  # PR (cheap), so the decision can combine "paths OR label" - a bare
  # `on.pull_request.paths:` filter cannot, because it would also filter out
  # `labeled` events on PRs that don't touch the paths, breaking the escape
  # hatch.
  decide:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Check changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud_write:
              - 'lib/sync/**'
              - 'lib/db/**'
              - 'app/api/sync/**'
              - 'app/api/db/**'
              - 'db/d1/**'
              - 'lib/gradelog/**'
              - '.github/workflows/integration-tests.yml'

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_MATCH: ${{ steps.filter.outputs.cloud_write }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'integration-tests') }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$PATHS_MATCH" = "true" ] || [ "$HAS_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: decide
    if: needs.decide.outputs.run == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - run: npm ci

      - name: Run the D1 suite
        run: npx vitest run --project node lib/db lib/sync

  # Aggregator (#1738): a thin, always-reporting job so `integration` can be a
  # required status check on the qa-staging ruleset without blocking PRs that
  # don't touch the cloud-write surface. A skipped `integration` (paths not
  # matched) resolves to a pass here; a real failure fails the gate. Modelled
  # on ci.yml's `e2e` aggregator. Keeping a stable job named `integration-gate`
  # means the required-check entry never has to change when the underlying
  # jobs are renamed.
  integration-gate:
    name: integration-gate
    needs: [decide, integration]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 2
    steps:
      - name: Evaluate integration result
        run: |
          decide="${{ needs.decide.outputs.run }}"
          result="${{ needs.integration.result }}"
          echo "decide.run=$decide  integration.result=$result"
          # `decide` did not request a run: explicit "false" (paths not matched)
          # OR empty (job skipped, e.g. dependabot PRs where the `decide` job's
          # `if:` excludes the actor and `needs.decide.outputs.run` is "").
          if [ "$decide" != "true" ]; then echo "Integration not requested (decide.run='$decide') - gate passes."; exit 0; fi
          # A skipped `integration` job also resolves to a pass, mirroring
          # ci.yml's `e2e` aggregator.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then echo "Integration passed (result: $result)."; exit 0; fi
          echo "::error::Integration tests did not pass (result: $result)."; exit 1
