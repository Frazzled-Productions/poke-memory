name: Integration Tests

# Runs DB-backed integration tests (migration apply, RLS isolation, regression
# trigger) against a local Postgres service container.  No Supabase API calls,
# no branch quota, $0 cost.  See lib/sync/integration/ for the test suite.
#
# The `integration-tests` label gate limits runs to PRs that explicitly opt in,
# keeping CI time predictable.  Issue #611 will add path-based auto-labelling
# (lib/sync/**, db/migrations/**, app/api/sync/**) as a follow-up.
#
# To run on a PR: add the `integration-tests` label to the PR.
# To run manually: use the workflow_dispatch trigger below.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # Only run when the PR has the `integration-tests` label, or on manual
    # dispatch.  This prevents unnecessary CI usage on every PR.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'integration-tests') &&
        github.actor != 'dependabot[bot]'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: poke_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/poke_memory_test
        run: npm run test:integration
