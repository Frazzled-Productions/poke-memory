name: Auto Digest Fan-out

# Fires on every issue edit. Guards using the auto-suggest HTML markers so
# only digest issues are handled. For each newly-checked proposal checkbox,
# files a child issue with the extracted priority label and a backlink, then
# writes a "→ filed as #N" marker on the heading so it cannot be double-filed.
#
# Idempotency: the "→ filed as #N" marker on the heading is the single source
# of truth. Checked-but-marked proposals are skipped unconditionally.
#
# Re-trigger: each PATCH to write back-markers triggers another issues.edited
# event. The concurrency queue serialises runs; subsequent runs see all markers
# present and exit cleanly as a no-op.

on:
  issues:
    types: [edited]

concurrency:
  group: digest-fanout-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fanout:
    name: File checked proposals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    # Note: github.event.issue.body may be truncated for very long issues,
    # causing this guard to miss the marker and silently skip (false-negative).
    # The fanout step re-fetches the full body, so truncation never causes
    # duplicates — it only means the job doesn't start for that event.
    if: |
      contains(github.event.issue.body, '<!-- auto-codequality-suggest -->') ||
      contains(github.event.issue.body, '<!-- auto-app-suggest -->')

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Fan out checked proposals
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail

          # Re-fetch current body — the event payload can be truncated on long issues.
          gh api "repos/${REPO}/issues/${ISSUE}" | jq -r '.body // ""' > /tmp/issue-body.txt

          cat > /tmp/fanout.py << 'PYEOF'
          import re, subprocess, os, sys, json

          repo      = os.environ['REPO']
          issue     = os.environ['ISSUE']
          issue_url = os.environ['ISSUE_URL']

          body = open('/tmp/issue-body.txt').read()

          # Detect digest type so child issues inherit the correct labels.
          is_app_suggest = '<!-- auto-app-suggest -->' in body

          # Ensure all labels used by child issues exist before any gh issue create
          # call. Missing labels cause gh to exit non-zero, aborting after a child
          # issue may have been created but before its back-marker is written —
          # causing a duplicate on the next edit event. All candidates go here.
          REQUIRED_LABELS = {
              'priority:now':   ('d73a4a', 'Ship-blocking or time-sensitive'),
              'priority:next':  ('e4e669', 'Important, address in the next cycle'),
              'priority:later': ('e4e4e4', 'Nice to have, no urgent timeline'),
              'area:app':       ('e4e669', 'App codebase improvements'),
              'enhancement':    ('a2eeef', 'New feature or request'),
          }
          existing_raw = subprocess.run(
              ['gh', 'label', 'list', '--repo', repo, '--json', 'name', '--limit', '250'],
              capture_output=True, text=True, check=True
          ).stdout
          existing_names = {l['name'] for l in json.loads(existing_raw)}
          for lbl, (color, desc) in REQUIRED_LABELS.items():
              if lbl not in existing_names:
                  subprocess.run(
                      ['gh', 'label', 'create', lbl,
                       '--color', color, '--description', desc, '--repo', repo],
                      check=True
                  )
                  print(f'Created label {lbl}')

          filed_count = 0
          filed_numbers = []

          # Collect headings upfront; body is mutated in-place as markers are written.
          headings = list(re.finditer(r'^(### (\d+)\. (.+?))$', body, re.MULTILINE))

          for hm in headings:
              n     = hm.group(2)   # proposal number, unique within a digest
              title = hm.group(3).strip()

              # Re-locate this heading in the current body (which may have been
              # updated by a previous iteration's PATCH). Use the number as the
              # unique anchor — heading numbers are never duplicated in a digest.
              cur_hm = re.search(rf'^### {re.escape(n)}\. .+$', body, re.MULTILINE)
              if not cur_hm:
                  continue
              current_heading = cur_hm.group(0)

              # Idempotency: skip if a back-marker was already written.
              # Anchored to end-of-line so legitimate "→" in the title is ignored.
              if re.search(r'→ filed as #\d+$', current_heading):
                  continue

              # Extract the proposal block (until the next ### heading or end).
              block_start = cur_hm.end()
              next_hm     = re.search(r'^###', body[block_start:], re.MULTILINE)
              block_end   = block_start + next_hm.start() if next_hm else len(body)
              block       = body[block_start:block_end]

              # Only proceed if the checkbox for this proposal is ticked.
              if not re.search(rf'-\s*\[x\][^\n]*<!--\s*proposal:{n}\s*-->', block, re.IGNORECASE):
                  continue

              # Extract priority; fall back to priority:later if malformed.
              pm       = re.search(r'\*\*Priority:\*\*\s*`(priority:[^`]+)`', block)
              priority = pm.group(1) if pm else 'priority:later'

              # Build child issue body: strip the checkbox line, add backlink.
              clean_block = re.sub(rf'\s*-\s*\[.\][^\n]*<!--\s*proposal:{n}\s*-->[^\n]*\n?', '\n', block)
              child_body  = f'> Filed from [digest #{issue}]({issue_url}) proposal {n}.\n\n{clean_block.strip()}'

              open('/tmp/child-body.txt', 'w').write(child_body)

              labels = ['--label', priority, '--label', 'area:app']
              if is_app_suggest:
                  labels += ['--label', 'enhancement']

              # `gh issue create` does not support --json; it prints the new
              # issue URL on stdout. Parse the trailing number out of that.
              r = subprocess.run(
                  ['gh', 'issue', 'create',
                   '--title', title,
                   '--body-file', '/tmp/child-body.txt',
                   '--repo', repo] + labels,
                  capture_output=True, text=True, check=True
              )
              new_number = r.stdout.strip().rsplit('/', 1)[-1]
              print(f'Filed proposal {n} as #{new_number}: {title}')
              filed_count += 1
              filed_numbers.append(new_number)

              # Write back-marker immediately — one PATCH per filed issue so a
              # later network failure cannot prevent already-filed markers from
              # persisting. Use re.sub anchored to the line so proposals with
              # identical titles don't corrupt each other's markers.
              body = re.sub(
                  rf'^### {re.escape(n)}\. {re.escape(title)}$',
                  f'### {n}. {title} → filed as #{new_number}',
                  body, count=1, flags=re.MULTILINE
              )
              open('/tmp/patch-body.json', 'w').write(json.dumps({'body': body}))
              subprocess.run(
                  ['gh', 'api', '-X', 'PATCH', f'repos/{repo}/issues/{issue}',
                   '--input', '/tmp/patch-body.json'],
                  check=True
              )

          if filed_count == 0:
              print('No newly-checked proposals — no-op.')
              sys.exit(0)

          # Post a summary comment on the parent.
          refs = ', '.join(f'#{n}' for n in filed_numbers)
          subprocess.run(
              ['gh', 'issue', 'comment', issue, '--repo', repo,
               '--body', f'Filed {filed_count} proposal(s) as issue(s): {refs}'],
              check=True
          )
          PYEOF

          python3 /tmp/fanout.py
