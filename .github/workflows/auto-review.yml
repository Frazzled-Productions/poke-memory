name: Auto Review

# Triggered when a PR opens, reopens, or has the `auto-review` label added.
# Runs the `code-reviewer` sub-agent against the PR diff and posts an
# `<!-- auto-review:N -->` comment (N computed from existing review markers
# on the PR) so the existing `/fix` loop in auto-pr.yml works unchanged.
#
# Gate: PRs whose head branch starts with `auto/` (bot-opened PRs) OR which
# carry an `auto-review` label (manually-opened opt-in). Drafts are skipped
# so a draft opt-in doesn't burn a 30-minute Claude run before the PR is
# ready for review. Fork PRs are explicitly excluded (head.repo.fork == false)
# — this is a deliberate guard, not a side-effect of GitHub's default
# secret-isolation policy. The condition uses == false rather than != true:
# a null fork value yields (null == false) → false, keeping the guard closed;
# != true would yield (null != true) → true, bypassing it.
# For `labeled` events only the newly-added `auto-review` label fires a run,
# so unrelated labels are ignored.
#
# Idempotency: the body of the auto-review comment includes a hidden
# `<!-- auto-review-sha:<head-sha> -->` line on row 2. Re-triggers at the
# same head SHA (e.g. close + reopen, or removing and re-adding the label)
# are skipped.

on:
  pull_request:
    types: [opened, reopened, labeled]

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      (
        (github.event.action != 'labeled' &&
          (startsWith(github.head_ref, 'auto/') ||
           contains(github.event.pull_request.labels.*.name, 'auto-review')))
        ||
        (github.event.action == 'labeled' && github.event.label.name == 'auto-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action@v1 requires OIDC.
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Idempotency — skip if already reviewed at this SHA
        id: idem
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # SHA is a hex commit id — safe to interpolate directly. `gh api
          # --jq` takes a single expression, not raw jq's `--arg` style.
          MATCH=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))] | length")
          if [ "$MATCH" -gt 0 ]; then
            echo "Already reviewed at SHA $SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.idem.outputs.skip == 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        if: steps.idem.outputs.skip == 'false'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.idem.outputs.skip == 'false'
        run: npm ci

      - name: Count existing auto-review cycles
        id: cycles
        if: steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          COUNT=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next=$((COUNT + 1))" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT existing auto-review comment(s); next would be #$((COUNT + 1))."

      - uses: anthropics/claude-code-action@v1
        if: steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30 --disable-slash-commands --disallowed-tools Skill
          # The PR may have been opened by the bot identity (auto-issue.yml)
          # or by a human; allow the bot to trigger this job either way.
          # `claude` is the App backing claude-code-action@v1 — implement-job
          # PRs are attributed to that identity even though `gh pr create`
          # runs with the poke-memory-bot token, so it must be allow-listed
          # here or the action exits before any review work happens.
          allowed_bots: poke-memory-bot,claude
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            Read AGENTS.md (loaded via CLAUDE.md) for project conventions.

            Workflow:
            1. Read the PR diff:
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            2. Invoke the `code-reviewer` sub-agent (Agent tool, subagent_type
               "code-reviewer") against that diff.
            3. Post the findings on the PR via
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <path>`,
               formatted exactly like this (no other content before the marker):

                   <!-- auto-review:${{ steps.cycles.outputs.next }} -->
                   <!-- auto-review-sha:${{ github.event.pull_request.head.sha }} -->
                   ## Auto-review ${{ steps.cycles.outputs.next }}

                   <bulleted findings list — one bullet per issue; or the single line "No significant issues." (not a bullet) when there are none>

                   Verdict: Looks good to me — @fraserbrookhouse

                   _Reply with `/fix` to have these findings addressed._

               The first line MUST be the HTML marker
               `<!-- auto-review:${{ steps.cycles.outputs.next }} -->` exactly.
               The second line MUST be the SHA marker
               `<!-- auto-review-sha:${{ github.event.pull_request.head.sha }} -->`
               so re-triggers at the same head SHA are skipped.

               Findings format: post the sub-agent's punch list verbatim as a
               single flat bulleted list. Every bullet MUST begin with a bold
               severity tag, an em dash, a bold file:line anchor, another em
               dash, then a one-sentence description and (where applicable)
               the *why*. For example, a Concern bullet should read:
               "**Concern** — **app/api/srs/optimize/route.ts:179** — 429
               response omits the standard Retry-After header. Why: needed
               for CDNs and generic clients to back off correctly." The four
               severities are **Blocker**, **Concern**, **Nit**, and
               **Praise** — sort the list by severity in that order. Do NOT
               group findings under headings, and do NOT strip the severity
               prefixes when composing the comment. If the sub-agent returns
               "No significant issues.", post that single line in place of
               the bulleted list.

               A verdict line starting with `Verdict: ` MUST be present, with
               either `Looks good to me — @fraserbrookhouse` (no significant
               issues, or only Praise / Nit bullets) or `Needs fixes` (one or
               more Blocker or Concern bullets). Use those whole-word phrases
               verbatim — no acronyms. When (and only when) the verdict is
               `Needs fixes`, append the italicised footer line shown above so
               the maintainer knows how to trigger a fix run. Omit the footer
               when the verdict is `Looks good to me — @fraserbrookhouse`.

               When referencing a prior review in your prose (only relevant when
               this is not the first review): find the comment object in the PR
               comments JSON whose `.body` starts with the immediately prior
               review's marker (`<!-- auto-review:COUNT -->` where COUNT = next - 1).
               Use its `.url` field to write a markdown link — e.g.
               `[review COUNT](url)` — wherever you would otherwise write bare
               text like "review #N" or "#N". Do not write any bare `#N` token
               that GitHub would auto-link to an unrelated issue or PR.
               (Note: this wording differs from auto-pr.yml intentionally —
               the review agent identifies the prior review by marker because it
               builds its own context from scratch; the fix agent uses the
               already-loaded step-1 comments JSON instead.)

      - name: Move issue to PR / Ready to merge based on review verdict
        if: always() && steps.idem.outputs.skip == 'false'
        env:
          # Issue/PR queries use the repo-scoped App token; the script call
          # below overrides to the org-scoped token because the project lives
          # in Frazzled-Productions.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE=""
          if [[ "$BRANCH" =~ ^auto/issue-([0-9]+)- ]]; then
            ISSUE="${BASH_REMATCH[1]}"
          else
            ISSUE=$(gh pr view "${{ github.event.pull_request.number }}" --json body \
              --jq '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [[ -z "$ISSUE" ]]; then
            echo "No linked issue — skipping project status update."
            exit 0
          fi
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          VERDICT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))]
                  | sort_by(.created_at) | last | .body // ""' \
            | grep -E '^Verdict:' | head -1 || true)
          if [[ "$VERDICT" == *"Looks good to me"* ]]; then
            STATUS="Ready to merge"
          else
            STATUS="PR"
          fi
          GH_TOKEN="${{ steps.org-app-token.outputs.token }}" \
          GH_TOKEN_REPO="${{ steps.app-token.outputs.token }}" \
            .github/scripts/set-project-status.sh "$ISSUE" "$STATUS"

      - name: Post auto-fix comment on Needs fixes
        if: always() && steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          COUNT=${{ steps.cycles.outputs.count || '0' }}
          NEXT=${{ steps.cycles.outputs.next || '1' }}
          BODY=""
          for attempt in 1 2 3; do
            BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))]
                    | sort_by(.created_at) | last | .body // \"\"")
            [[ -n "$BODY" ]] && break
            echo "Attempt $attempt: review comment not yet visible, waiting 2s..."
            sleep 2
          done
          [[ -n "$BODY" ]] || echo "WARNING: review comment not found after 3 retries — autofix will be skipped."
          VERDICT=$(printf '%s\n' "$BODY" | grep -E '^Verdict:' | head -1 || true)
          MARKER="<!-- auto-review-autofix:$NEXT -->"
          if [[ "$VERDICT" == *"Needs fixes"* ]] && [[ "$COUNT" -lt 2 ]]; then
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"$MARKER\"))] | length")
            if [[ "$EXISTING" -gt 0 ]]; then
              echo "Autofix comment for review $NEXT already exists — skipping (idempotent re-run)."
            else
              echo "Verdict is 'Needs fixes' and cycle count ($COUNT) < 2 — posting auto /fix comment."
              printf '%s\n/fix\n' "$MARKER" > /tmp/autofix-body.md
              gh pr comment "$PR" --body-file /tmp/autofix-body.md
            fi
          else
            echo "No auto-fix needed (verdict: '${VERDICT:-<none>}', count: $COUNT)."
          fi

      - name: Fail check when verdict is "Needs fixes"
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          # Scope to the current head SHA so re-runs (close/reopen at the same
          # SHA, or a later /fix cycle that bumps the SHA) always report the
          # verdict that was posted against the SHA this run is on.
          BODY=""
          for attempt in 1 2 3; do
            BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))]
                    | sort_by(.created_at) | last | .body // \"\"")
            [[ -n "$BODY" ]] && break
            echo "Attempt $attempt: review comment not yet visible, waiting 2s..."
            sleep 2
          done
          if [[ -z "$BODY" ]]; then
            echo "No auto-review comment found for SHA $SHA — nothing to gate on."
            exit 0
          fi
          VERDICT=$(printf '%s\n' "$BODY" | grep -E '^Verdict:' | head -1 || true)
          echo "Latest verdict at SHA $SHA: ${VERDICT:-<none>}"
          if [[ "$VERDICT" == *"Needs fixes"* ]]; then
            echo "::error::Auto-review verdict is 'Needs fixes' — failing the check so the PR shows red until /fix lands."
            exit 1
          fi
