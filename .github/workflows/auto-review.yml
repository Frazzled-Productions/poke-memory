name: Auto Review

# Fires by default on every PR against `main` and runs the `code-reviewer`
# sub-agent against the diff, posting an `<!-- auto-review:N -->` comment
# (N computed from existing review markers on the PR) so the existing `/fix`
# loop in auto-pr.yml works unchanged.
#
# Gate (skip-list, inverted from the earlier allow-list — see #469):
#   - Drafts are skipped so a draft PR doesn't burn a 30-minute Claude run
#     before it's ready for review.
#   - Fork PRs are excluded (head.repo.fork == false). This is a deliberate
#     guard, not a side-effect of GitHub's default secret-isolation policy.
#     The condition uses == false rather than != true: a null fork value
#     yields (null == false) → false, keeping the guard closed; != true
#     would yield (null != true) → true, bypassing it.
#   - PRs with `[skip ci]` in the title or body are skipped (matches the
#     repo-wide convention used by auto-release commits).
#   - PRs whose title starts with `chore(release):` are skipped — these are
#     the auto-release workflow's own commits and never want a review.
#   - Dependabot PRs are skipped (`github.actor == 'dependabot[bot]'`).
#   - PRs targeting non-`main` branches are skipped — out of scope.
#
# The previous allow-list gated on head-branch prefix `auto/` or an
# `auto-review` label. Both are dropped: the inverted gate makes the label
# unnecessary, and the branch prefix only matched bot-opened PRs in
# practice (real human branches were `worktree-*`, `phase*/*`, etc., and
# the gate was silently skipping them).
#
# Idempotency: the body of the auto-review comment includes a hidden
# `<!-- auto-review-sha:<head-sha> -->` line on row 2. Re-triggers at the
# same head SHA (e.g. close + reopen) are skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # The final `head.ref != 'qa'` clause skips `qa -> main` promotion PRs:
    # the bundled changes were already reviewed per-PR during the /batch-issues
    # drain, and a "Needs fixes" verdict here would post `/fix`, committing
    # onto the `qa` integration branch itself (#806).
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.fork == false
      && github.event.pull_request.base.ref == 'main'
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.event.pull_request.title, 'chore(release):')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.body, '[skip ci]')
      && github.event.pull_request.head.ref != 'qa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action@v1 requires OIDC.
      id-token: write
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Mint org-scoped App token (for project mutations)
        id: org-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: Frazzled-Productions

      - name: Idempotency — skip if already reviewed at this SHA
        id: idem
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # SHA is a hex commit id — safe to interpolate directly. `gh api
          # --jq` takes a single expression, not raw jq's `--arg` style.
          MATCH=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))] | length")
          if [ "$MATCH" -gt 0 ]; then
            echo "Already reviewed at SHA $SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.idem.outputs.skip == 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        if: steps.idem.outputs.skip == 'false'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.idem.outputs.skip == 'false'
        run: npm ci

      - name: Count existing auto-review cycles
        id: cycles
        if: steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          COUNT=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next=$((COUNT + 1))" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT existing auto-review comment(s); next would be #$((COUNT + 1))."

      - uses: anthropics/claude-code-action@v1
        if: steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30 --disable-slash-commands --disallowed-tools Skill
          # The PR may have been opened by the bot identity (auto-issue.yml)
          # or by a human; allow the bot to trigger this job either way.
          # `claude` is the App backing claude-code-action@v1 — implement-job
          # PRs are attributed to that identity even though `gh pr create`
          # runs with the poke-memory-bot token, so it must be allow-listed
          # here or the action exits before any review work happens.
          allowed_bots: poke-memory-bot,claude
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            Read AGENTS.md (loaded via CLAUDE.md) for project conventions.

            Workflow:
            1. Read the PR diff:
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            2. Invoke the `code-reviewer` sub-agent (Agent tool, subagent_type
               "code-reviewer") against that diff.

               **Cycle-aware briefing.** This is review
               ${{ steps.cycles.outputs.next }}; there are
               ${{ steps.cycles.outputs.count }} prior auto-review comment(s).
               - If there are **no** prior reviews, this is the first review —
                 brief the sub-agent to review the full diff normally.
               - If there is **at least one** prior review, this is a
                 **follow-up review of a `/fix` push**. Load the most recent
                 `<!-- auto-review:N -->` comment and brief the sub-agent that
                 its job is to (a) confirm each prior Blocker/Concern is
                 resolved, and (b) flag only *genuine new regressions the fix
                 commit introduced*. It must NOT re-scan untouched code for
                 fresh nitpicks, NOT escalate the severity of an item that was
                 a Nit last cycle, and NOT raise net-new Concerns about code
                 the prior review already saw and accepted. The bar must not
                 drift between cycles: a finding acceptable in cycle 1 is still
                 acceptable in cycle 2. If every prior Blocker/Concern is
                 resolved and the fix introduced no new ones, the verdict is
                 `Looks good to me` even if minor Nits remain — converging is
                 the goal, not finding something new every pass.
            3. Post the findings on the PR via
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <path>`,
               formatted exactly like this (no other content before the marker):

                   <!-- auto-review:${{ steps.cycles.outputs.next }} -->
                   <!-- auto-review-sha:${{ github.event.pull_request.head.sha }} -->
                   ## Auto-review ${{ steps.cycles.outputs.next }}

                   <bulleted findings list — one bullet per issue; or the single line "No significant issues." (not a bullet) when there are none>

                   Verdict: [Looks good to me — @fraserbrookhouse | Needs fixes]

                   _Reply with `/fix` to have these findings addressed._

               The first line MUST be the HTML marker
               `<!-- auto-review:${{ steps.cycles.outputs.next }} -->` exactly.
               The second line MUST be the SHA marker
               `<!-- auto-review-sha:${{ github.event.pull_request.head.sha }} -->`
               so re-triggers at the same head SHA are skipped.

               Findings format: post the sub-agent's punch list as a
               single flat bulleted list. Every bullet MUST begin with a bold
               severity tag, an em dash, a bold file:line anchor, another em
               dash, then a one-sentence description and (where applicable)
               the *why*. For example, a Concern bullet should read:
               "**Concern** — **app/api/srs/optimize/route.ts:179** — 429
               response omits the standard Retry-After header. Why: needed
               for CDNs and generic clients to back off correctly." The four
               severities are **Blocker**, **Concern**, **Nit**, and
               **Praise** — sort the list by severity in that order.
               Calibrate them strictly:
               - **Blocker** — the change is broken, unsafe, or breaks a hard
                 project rule (data loss, security hole, build/type failure,
                 a violated documented invariant).
               - **Concern** — a real correctness, security, or convention
                 problem *in the code this PR changed* that should be fixed
                 before merge. NOT for hypothetical futures ("fragile if a
                 later refactor adds…"), NOT for pre-existing issues the PR
                 did not touch, NOT for subjective style preferences.
               - **Nit** — style, naming, comment wording, minor consistency,
                 "could be tidier", and anything hypothetical or pre-existing.
                 When torn between Concern and Nit, choose Nit.
               - **Praise** — genuinely good decisions worth calling out.
               A `Needs fixes` verdict requires at least one Blocker or
               Concern, so mis-tagging a Nit as a Concern needlessly burns a
               whole fix cycle — tag conservatively.
               Do NOT group findings under headings, and do NOT strip the
               severity prefixes when composing the comment. If the sub-agent
               returns "No significant issues.", post that single line in
               place of the bulleted list.

               A verdict line starting with `Verdict: ` MUST be present, with
               either `Looks good to me — @fraserbrookhouse` (no significant
               issues, or only Praise / Nit bullets) or `Needs fixes` (one or
               more Blocker or Concern bullets). Use those whole-word phrases
               verbatim — no acronyms. When (and only when) the verdict is
               `Needs fixes`, append the italicised footer line shown above so
               the maintainer knows how to trigger a fix run. Omit the footer
               when the verdict is `Looks good to me — @fraserbrookhouse`.

               When referencing a prior review in your prose (only relevant when
               this is not the first review): find the comment object in the PR
               comments JSON whose `.body` starts with the immediately prior
               review's marker (`<!-- auto-review:COUNT -->` where COUNT = next - 1).
               Use its `.url` field to write a markdown link — e.g.
               `[review COUNT](url)` — wherever you would otherwise write bare
               text like "review #N" or "#N". Do not write any bare `#N` token
               that GitHub would auto-link to an unrelated issue or PR.
               (Note: this wording differs from auto-pr.yml intentionally —
               the review agent identifies the prior review by marker because it
               builds its own context from scratch; the fix agent uses the
               already-loaded step-1 comments JSON instead.)

      - name: Move issue to PR / Ready to merge based on review verdict
        if: always() && steps.idem.outputs.skip == 'false'
        env:
          # Issue/PR queries use the repo-scoped App token; the script call
          # below overrides to the org-scoped token because the project lives
          # in Frazzled-Productions.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE=""
          if [[ "$BRANCH" =~ ^auto/issue-([0-9]+)- ]]; then
            ISSUE="${BASH_REMATCH[1]}"
          else
            ISSUE=$(gh pr view "${{ github.event.pull_request.number }}" --json body \
              --jq '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [[ -z "$ISSUE" ]]; then
            echo "No linked issue — skipping project status update."
            exit 0
          fi
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue #$ISSUE is $STATE — auto-status owns Done; skipping."
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          VERDICT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- auto-review:"))]
                  | sort_by(.created_at) | last | .body // ""' \
            | grep -E '^Verdict:' | head -1 || true)
          if [[ "$VERDICT" == *"Looks good to me"* ]]; then
            STATUS="Ready to merge"
          else
            STATUS="PR"
          fi
          GH_TOKEN="${{ steps.org-app-token.outputs.token }}" \
          GH_TOKEN_REPO="${{ steps.app-token.outputs.token }}" \
            .github/scripts/set-project-status.sh "$ISSUE" "$STATUS"

      - name: Post auto-fix comment on Needs fixes
        if: always() && steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          COUNT=${{ steps.cycles.outputs.count || '0' }}
          NEXT=${{ steps.cycles.outputs.next || '1' }}
          BODY=""
          for attempt in 1 2 3; do
            BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))]
                    | sort_by(.created_at) | last | .body // \"\"")
            [[ -n "$BODY" ]] && break
            echo "Attempt $attempt: review comment not yet visible, waiting 2s..."
            sleep 2
          done
          [[ -n "$BODY" ]] || echo "WARNING: review comment not found after 3 retries — autofix will be skipped."
          VERDICT=$(printf '%s\n' "$BODY" | grep -E '^Verdict:' | head -1 || true)
          MARKER="<!-- auto-review-autofix:$NEXT -->"
          if [[ "$VERDICT" == *"Needs fixes"* ]] && [[ "$COUNT" -lt 2 ]]; then
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"$MARKER\"))] | length")
            if [[ "$EXISTING" -gt 0 ]]; then
              echo "Autofix comment for review $NEXT already exists — skipping (idempotent re-run)."
            else
              echo "Verdict is 'Needs fixes' and cycle count ($COUNT) < 2 — posting auto /fix comment."
              printf '%s\n/fix\n' "$MARKER" > /tmp/autofix-body.md
              gh pr comment "$PR" --body-file /tmp/autofix-body.md
            fi
          else
            echo "No auto-fix needed (verdict: '${VERDICT:-<none>}', count: $COUNT)."
          fi

      - name: Fail check when verdict is "Needs fixes"
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          # Scope to the current head SHA so re-runs (close/reopen at the same
          # SHA, or a later /fix cycle that bumps the SHA) always report the
          # verdict that was posted against the SHA this run is on.
          BODY=""
          for attempt in 1 2 3; do
            BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\"))]
                    | sort_by(.created_at) | last | .body // \"\"")
            [[ -n "$BODY" ]] && break
            echo "Attempt $attempt: review comment not yet visible, waiting 2s..."
            sleep 2
          done
          if [[ -z "$BODY" ]]; then
            echo "No auto-review comment found for SHA $SHA — nothing to gate on."
            exit 0
          fi
          VERDICT=$(printf '%s\n' "$BODY" | grep -E '^Verdict:' | head -1 || true)
          echo "Latest verdict at SHA $SHA: ${VERDICT:-<none>}"
          if [[ "$VERDICT" == *"Needs fixes"* ]]; then
            echo "::error::Auto-review verdict is 'Needs fixes' — failing the check so the PR shows red until /fix lands."
            exit 1
          fi

      - name: Detect divergent verdicts (double-post guard)
        # Surfaces the failure mode from #516: the review sub-agent occasionally
        # posts a second `<!-- auto-review:N -->` comment for the same cycle
        # that drops the `<!-- auto-review-sha:SHA -->` marker. The verdict
        # gate above only sees the SHA-tagged comment, so a contradictory
        # marker-less comment can be silently visible to a human reader. Fail
        # the check with the orphan URLs so the inconsistency is forced into
        # the open instead of shipping conflicting reviews.
        #
        # `always()` keeps this step active even when "Fail check" (above) exits 1 —
        # exactly the scenario being detected. When `cycles` is skipped or fails,
        # NEXT falls back to '0', which matches no real review comment, so the
        # step exits 0 cleanly via the TOTAL == 0 path.
        if: always() && steps.idem.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          NEXT="${{ steps.cycles.outputs.next || '0' }}"
          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            | jq -s --arg pat "<!-- auto-review:${NEXT} -->" '[.[][] | select(.body | contains($pat))]')
          TOTAL=$(printf '%s' "$COMMENTS" | jq 'length')
          if [[ "$TOTAL" -le 1 ]]; then
            echo "Cycle $NEXT has $TOTAL comment(s) — no double-post."
            exit 0
          fi
          ORPHANS=$(printf '%s' "$COMMENTS" \
            | jq -r ".[] | select(.body | contains(\"<!-- auto-review-sha:$SHA -->\") | not) | .html_url")
          if [[ -z "$ORPHANS" ]]; then
            echo "Cycle $NEXT has $TOTAL comments but all carry the SHA marker — accepting."
            exit 0
          fi
          echo "::error::Auto-review cycle $NEXT posted $TOTAL comments; one or more are missing the <!-- auto-review-sha:$SHA --> marker."
          echo "::error::Divergent verdicts may be visible to a human reviewer. Reconcile before merging."
          while IFS= read -r url; do
            [[ -n "$url" ]] && echo "::error::  orphan: $url"
          done <<< "$ORPHANS"
          exit 1
