name: Coverage

# Test-coverage gate (#762, gated in #824). Runs `npm run test:coverage` on
# every PR and posts the v8 coverage summary as an idempotent PR comment.
#
# Two gates fail the job (#824):
#   1. Global floor — `coverage.thresholds` in vitest.config.ts. `vitest run
#      --coverage` exits non-zero if overall coverage regresses below the floor.
#   2. Diff coverage — scripts/diff-coverage.mjs requires new/changed product
#      lines in the PR to hit a 90% patch-coverage bar.
#
# The PR comment is posted on BOTH pass and fail so the numbers are always
# visible. Make `coverage` a required check on the qa and main rulesets to
# enforce the gate at merge time (owner action — not done by this workflow).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip fork PRs: pull_request from a fork runs with a read-only token, so
    # the comment step would fail. Same guard pattern as auto-review.yml.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Need the PR base commit so `git diff` can compute changed lines for
          # the diff-coverage gate. fetch-depth: 0 fetches full history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # `vitest run --coverage` now enforces the global floor in
      # vitest.config.ts (`coverage.thresholds`) — it exits non-zero if overall
      # coverage regresses. `continue-on-error` is deliberately NOT set: a
      # breach must fail the job. `id` + the later `if: always()` steps ensure
      # the PR comment still posts when this step fails.
      - name: Run coverage
        id: coverage
        run: npm run test:coverage

      # Diff-coverage gate: changed product lines must hit the patch bar.
      # Runs even if the global floor failed (always()) so both gates report.
      - name: Diff coverage gate
        id: diffcov
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF_COVERAGE_OUT: /tmp/diff-coverage.md
        run: |
          set -euo pipefail
          if [ ! -f coverage/coverage-final.json ]; then
            echo "coverage/coverage-final.json missing — coverage run failed before producing it."
            printf '%s\n' \
              '### Diff coverage' \
              '' \
              'Coverage run did not produce `coverage/coverage-final.json`. Check the workflow logs.' \
              > /tmp/diff-coverage.md
            exit 1
          fi
          git diff "$BASE_SHA...$HEAD_SHA" | node scripts/diff-coverage.mjs

      # Build the comment body from coverage/coverage-summary.json (the
      # `json-summary` reporter) and the diff-coverage fragment. Runs on both
      # pass and fail so the numbers are always posted.
      - name: Build coverage summary
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          echo "BODY_FILE=$BODY_FILE" >> "$GITHUB_ENV"
          SUMMARY="coverage/coverage-summary.json"

          # Idempotent marker: re-runs find and update this comment instead of
          # posting a new one. Same pattern as pr-check-monitor.yml.
          MARKER="<!-- coverage-report -->"

          if [ -f "$SUMMARY" ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              // Single source of truth for the floor — see coverage-floor.json.
              // Avoid hardcoding numbers here: drift between this comment and
              // vitest.config.ts is the failure mode #1333 exists to prevent.
              const floor = require("./coverage-floor.json");
              const row = (label, m) =>
                `| ${label} | ${m.pct.toFixed(2)}% | ${m.covered} / ${m.total} |`;
              console.log([
                "### Test coverage",
                "",
                "| Metric | Coverage | Covered / Total |",
                "|---|---|---|",
                row("Statements", t.statements),
                row("Branches", t.branches),
                row("Functions", t.functions),
                row("Lines", t.lines),
                "",
                `_Global floor: Statements ${floor.statements} / Branches ${floor.branches} / Functions ${floor.functions} / Lines ${floor.lines}. ` +
                  "Changed lines must hit a 90% patch-coverage bar. See the `coverage` workflow._",
                "_Floor values come from `coverage-floor.json` at the repo root, the single source consumed by `vitest.config.ts` and this comment. AGENTS.md and WORKFLOW.md reference the file by name rather than copying the numbers, so a ratchet only needs to touch the JSON. (#1333.)_",
              ].join("\n"));
            ' > /tmp/coverage-table.md
          else
            # printf, not a heredoc: a quoted-delimiter heredoc inside an
            # indented YAML `run:` block keeps the leading indentation as
            # literal text, which would corrupt the Markdown.
            printf '%s\n' \
              '### Test coverage' \
              '' \
              'Coverage run did not produce `coverage/coverage-summary.json` - the test step may have failed. Check the workflow logs.' \
              > /tmp/coverage-table.md
          fi

          {
            echo "$MARKER"
            cat /tmp/coverage-table.md
            if [ -f /tmp/diff-coverage.md ]; then
              echo ""
              cat /tmp/diff-coverage.md
            fi
          } > "$BODY_FILE"

      - name: Post or update coverage comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- coverage-report -->"

          # Find an existing coverage comment by its hidden marker.
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1 || echo "")

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing coverage comment #$COMMENT_ID"
            # Build a JSON payload with jq so the body is encoded safely
            # (Markdown table pipes, newlines). `gh api -F body=@file` would
            # send multipart form data, which the REST API does not accept.
            jq -Rs '{body: .}' "$BODY_FILE" \
              | gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
                  --input - >/dev/null
          else
            echo "Posting new coverage comment"
            gh pr comment "$PR" --repo "$REPO" --body-file "$BODY_FILE"
          fi
