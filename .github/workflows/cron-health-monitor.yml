name: Cron Health Monitor

# Watch the repo's cron-driven workflows for staleness or failure. GitHub
# disables scheduled workflows after 60 days of repo inactivity, and a
# malformed cron or an expired secret can also silently stop a workflow
# firing — none of which produces an alert on its own. This workflow runs
# on its own schedule (independent of the workflows it watches) and, for
# each monitored workflow, checks that (a) there has been at least one run
# within the expected interval and (b) the most recent run did not fail.
# On a stale or failing workflow it opens or updates a tracking issue.
#
# Two refinements (#971) keep the monitor from raising healthy or
# newly-added workflows:
#   1. A workflow whose file was committed more recently than the most
#      recent expected cron tick cannot have run on schedule yet, so the
#      "no scheduled run found" alert is suppressed for it.
#   2. Run-conclusion health is judged from the most recent run across ALL
#      triggers (schedule + workflow_dispatch), so a green manual dispatch
#      after a fix marks the workflow healthy even if the last *scheduled*
#      run predates the fix.

on:
  schedule:
    - cron: '0 10 * * 1'   # Monday 10:00 UTC, weekly
  workflow_dispatch:

concurrency:
  group: cron-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check cron-driven workflows for staleness/failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      # Full history is required so `git log --diff-filter=A` can find the
      # commit that first added each workflow file (Fix 1, #971). The
      # default shallow checkout would not contain that commit.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check cron workflows and open/update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Monitored workflows: "<file>|<human name>|<max-age-hours>".
          # max-age-hours is the longest acceptable gap between runs — the
          # cron cadence plus generous headroom for GitHub's cron jitter
          # (which can run hours late under load) and dispatch skew.
          # Daily workflows: 48h. Weekly digests: 240h (10 days).
          # Monthly workflows: 840h (35 days) — a full month plus headroom.
          WORKFLOWS=(
            "auto-release.yml|Auto Release|48"
            "refresh-user-count.yml|Refresh User Count|48"
            "monitor-grade-log-divergence.yml|Monitor Grade-Log Divergence|48"
            "auto-workflow-suggest.yml|Auto Workflow Suggest|240"
            "auto-codequality-suggest.yml|Auto Code-Quality Suggest|240"
            "auto-app-suggest.yml|Auto App Suggest|240"
            "auto-backlog-groom.yml|Auto Backlog Groom|240"
            "auto-retro-harvest.yml|Auto Retro Harvest|240"
            "auto-deep-audit.yml|Auto Deep Audit|840"
            "pokeapi-species-monitor.yml|PokéAPI Species Monitor|840"
          )

          NOW=$(date -u +%s)

          for entry in "${WORKFLOWS[@]}"; do
            FILE="${entry%%|*}"
            REST="${entry#*|}"
            NAME="${REST%%|*}"
            MAX_AGE_HOURS="${REST##*|}"
            MAX_AGE=$(( MAX_AGE_HOURS * 3600 ))

            echo "::group::$FILE"

            # --- Fetch run history ---------------------------------------
            # Two queries are needed:
            #  * RUN_ANY  — the latest run across ALL triggers (schedule +
            #    workflow_dispatch). Its conclusion is what we judge run
            #    health on (Fix 2, #971): a green dispatch run after a fix
            #    should clear the alert even though the last *scheduled*
            #    run predates the fix.
            #  * RUN_SCHED — the latest *schedule*-triggered run only. Its
            #    age is what the staleness check uses, because only a
            #    scheduled run proves the cron itself is still firing; a
            #    manual dispatch says nothing about the schedule.
            # Capture the exit status separately so a real API failure
            # (network blip, rate limit, GitHub outage) is not confused
            # with a genuine empty result. On an API error we skip this
            # workflow rather than treat the error as evidence of
            # staleness — otherwise a transient outage would spam a
            # tracking issue for every monitored workflow at once.
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

            RUN_EXIT=0
            RUN_ANY=$(gh run list \
              --repo "$REPO" \
              --workflow "$FILE" \
              --branch "$DEFAULT_BRANCH" \
              --limit 1 \
              --json status,conclusion,createdAt,databaseId,event) || RUN_EXIT=$?

            if [ "$RUN_EXIT" -ne 0 ]; then
              echo "::warning::$FILE: 'gh run list' (all events) failed (exit $RUN_EXIT) — likely a transient GitHub API error. Skipping this workflow; will recheck on the next run."
              echo "::endgroup::"
              continue
            fi

            RUN_EXIT=0
            RUN_SCHED=$(gh run list \
              --repo "$REPO" \
              --workflow "$FILE" \
              --event schedule \
              --branch "$DEFAULT_BRANCH" \
              --limit 1 \
              --json status,conclusion,createdAt,databaseId) || RUN_EXIT=$?

            if [ "$RUN_EXIT" -ne 0 ]; then
              echo "::warning::$FILE: 'gh run list' (schedule) failed (exit $RUN_EXIT) — likely a transient GitHub API error. Skipping this workflow; will recheck on the next run."
              echo "::endgroup::"
              continue
            fi

            PROBLEM=""

            # --- Fix 1: suppress "no scheduled run" for too-new files -----
            # The most recent expected cron tick is at most MAX_AGE_HOURS
            # ago (MAX_AGE_HOURS is the cron cadence plus headroom). If the
            # workflow file was first committed more recently than that, it
            # cannot have completed a scheduled run yet, so the absence of
            # one is expected rather than a fault. FILE_ADDED is the ISO
            # date of the commit that first added the file; an empty value
            # (file not found in history) falls through to the normal
            # check rather than silently suppressing.
            # `head -n1` can SIGPIPE `git log`; the `|| true` keeps that
            # from tripping `set -o pipefail` on this assignment.
            FILE_ADDED=$( { git log --diff-filter=A --format=%aI --reverse -- ".github/workflows/$FILE" 2>/dev/null || true; } | head -n1)
            FILE_ADDED_TS=0
            if [ -n "$FILE_ADDED" ]; then
              FILE_ADDED_TS=$(date -u -d "$FILE_ADDED" +%s 2>/dev/null \
                || date -u -j -f "%Y-%m-%dT%H:%M:%S%z" "$FILE_ADDED" +%s 2>/dev/null \
                || echo 0)
            fi

            SCHED_COUNT=$(echo "$RUN_SCHED" | jq 'length')
            ANY_COUNT=$(echo "$RUN_ANY" | jq 'length')

            if [ "$SCHED_COUNT" -eq 0 ]; then
              # No scheduled run has ever been recorded.
              FILE_AGE=$(( NOW - FILE_ADDED_TS ))
              if [ "$FILE_ADDED_TS" -ne 0 ] && [ "$FILE_AGE" -lt "$MAX_AGE" ]; then
                # The file is newer than the most recent expected cron
                # tick — it simply has not had a chance to run yet.
                FILE_AGE_HOURS=$(( FILE_AGE / 3600 ))
                echo "$FILE: no scheduled run yet, but the file was added only ${FILE_AGE_HOURS}h ago (< ${MAX_AGE_HOURS}h cadence) — too new to have fired, not flagging."
              else
                # Either the file is old enough that a scheduled run was
                # expected, or its add-date could not be determined.
                PROBLEM="No scheduled run found for \`$FILE\`. The workflow may be disabled, or its \`schedule:\` trigger may be malformed."
              fi
            fi

            # --- Fix 2: judge run health across all triggers --------------
            # Evaluate the latest run regardless of trigger event. A green
            # workflow_dispatch run after a fix is treated as healthy even
            # if the newest scheduled run predates the fix.
            if [ -z "$PROBLEM" ] && [ "$ANY_COUNT" -gt 0 ]; then
              STATUS=$(echo "$RUN_ANY" | jq -r '.[0].status')
              CONCLUSION=$(echo "$RUN_ANY" | jq -r '.[0].conclusion')
              EVENT=$(echo "$RUN_ANY" | jq -r '.[0].event')
              RUN_ID=$(echo "$RUN_ANY" | jq -r '.[0].databaseId')

              # Only completed runs carry a conclusion. Treat an in-flight
              # run (status != completed) as healthy — it has not failed.
              # A completed run is unhealthy unless its conclusion is
              # 'success' or 'skipped'; this catches 'failure',
              # 'timed_out', 'startup_failure', and 'cancelled' alike, so a
              # cron that consistently times out still raises an alert.
              if [ "$STATUS" = "completed" ] \
                && [ "$CONCLUSION" != "success" ] \
                && [ "$CONCLUSION" != "skipped" ]; then
                PROBLEM="The most recent run of \`$FILE\` (event: \`$EVENT\`) did not succeed (conclusion: \`$CONCLUSION\`) ([run #$RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID))."
              fi
            fi

            # --- Staleness check (schedule-triggered runs only) -----------
            # Only a scheduled run proves the cron is still firing, so the
            # age check stays on RUN_SCHED. Skipped when an earlier check
            # already found a problem, or when there is no scheduled run
            # (handled by Fix 1 above).
            if [ -z "$PROBLEM" ] && [ "$SCHED_COUNT" -gt 0 ]; then
              CREATED_AT=$(echo "$RUN_SCHED" | jq -r '.[0].createdAt')
              SCHED_RUN_ID=$(echo "$RUN_SCHED" | jq -r '.[0].databaseId')

              RUN_TIME=$(date -u -d "$CREATED_AT" +%s 2>/dev/null \
                || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s 2>/dev/null \
                || echo 0)

              if [ "$RUN_TIME" -eq 0 ]; then
                echo "$FILE: malformed timestamp '$CREATED_AT', skipping staleness check"
              else
                AGE=$(( NOW - RUN_TIME ))
                AGE_HOURS=$(( AGE / 3600 ))
                if [ "$AGE" -gt "$MAX_AGE" ]; then
                  PROBLEM="The most recent scheduled run of \`$FILE\` is **${AGE_HOURS}h old** (expected at most ${MAX_AGE_HOURS}h between runs). The workflow may have been disabled after 60 days of repo inactivity, or its \`schedule:\` trigger may be malformed."
                fi
              fi
            fi

            if [ -z "$PROBLEM" ]; then
              echo "$FILE: healthy"
            fi

            # HTML marker keyed by workflow file so each workflow has its
            # own tracking issue; re-runs update that issue rather than
            # opening duplicates.
            MARKER="<!-- cron-health-monitor:$FILE -->"

            EXISTING=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --search "$MARKER in:body" \
              --json number,body \
              --limit 10 \
              2>/dev/null | jq -r --arg marker "$MARKER" \
              '[.[] | select(.body | contains($marker))] | .[0].number // empty')

            if [ -z "$PROBLEM" ]; then
              # Healthy: close any stale tracking issue so it does not
              # linger after the workflow recovers.
              if [ -n "$EXISTING" ]; then
                echo "$FILE: healthy again, closing tracking issue #$EXISTING"
                gh issue close "$EXISTING" --repo "$REPO" \
                  --comment "$MARKER"$'\n'"\`$FILE\` is healthy again — closing automatically."
              fi
              echo "::endgroup::"
              continue
            fi

            echo "$FILE: PROBLEM — $PROBLEM"

            BODY_FILE=$(mktemp)
            cat >"$BODY_FILE" <<EOF
          $MARKER
          **Cron workflow health alert: \`$FILE\` ($NAME)**

          $PROBLEM

          **What to check:**
          1. Open the [workflow's run history](https://github.com/$REPO/actions/workflows/$FILE) and confirm whether it is still scheduled.
          2. If GitHub has disabled it (60-day repo-inactivity rule), re-enable it from the Actions tab or push any commit to reset the timer.
          3. If the most recent run failed, open the run log and fix the underlying cause.
          4. Confirm the \`schedule:\` cron expression in \`.github/workflows/$FILE\` is well-formed.

          This issue was opened by the \`cron-health-monitor\` workflow. It updates in place on each weekly run and closes automatically once \`$FILE\` is healthy again.
          EOF

            if [ -n "$EXISTING" ]; then
              echo "$FILE: updating tracking issue #$EXISTING"
              gh issue edit "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
              gh issue comment "$EXISTING" --repo "$REPO" \
                --body "$MARKER"$'\n'"Re-checked on $(date -u '+%Y-%m-%d %H:%M UTC') — still unhealthy. Details above have been refreshed."
            else
              echo "$FILE: opening new tracking issue"
              gh issue create --repo "$REPO" \
                --title "Cron workflow unhealthy: $FILE" \
                --body-file "$BODY_FILE"
            fi

            rm -f "$BODY_FILE"
            echo "::endgroup::"
          done
